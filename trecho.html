<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rodovias e Placas R-19</title>
<meta name="theme-color" content="#111111">
<style>
:root {
  --amarelo: #ffd400;
  --amareloHover: #e6be00;
  --preto: #111;
  --cinza: #1e1e1e;
  --cinzaClaro: #2a2a2a;
  --branco: #f5f5f5;
  --cinzaTexto: #b0b0b0;
  --verde: #20a464;
  --vermelho: #d93636;
  --borda: #333;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body {
  background: var(--preto);
  color: var(--branco);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  padding: 12px;
}
header {
  background: #080808;
  border-bottom: 3px solid var(--amarelo);
  padding: 20px 15px;
  text-align: center;
  border-radius: 12px 12px 0 0;
}
header h1 {
  color: var(--amarelo);
  font-size: 1.8rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}
header p {
  color: var(--cinzaTexto);
  font-size: 0.8rem;
  letter-spacing: 1.5px;
  margin-top: 5px;
  text-transform: uppercase;
}
main {
  width: 100%;
  max-width: 1200px;
  margin: 20px auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.painel {
  background: var(--cinza);
  border: 1px solid var(--borda);
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
h2 {
  color: var(--amarelo);
  margin-bottom: 15px;
  font-size: 1.2rem;
  border-bottom: 1px solid var(--borda);
  padding-bottom: 8px;
}
input, select, textarea {
  width: 100%;
  padding: 12px;
  margin: 6px 0 14px;
  background: #141414;
  color: #fff;
  border: 1px solid #444;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
}
input:focus, select:focus {
  border-color: var(--amarelo);
  box-shadow: 0 0 0 2px rgba(255,212,0,0.2);
}
label {
  display: block;
  font-size: 0.8rem;
  color: var(--cinzaTexto);
  margin-bottom: 4px;
  font-weight: 600;
  text-transform: uppercase;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  font-weight: bold;
  cursor: pointer;
  background: var(--amarelo);
  color: var(--preto);
  font-size: 0.9rem;
  transition: filter 0.2s, transform 0.1s;
}
button:hover { filter: brightness(0.9); }
button:active { transform: scale(0.97); }
button.secundario { background: #444; color: white; }
button.perigo { background: var(--vermelho); color: white; }
button.sucesso { background: var(--verde); color: white; }
.oculto { display: none !important; }
.status {
  color: var(--cinzaTexto);
  font-size: 0.85rem;
  text-align: center;
  margin: 10px 0;
}
.grid-rodovias {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 15px;
  margin-top: 15px;
}
.card-rodovia {
  background: var(--cinzaClaro);
  border: 1px solid var(--borda);
  border-left: 4px solid var(--amarelo);
  border-radius: 10px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
}
.card-info strong {
  color: var(--amarelo);
  font-size: 1.1rem;
}
.card-info small {
  display: block;
  color: var(--cinzaTexto);
  margin-top: 4px;
  font-size: 0.85rem;
}
.card-acoes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.card-acoes button {
  flex: 1;
  padding: 8px;
  font-size: 0.8rem;
}
/* Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}
.conteudo-modal {
  background: var(--cinza);
  border: 1px solid var(--borda);
  border-top: 4px solid var(--amarelo);
  border-radius: 14px;
  width: min(100%, 550px);
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
}
.lista-r19 {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 15px 0;
  max-height: 280px;
  overflow-y: auto;
}
.item-r19 {
  background: #141414;
  border: 1px solid #333;
  padding: 12px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.item-r19 div strong {
  color: var(--amarelo);
  font-size: 1rem;
}
.badge-sentido {
  background: rgba(255,212,0,0.15);
  color: var(--amarelo);
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: bold;
  font-size: 0.75rem;
  text-transform: uppercase;
}
footer {
  text-align: center;
  color: #777;
  font-size: 0.75rem;
  padding: 20px;
  border-top: 1px solid #222;
  margin-top: auto;
}
@media(min-width: 1024px) {
  main { max-width: 1300px; }
}
</style>
</head>
<body>

<header>
  <h1>TRECHO</h1>
  <p>Rodovias e Placas R-19</p>
</header>

<main>
  <!-- PESQUISA E LISTAGEM DE RODOVIAS -->
  <section class="painel">
    <h2>Consulta de Rodovias</h2>
    <input id="pesquisaRodovia" type="search" placeholder="Filtrar por código (ex: SP-330), nome ou município...">
    <div id="listaRodovias" class="grid-rodovias">
      <p class="status">Carregando rodovias...</p>
    </div>
  </section>

  <!-- ÁREA ADMINISTRATIVA -->
  <section class="painel">
    <h2>Área do Administrador</h2>
    
    <div id="loginArea">
      <p class="status">Faça login para cadastrar ou gerenciar as placas R-19 encontradas nas rondas.</p>
      <label>Senha</label>
      <input id="adminPasswordInput" type="password" placeholder="Digite a senha de acesso" style="text-align:center; letter-spacing: 2px;">
      <button id="btnLoginAdmin" style="width:100%;">ENTRAR</button>
      <p id="statusLogin" class="status"></p>
    </div>

    <div id="adminArea" class="oculto">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span style="color:var(--verde); font-weight:bold; font-size:0.9rem;">✓ Modo Administrador Ativado</span>
        <button class="secundario" id="btnSairAdmin" style="padding:6px 12px; font-size:0.75rem;">SAIR</button>
      </div>

      <h3 style="color:var(--amarelo); font-size:1rem; margin-bottom:10px;">Adicionar Placa R-19</h3>
      
      <label>Rodovia Selecionada</label>
      <select id="selectRodoviaAdmin">
        <option value="">Selecione uma rodovia da lista...</option>
      </select>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label>Quilômetro (KM)</label>
          <input id="inputKmR19" type="text" placeholder="Ex: 142,5 ou Km 33">
        </div>
        <div>
          <label>Sentido</label>
          <select id="selectSentidoR19">
            <option value="Norte">Norte</option>
            <option value="Sul">Sul</option>
            <option value="Leste">Leste</option>
            <option value="Oeste">Oeste</option>
            <option value="Pista Central">Pista Central</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label>Velocidade Leves</label>
          <input id="inputLevesR19" type="text" placeholder="Ex: 110 km/h">
        </div>
        <div>
          <label>Velocidade Pesados</label>
          <input id="inputPesadosR19" type="text" placeholder="Ex: 90 km/h">
        </div>
      </div>

      <button id="btnSalvarR19" class="sucesso" style="width:100%; margin-top:5px;">SALVAR PLACA R-19</button>
      <p id="statusAdmin" class="status"></p>
    </div>
  </section>
</main>

<!-- MODAL PARA VISUALIZAR AS PLACAS R-19 CADASTRADAS -->
<div id="modalR19" class="modal oculto">
  <div class="conteudo-modal">
    <h2 id="modalRodoviaTitulo" style="font-size: 1.1rem; margin-bottom: 5px;">Placas R-19</h2>
    <p id="modalRodoviaSub" style="color:var(--cinzaTexto); font-size:0.8rem; margin-bottom:15px;"></p>
    
    <div class="lista-r19" id="listaPlacasModal">
      <!-- Preenchido via JS -->
    </div>

    <div style="display:flex; justify-content:flex-end; margin-top:15px;">
      <button id="btnFecharModal" class="secundario">FECHAR</button>
    </div>
  </div>
</div>

<footer>RAPM — Sistema Operacional de Rodovias</footer>

];

let isAdmin = false;
let placasData = {};

async function carregarPlacasDoFirebase() {
    try {
        const querySnapshot = await getDocs(placasCollectionRef);
        placasData = {};
        querySnapshot.forEach((doc) => {
            placasData[doc.id] = doc.data().placas || [];
        });
        renderizarRodovias();
    } catch (e) {
        console.error("Erro ao carregar placas:", e);
        renderizarRodovias();
    }
}

function renderizarRodovias() {
    const filtro = $("pesquisaRodovia").value.toLowerCase().trim();
    const container = $("listaRodovias");
    container.innerHTML = "";

    const filtradas = rodoviasBase.filter(item => {
        const codigoCompleto = (item.codificacao + '-' + item.codigo).toLowerCase();
        const nomeLower = item.nome.toLowerCase();
        const municipioLower = item.municipio.toLowerCase();
        return codigoCompleto.includes(filtro) ||
               nomeLower.includes(filtro) ||
               item.codigo.toLowerCase().includes(filtro) ||
               municipioLower.includes(filtro);
    });

    if (filtradas.length === 0) {
        container.innerHTML = `<p class="status" style="grid-column: 1/-1;">Nenhuma rodovia encontrada.</p>`;
        return;
    }

    filtradas.forEach((rodovia, index) => {
        const idUnico = `${rodovia.codificacao}-${rodovia.codigo}-${index}`;
        const totalPlacas = (placasData[idUnico] || []).length;
        const codigoExibicao = `${rodovia.codificacao}-${rodovia.codigo}`;
        
        const card = document.createElement("div");
        card.className = "card-rodovia";
        card.innerHTML = `
            <div class="card-info">
                <strong>${codigoExibicao} - ${rodovia.nome}</strong>
                <small>📍 Município: <b>${rodovia.municipio}</b></small>
                <small>🛣️ Trecho: Km <b>${rodovia.kmInicial}</b> até <b>${rodovia.kmFinal}</b> (${rodovia.extensao} km)</small>
                <small style="color:var(--amarelo); margin-top:6px;">🛑 Placas R-19 cadastradas: <b>${totalPlacas}</b></small>
            </div>
            <div class="card-acoes">
                <button class="secundario" onclick="abrirModalVisualizar('${idUnico}')">Ver R-19 (${totalPlacas})</button>
                ${isAdmin ? `<button onclick="selecionarParaCadastro('${idUnico}', '${codigoExibicao} - ${rodovia.nome}')">Adicionar R-19</button>` : ''}
            </div>
        `;
        container.appendChild(card);
    });
}

$("pesquisaRodovia").addEventListener("input", renderizarRodovias);

function preencherSelectAdmin() {
    const select = $("selectRodoviaAdmin");
    select.innerHTML = `<option value="">Selecione uma rodovia...</option>`;
    rodoviasBase.forEach((r, index) => {
        const idUnico = `${r.codificacao}-${r.codigo}-${index}`;
        const opt = document.createElement("option");
        opt.value = idUnico;
        opt.textContent = `${r.codificacao}-${r.codigo} - ${r.nome} (${r.municipio})`;
        select.appendChild(opt);
    });
}

$("btnLoginAdmin").addEventListener("click", async () => {
    const senhaDigitada = $("adminPasswordInput").value.trim();
    if (!senhaDigitada) {
        $("statusLogin").textContent = "Digite a senha de administrador.";
        return;
    }

    try {
        const snap = await getDoc(adminConfigRef);
        let senhaCorreta = "3303";

        if (snap.exists() && snap.data().pass) {
            senhaCorreta = snap.data().pass;
        }

        if (senhaDigitada === senhaCorreta) {
            isAdmin = true;
            $("loginArea").classList.add("oculto");
            $("adminArea").classList.remove("oculto");
            preencherSelectAdmin();
            renderizarRodovias();
            $("statusLogin").textContent = "";
        } else {
            $("statusLogin").textContent = "Senha incorreta!";
        }
    } catch (err) {
        console.error(err);
        $("statusLogin").textContent = "Erro ao validar senha.";
    }
});

$("btnSairAdmin").addEventListener("click", () => {
    isAdmin = false;
    $("adminArea").classList.add("oculto");
    $("loginArea").classList.remove("oculto");
    $("adminPasswordInput").value = "";
    renderizarRodovias();
});

window.selecionarParaCadastro = function(rodoviaId, nomeRodovia) {
    $("selectRodoviaAdmin").value = rodoviaId;
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    $("inputKmR19").focus();
};

$("btnSalvarR19").addEventListener("click", async () => {
    const rodoviaId = $("selectRodoviaAdmin").value;
    const km = $("inputKmR19").value.trim();
    const sentido = $("selectSentidoR19").value;
    const leves = $("inputLevesR19").value.trim() || "-";
    const pesados = $("inputPesadosR19").value.trim() || "-";

    if (!rodoviaId || !km) {
        $("statusAdmin").textContent = "Selecione a rodovia e informe o quilômetro (KM).";
        return;
    }

    $("btnSalvarR19").disabled = true;
    $("btnSalvarR19").textContent = "Salvando...";

    try {
        const novaPlaca = {
            id: Date.now().toString(),
            km: km.toLowerCase().includes("km") ? km : `Km ${km}`,
            sentido: sentido,
            leves: leves,
            pesados: pesados,
            cadastradoEm: new Date().toLocaleDateString('pt-BR')
        };

        const docRef = doc(db, "placas_r19", rodoviaId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            await updateDoc(docRef, {
                placas: arrayUnion(novaPlaca)
            });
        } else {
            await setDoc(docRef, {
                rodoviaId: rodoviaId,
                placas: [novaPlaca]
            });
        }

        $("statusAdmin").textContent = "Placa R-19 adicionada com sucesso!";
        $("inputKmR19").value = "";
        $("inputLevesR19").value = "";
        $("inputPesadosR19").value = "";
        
        await carregarPlacasDoFirebase();
        
        setTimeout(() => { $("statusAdmin").textContent = ""; }, 3000);
    } catch (e) {
        console.error("Erro ao salvar:", e);
        $("statusAdmin").textContent = "Erro ao salvar no banco de dados.";
    } finally {
        $("btnSalvarR19").disabled = false;
        $("btnSalvarR19").textContent = "SALVAR PLACA R-19";
    }
});

window.abrirModalVisualizar = function(rodoviaId) {
    const partes = rodoviaId.split("-");
    const indexStr = partes[partes.length - 1];
    const rodoviaInfo = rodoviasBase[parseInt(indexStr, 10)];
    
    if (rodoviaInfo) {
        $("modalRodoviaTitulo").textContent = `${rodoviaInfo.codificacao}-${rodoviaInfo.codigo} - ${rodoviaInfo.nome}`;
        $("modalRodoviaSub").textContent = `Município: ${rodoviaInfo.municipio} | Trecho: Km ${rodoviaInfo.kmInicial} ao ${rodoviaInfo.kmFinal}`;
    }

    const listaContainer = $("listaPlacasModal");
    listaContainer.innerHTML = "";

    const placas = placasData[rodoviaId] || [];

    if (placas.length === 0) {
        listaContainer.innerHTML = `<p class="status">Nenhuma placa R-19 cadastrada nesta rodovia ainda.</p>`;
    } else {
        placas.forEach((p) => {
            const item = document.createElement("div");
            item.className = "item-r19";
            item.innerHTML = `
                <div>
                    <strong>📍 ${p.km}</strong>
                    <div style="font-size:0.82rem; color:#ccc; margin-top:4px;">
                        🚗 Leves: <b style="color:var(--amarelo);">${p.leves}</b> | 🚚 Pesados: <b style="color:var(--amarelo);">${p.pesados}</b>
                    </div>
                    <small style="color:#777; margin-top:2px;">Adicionado em: ${p.cadastradoEm || 'Data não informada'}</small>
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                    <span class="badge-sentido">Sentido ${p.sentido}</span>
                    ${isAdmin ? `<button class="perigo" style="padding:3px 6px; font-size:0.65rem;" onclick="excluirPlacaR19('${rodoviaId}', '${p.id}')">Excluir</button>` : ''}
                </div>
            `;
            listaContainer.appendChild(item);
        });
    }

    $("modalR19").classList.remove("oculto");
};

window.excluirPlacaR19 = async function(rodoviaId, placaId) {
    if (!confirm("Deseja realmente remover este registro de placa R-19?")) return;

    try {
        const docRef = doc(db, "placas_r19", rodoviaId);
        const placasAtuais = placasData[rodoviaId] || [];
        const placaParaRemover = placasAtuais.find(p => p.id === placaId);

        if (placaParaRemover) {
            await updateDoc(docRef, {
                placas: arrayRemove(placaParaRemover)
            });
            await carregarPlacasDoFirebase();
            abrirModalVisualizar(rodoviaId);
        }
    } catch (e) {
        console.error("Erro ao excluir:", e);
        alert("Não foi possível excluir a placa.");
    }
};

$("btnFecharModal").addEventListener("click", () => {
    $("modalR19").classList.add("oculto");
});

carregarPlacasDoFirebase();
</script>

</body>
</html>
