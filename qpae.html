<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preenchimento PM O-004</title>
  <!-- Tailwind CSS para interface responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- pdf-lib para modificar o PDF original preservando 100% do layout -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- fontkit para suporte a fontes no pdf-lib -->
  <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-3">

  <!-- ==================== WIZARD / CAMPO POR CAMPO ==================== -->
  <div id="wizard-container" class="w-full max-w-xl bg-white shadow-2xl rounded-2xl p-6 mt-4">
    <!-- Barra de Progresso -->
    <div class="mb-6">
      <div class="flex justify-between items-center text-xs font-bold text-gray-500 mb-2">
        <span id="step-counter">Passo 1 de 1</span>
        <span id="step-percent" class="text-red-700">0%</span>
      </div>
      <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden">
        <div id="progress-bar" class="bg-red-700 h-3 transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Conteúdo da Pergunta Atual -->
    <div id="step-content" class="min-h-[140px] flex flex-col justify-center my-2">
      <!-- Injetado via JS -->
    </div>

    <!-- Navegação -->
    <div class="flex justify-between items-center pt-6 border-t border-gray-100 mt-4">
      <button id="btn-prev" onclick="prevStep()" class="px-5 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-bold rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        ← Voltar
      </button>
      <button id="btn-next" onclick="nextStep()" class="px-6 py-2.5 bg-red-700 hover:bg-red-800 text-white text-sm font-bold rounded-xl shadow-lg transition">
        Avançar →
      </button>
    </div>
  </div>

  <!-- ==================== PAINEL FINAL ==================== -->
  <div id="final-actions" class="w-full max-w-xl bg-white shadow-2xl rounded-2xl p-6 mt-4 hidden text-center">
    <div class="text-green-600 text-5xl mb-2">✓</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">Formulário Concluído!</h2>
    <p class="text-xs text-gray-500 mb-6">Todos os campos foram inseridos diretamente sobre o documento original PM O-004.</p>
    
    <div class="space-y-3">
      <button onclick="generateAndDownloadPDF()" class="w-full py-3.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg transition flex justify-center items-center gap-2">
        📥 Baixar PDF Original Preenchido
      </button>
      <button onclick="toggleEmailModal()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition flex justify-center items-center gap-2">
        ✉️ Enviar Dados por E-mail
      </button>
      <button onclick="goToStep(0)" class="w-full py-2 text-sm text-gray-600 font-semibold hover:underline">
        ✏️ Voltar e Editar Dados
      </button>
    </div>
  </div>

  <!-- MODAL DE E-MAIL -->
  <div id="email-modal" class="fixed inset-0 bg-black/60 flex justify-center items-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
      <h3 class="text-lg font-bold mb-2 text-gray-800">Enviar por E-mail</h3>
      <p class="text-xs text-gray-500 mb-4">Insira o e-mail de destino para abrir a sua aplicação com a ficha pronta para envio.</p>
      <input type="email" id="email-destination" placeholder="exemplo@policiamilitar.sp.gov.br" class="w-full p-3 border border-gray-300 rounded-xl text-sm mb-4 outline-none focus:ring-2 focus:ring-blue-500">
      <div class="flex justify-end gap-2">
        <button onclick="toggleEmailModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-bold rounded-xl">Cancelar</button>
        <button onclick="sendEmailDirect()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl">Abrir E-mail</button>
      </div>
    </div>
  </div>

  <script>
    // Mapeamento das posições X, Y no documento original PM O-004
    const steps = [
      { id: 'nome', label: 'Nome Completo do Preso', type: 'text', x: 50, y: 720, page: 0 },
      { id: 'vulgo', label: 'Vulgo / Apelido', type: 'text', x: 400, y: 720, page: 0 },
      { id: 'pai', label: 'Nome do Pai', type: 'text', x: 50, y: 700, page: 0 },
      { id: 'mae', label: 'Nome da Mãe', type: 'text', x: 300, y: 700, page: 0 },
      { id: 'rg', label: 'RG', type: 'text', x: 50, y: 680, page: 0 },
      { id: 'dc', label: 'DC/UF', type: 'text', x: 150, y: 680, page: 0 },
      { id: 'outro_doc', label: 'Outro Documento (CPF/CNH)', type: 'text', x: 220, y: 680, page: 0 },
      { id: 'num_doc', label: 'Número / Série', type: 'text', x: 320, y: 680, page: 0 },
      { id: 'sexo', label: 'Sexo', type: 'select', options: ['MASCULINO', 'FEMININO'], x: 420, y: 680, page: 0 },
      { id: 'data_nasc', label: 'Data de Nascimento', type: 'date', x: 480, y: 680, page: 0 },
      { id: 'estado_civil', label: 'Estado Civil', type: 'text', x: 50, y: 660, page: 0 },
      { id: 'naturalidade', label: 'Naturalidade / UF', type: 'text', x: 200, y: 660, page: 0 },
      { id: 'nacionalidade', label: 'Nacionalidade', type: 'text', x: 350, y: 660, page: 0, default: 'BRASILEIRA' },
      { id: 'profissao', label: 'Profissão', type: 'text', x: 450, y: 660, page: 0 },
      { id: 'end_res', label: 'Endereço Residencial', type: 'text', x: 50, y: 640, page: 0 },
      { id: 'bairro_mun', label: 'Bairro e Município Residencial', type: 'text', x: 300, y: 640, page: 0 },
      { id: 'tel', label: 'Telefone Residencial', type: 'text', x: 480, y: 640, page: 0 },
      { id: 'end_trab', label: 'Endereço do Local de Trabalho', type: 'text', x: 50, y: 620, page: 0 },
      { id: 'antecedentes', label: 'Antecedentes Criminais?', type: 'select', options: ['SIM', 'NÃO', 'NÃO PESQUISADO'], x: 350, y: 620, page: 0 },
      
      // Características Físicas
      { id: 'altura', label: 'Altura Aproximada (m)', type: 'text', x: 50, y: 580, page: 0 },
      { id: 'compleicao', label: 'Tipo Físico (Compleição)', type: 'text', x: 180, y: 580, page: 0 },
      { id: 'pele', label: 'Pele (Cútis)', type: 'text', x: 320, y: 580, page: 0 },
      { id: 'cabelo', label: 'Cabelo', type: 'text', x: 420, y: 580, page: 0 },
      { id: 'olhos', label: 'Olhos', type: 'text', x: 50, y: 560, page: 0 },
      { id: 'cod_anat', label: 'Codificação Anatômica / Marcas (D/M/S)', type: 'text', x: 180, y: 560, page: 0 },
      { id: 'desc_tat', label: 'Descrição Sucinta da Tatuagem', type: 'textarea', x: 50, y: 520, page: 0 },

      // Ocorrência
      { id: 'bo_pm', label: 'Número do BO PM', type: 'text', x: 50, y: 460, page: 0 },
      { id: 'opm', label: 'Nome / Cód. OPM', type: 'text', x: 200, y: 460, page: 0 },
      { id: 'viatura', label: 'Prefixo Viatura', type: 'text', x: 400, y: 460, page: 0 },
      { id: 'natureza', label: 'Natureza da Ocorrência', type: 'text', x: 50, y: 440, page: 0 },
      { id: 'data_fato', label: 'Data do Fato', type: 'date', x: 350, y: 440, page: 0 },
      { id: 'hora_fato', label: 'Hora do Fato', type: 'text', x: 480, y: 440, page: 0 },
      { id: 'local_fato', label: 'Logradouro / Bairro / Local', type: 'text', x: 50, y: 420, page: 0 },
      { id: 'situacao', label: 'Situação da Ocorrência', type: 'text', x: 50, y: 400, page: 0 },

      // Apreensões
      { id: 'armas', label: 'Apreensão de Armas de Fogo', type: 'textarea', x: 50, y: 340, page: 0 },
      { id: 'entorpecentes', label: 'Apreensão de Entorpecentes', type: 'textarea', x: 300, y: 340, page: 0 },

      // Modus & DP
      { id: 'modus', label: 'Modus Operandi do Qualificado', type: 'textarea', x: 50, y: 260, page: 0 },
      { id: 'obs', label: 'Observações Gerais', type: 'textarea', x: 50, y: 200, page: 0 },
      { id: 'bo_pc', label: 'Número do DP e BO PC', type: 'text', x: 50, y: 120, page: 0 },
      { id: 'encarregado', label: 'Encarregado (Posto/Grad./RE/Nome)', type: 'text', x: 250, y: 120, page: 0 }
    ];

    let currentStep = 0;
    const formData = {};

    function renderStep() {
      const step = steps[currentStep];
      const stepContent = document.getElementById('step-content');
      
      document.getElementById('step-counter').innerText = `Passo ${currentStep + 1} de ${steps.length}`;
      const percent = Math.round(((currentStep + 1) / steps.length) * 100);
      document.getElementById('step-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      let inputHtml = '';
      const currentValue = formData[step.id] || step.default || '';

      if (step.type === 'select') {
        inputHtml = `
          <select id="input-field" class="w-full p-4 border-2 border-red-700 rounded-xl text-base font-bold bg-white outline-none">
            <option value="">-- SELECIONE --</option>
            ${step.options.map(opt => `<option value="${opt}" ${currentValue === opt ? 'selected' : ''}>${opt}</option>`).join('')}
          </select>
        `;
      } else if (step.type === 'textarea') {
        inputHtml = `
          <textarea id="input-field" rows="3" class="w-full p-4 border-2 border-red-700 rounded-xl text-base font-bold uppercase outline-none" placeholder="${step.placeholder || ''}">${currentValue}</textarea>
        `;
      } else {
        inputHtml = `
          <input type="${step.type}" id="input-field" value="${currentValue}" placeholder="${step.placeholder || ''}" class="w-full p-4 border-2 border-red-700 rounded-xl text-base font-bold uppercase outline-none">
        `;
      }

      stepContent.innerHTML = `
        <label class="block text-xs font-black text-gray-600 mb-2 uppercase tracking-wider">${step.label}</label>
        ${inputHtml}
      `;

      document.getElementById('btn-prev').disabled = currentStep === 0;
      
      if (currentStep === steps.length - 1) {
        document.getElementById('btn-next').innerText = 'Finalizar ✔';
        document.getElementById('btn-next').className = 'px-6 py-2.5 bg-green-600 hover:bg-green-700 text-white text-sm font-bold rounded-xl shadow-lg transition';
      } else {
        document.getElementById('btn-next').innerText = 'Avançar →';
        document.getElementById('btn-next').className = 'px-6 py-2.5 bg-red-700 hover:bg-red-800 text-white text-sm font-bold rounded-xl shadow-lg transition';
      }

      const field = document.getElementById('input-field');
      field.focus();
      if (step.type !== 'textarea') {
        field.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') nextStep();
        });
      }
    }

    function saveCurrentStepValue() {
      const step = steps[currentStep];
      const field = document.getElementById('input-field');
      if (field) {
        formData[step.id] = field.value.toUpperCase();
      }
    }

    function nextStep() {
      saveCurrentStepValue();
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep();
      } else {
        document.getElementById('wizard-container').classList.add('hidden');
        document.getElementById('final-actions').classList.remove('hidden');
      }
    }

    function prevStep() {
      saveCurrentStepValue();
      if (currentStep > 0) {
        currentStep--;
        renderStep();
      }
    }

    function goToStep(index) {
      currentStep = index;
      document.getElementById('wizard-container').classList.remove('hidden');
      document.getElementById('final-actions').classList.add('hidden');
      renderStep();
    }

    // Carrega modelo.pdf e preenche dinamicamente
    async function generateAndDownloadPDF() {
      try {
        const existingPdfBytes = await fetch('./modelo.pdf').then(res => res.arrayBuffer());
        
        const { PDFDocument, rgb } = PDFLib;
        const pdfDoc = await PDFDocument.load(existingPdfBytes);
        const pages = pdfDoc.getPages();
        const firstPage = pages[0];

        steps.forEach(step => {
          const val = formData[step.id];
          if (val) {
            firstPage.drawText(String(val), {
              x: step.x,
              y: step.y,
              size: 9,
              color: rgb(0, 0, 0)
            });
          }
        });

        const pdfBytes = await pdfDoc.save();
        
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `PM_O-004_${formData.nome || 'PRESO'}.pdf`;
        link.click();
      } catch (err) {
        alert('Atenção: Verifique se o ficheiro "modelo.pdf" está na mesma pasta no GitHub/Celular.');
        console.error(err);
      }
    }

    function toggleEmailModal() {
      document.getElementById('email-modal').classList.toggle('hidden');
    }

    function sendEmailDirect() {
      const destEmail = document.getElementById('email-destination').value;
      if (!destEmail) return alert('Insira um e-mail válido.');

      const subject = encodeURIComponent(`RELATÓRIO PM O-004: ${formData.nome || ''}`);
      const body = encodeURIComponent(
        `RELATÓRIO DA OCORRÊNCIA PM O-004\n\n` +
        `NOME: ${formData.nome || ''}\n` +
        `VULGO: ${formData.vulgo || ''}\n` +
        `RG: ${formData.rg || ''}\n` +
        `BO PM: ${formData.bo_pm || ''}\n` +
        `NATUREZA: ${formData.natureza || ''}\n` +
        `ARMAS: ${formData.armas || 'Nenhuma'}\n` +
        `ENTORPECENTES: ${formData.entorpecentes || 'Nenhum'}\n` +
        `ENCARREGADO: ${formData.encarregado || ''}`
      );

      window.location.href = `mailto:${destEmail}?subject=${subject}&body=${body}`;
      toggleEmailModal();
    }

    window.onload = renderStep;
  </script>
</body>
</html>
