<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha PM O-004</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bibliotecas para manipulação de arquivos Word (.docx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-3">

  <div class="w-full max-w-2xl bg-white shadow-2xl rounded-2xl p-6 mt-2 mb-10">
    <div class="border-b pb-4 mb-6 text-center">
      <h1 class="text-2xl font-black text-gray-800 uppercase">Qualificação de Preso (PM O-004)</h1>
      <p class="text-xs text-gray-500 mt-1">Preenchimento contínuo para geração de arquivo Word (.docx)</p>
    </div>

    <form id="pm-form" onsubmit="event.preventDefault();" class="space-y-4">
      
      <!-- SEÇÃO 1: DADOS DO PRESO -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
        <h2 class="text-sm font-bold text-red-700 uppercase tracking-wider mb-2">1. Dados Pessoais do Preso</h2>
        
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Nome Completo do Preso</label>
          <input type="text" id="NOME" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Vulgo / Apelido</label>
            <input type="text" id="VULGO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Sexo</label>
            <select id="SEXO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm bg-white">
              <option value="">-- SELECIONE --</option>
              <option value="MASCULINO">MASCULINO</option>
              <option value="FEMININO">FEMININO</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Nome do Pai</label>
            <input type="text" id="PAI" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Nome da Mãe</label>
            <input type="text" id="MAE" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">RG</label>
            <input type="text" id="RG" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">DC / UF</label>
            <input type="text" id="DC" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Outro Doc / CPF</label>
            <input type="text" id="OUTRO_DOC" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Número / Série</label>
            <input type="text" id="NUM_DOC" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Data de Nascimento</label>
            <input type="text" id="DATA_NASC" placeholder="DD/MM/AAAA" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Estado Civil</label>
            <input type="text" id="ESTADO_CIVIL" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Naturalidade / UF</label>
            <input type="text" id="NATURALIDADE" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Nacionalidade</label>
            <input type="text" id="NACIONALIDADE" value="BRASILEIRA" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Profissão</label>
          <input type="text" id="PROFISSAO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Endereço Residencial</label>
          <input type="text" id="END_RES" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Bairro e Município</label>
            <input type="text" id="BAIRRO_MUN" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Telefone Residencial</label>
            <input type="text" id="TEL" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Endereço do Trabalho</label>
          <input type="text" id="END_TRAB" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Antecedentes Criminais?</label>
          <select id="ANTECEDENTES" class="w-full p-3 border rounded-xl font-bold uppercase text-sm bg-white">
            <option value="">-- SELECIONE --</option>
            <option value="SIM">SIM</option>
            <option value="NÃO">NÃO</option>
            <option value="NÃO PESQUISADO">NÃO PESQUISADO</option>
          </select>
        </div>
      </div>

      <!-- SEÇÃO 2: CARACTERÍSTICAS FÍSICAS -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
        <h2 class="text-sm font-bold text-red-700 uppercase tracking-wider mb-2">2. Características Físicas</h2>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Altura (m)</label>
            <input type="text" id="ALTURA" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Tipo Físico (Compleição)</label>
            <input type="text" id="COMPLEICAO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Pele (Cútis)</label>
            <input type="text" id="PELE" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Cabelo</label>
            <input type="text" id="CABELO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Olhos</label>
            <input type="text" id="OLHOS" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>
      </div>

      <!-- SEÇÃO 3: DADOS DA OCORRÊNCIA -->
      <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
        <h2 class="text-sm font-bold text-red-700 uppercase tracking-wider mb-2">3. Dados da Ocorrência</h2>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">BO PM / Viatura</label>
          <input type="text" id="BO_PM" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Natureza da Ocorrência</label>
          <input type="text" id="NATUREZA" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Data do Fato</label>
            <input type="text" id="DATA_FATO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Hora do Fato</label>
            <input type="text" id="HORA_FATO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Local do Fato</label>
          <input type="text" id="LOCAL_FATO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Apreensão de Armas</label>
          <textarea id="ARMAS" rows="2" class="w-full p-3 border rounded-xl font-bold uppercase text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Apreensão de Entorpecentes</label>
          <textarea id="ENTORPECENTES" rows="2" class="w-full p-3 border rounded-xl font-bold uppercase text-sm"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">DP / BO PC / Unidade</label>
          <input type="text" id="BO_PC" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Encarregado (RE / Nome)</label>
          <input type="text" id="ENCARREGADO" class="w-full p-3 border rounded-xl font-bold uppercase text-sm">
        </div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div class="pt-4 space-y-3">
        <button type="button" onclick="toggleEmailModal()" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg text-base">
          ✉️ Enviar por E-mail (.docx)
        </button>
        <button type="button" onclick="generateAndDownloadDoc()" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg text-sm">
          📥 Baixar Arquivo Word (.docx)
        </button>
      </div>

    </form>
  </div>

  <!-- MODAL DE E-MAIL -->
  <div id="email-modal" class="fixed inset-0 bg-black/60 flex justify-center items-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md">
      <h3 class="text-lg font-bold mb-2 text-gray-800">Enviar por E-mail</h3>
      <p class="text-xs text-gray-500 mb-4">Insira o e-mail de destino. O documento Word (.docx) preenchido será enviado em anexo.</p>

      <input type="email" id="email-destination" placeholder="exemplo@policiamilitar.sp.gov.br" class="w-full p-3 border border-gray-300 rounded-xl text-sm mb-4 outline-none focus:ring-2 focus:ring-blue-500">

      <div id="email-status" class="text-xs mb-3 font-bold text-center"></div>

      <div class="flex justify-end gap-2">
        <button onclick="toggleEmailModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm font-bold rounded-xl">Cancelar</button>
        <button id="btn-send-now" onclick="sendDocByEmail()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl">Enviar Agora</button>
      </div>
    </div>
  </div>

  <script>
    // Cole a URL do seu Google Apps Script na constante abaixo
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSE3ZgXcwHDqIKtCwWtCltwWt-wT8iCovi5SXf3SfExfJTAMdCsVEbsImVBJ6x6IE/exec';

    const fieldsList = [
      'NOME', 'VULGO', 'PAI', 'MAE', 'RG', 'DC', 'OUTRO_DOC', 'NUM_DOC',
      'SEXO', 'DATA_NASC', 'ESTADO_CIVIL', 'NATURALIDADE', 'NACIONALIDADE',
      'PROFISSAO', 'END_RES', 'BAIRRO_MUN', 'TEL', 'END_TRAB', 'ANTECEDENTES',
      'ALTURA', 'COMPLEICAO', 'PELE', 'CABELO', 'OLHOS', 'BO_PM', 'NATUREZA',
      'DATA_FATO', 'HORA_FATO', 'LOCAL_FATO', 'ARMAS', 'ENTORPECENTES', 'BO_PC', 'ENCARREGADO'
    ];

    function getFormData() {
      const data = {};
      fieldsList.forEach(id => {
        const el = document.getElementById(id);
        data[id] = el ? el.value.toUpperCase() : '';
      });
      return data;
    }

    async function generateDocxBlob() {
      const response = await fetch('./modelo.docx');
      if (!response.ok) {
        throw new Error('Arquivo modelo.docx não foi encontrado no servidor.');
      }
      const content = await response.arrayBuffer();
      const zip = new PizZip(content);
      const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

      doc.render(getFormData());

      return doc.getZip().generate({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      });
    }

    async function generateAndDownloadDoc() {
      try {
        const out = await generateDocxBlob();
        const data = getFormData();
        const fileName = `PM_O-004_${data.NOME || 'DOCUMENTO'}.docx`;
        saveAs(out, fileName);
      } catch (err) {
        alert('Erro ao gerar arquivo Word. Verifique se o modelo.docx está enviado na mesma pasta no GitHub.');
      }
    }

    function toggleEmailModal() {
      document.getElementById('email-modal').classList.toggle('hidden');
    }

    function blobToBase64(blob) {
      return new Promise((resolve, _) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    }

    async function sendDocByEmail() {
      const emailDest = document.getElementById('email-destination').value;
      const statusDiv = document.getElementById('email-status');
      const btnSend = document.getElementById('btn-send-now');

      if (!emailDest) {
        statusDiv.className = 'text-xs mb-3 font-bold text-center text-red-600';
        statusDiv.innerText = 'Por favor, insira o e-mail de destino.';
        return;
      }

      btnSend.disabled = true;
      statusDiv.className = 'text-xs mb-3 font-bold text-center text-blue-600';
      statusDiv.innerText = 'Gerando documento Word e enviando...';

      try {
        const docxBlob = await generateDocxBlob();
        const base64Doc = await blobToBase64(docxBlob);
        const data = getFormData();

        const payload = {
          emailDestino: emailDest,
          nomePreso: data.NOME,
          fileName: `PM_O-004_${data.NOME || 'OCORRENCIA'}.docx`,
          fileBase64: base64Doc
        };

        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusDiv.className = 'text-xs mb-3 font-bold text-center text-green-600';
        statusDiv.innerText = '✓ E-mail enviado com sucesso com o documento Word anexado!';
        setTimeout(() => toggleEmailModal(), 2500);
      } catch (err) {
        statusDiv.className = 'text-xs mb-3 font-bold text-center text-red-600';
        statusDiv.innerText = 'Erro ao enviar o e-mail. Tente novamente.';
      } finally {
        btnSend.disabled = false;
      }
    }
  </script>
</body>
</html>
