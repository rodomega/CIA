<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Escala</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .widget-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
    }
    input {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
    }
    button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <input type="text" id="escalaId" placeholder="Digite o ID da Escala">
    <button onclick="buscarEscala()">Visualizar Escala</button>
  </div>

  <script>
    function buscarEscala() {
      const id = document.getElementById('escalaId').value.trim();
      if (id) {
        // Redireciona diretamente para a sua página de consulta passando o ID
        window.location.href = `https://rodomega.github.io/CIA/consulta.html?id=${encodeURIComponent(id)}`;
      } else {
        alert('Por favor, introduza um ID válido.');
      }
    }
  </script>

</body>
</html>
