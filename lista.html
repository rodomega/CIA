<style>
:root{--amarelo:#ffd400;--preto:#202020;--fundo:#f3f4f6;--borda:#dedede;--verde:#16864e;--vermelho:#c83232}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:#222;font-family:Arial,Helvetica,sans-serif;line-height:1.45}
header{background:#202020;color:#ffd400;border-bottom:4px solid var(--amarelo);padding:20px 12px;text-align:center}
header h1{margin:0;font-size:clamp(23px,4vw,32px);letter-spacing:2px}
main{width:min(100% - 24px,1050px);margin:22px auto}
.painel{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #0000000a}

label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
input,select{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:7px;font-size:15px;background:#fff;color:#222}

button.perigo{background:var(--vermelho);color:#fff}
button.btn-mini{padding:6px 11px;margin:0;font-size:12px}
button:disabled{opacity:.55;cursor:wait}
.oculto{display:none!important}
.status{font-size:13px;color:#444;margin-top:8px;white-space:pre-wrap}
.resumo{background:#fffbea;border:1px solid #e4d47b;border-radius:8px;padding:12px;margin:14px 0;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
.resumo strong{display:block;color:#8b6b00;font-size:18px}
.resumo span{font-size:12px;color:#555}
.card-verde{border-left:4px solid var(--verde);padding-left:10px}
.card-vermelho{border-left:4px solid var(--vermelho);padding-left:10px}
.card-amarelo{border-left:4px solid #d4a800;padding-left:10px}
.grupo-opm{border:1px solid #ddd;border-left:4px solid var(--amarelo);border-radius:10px;padding:14px;margin:14px 0;background:#fff}
.grupo-opm-titulo{font-weight:bold;font-size:17px;padding-bottom:8px;border-bottom:1px solid #ddd}
.grupo-cia-titulo{font-weight:bold;background:#eee;padding:9px 10px;border-radius:6px;margin:12px 0 8px}
.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #ddd;padding:8px;text-align:left;white-space:nowrap}
th{background:#eee}
.acoes{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.foto-box{display:flex;flex-direction:column;align-items:center;text-align:center;background:#f8f8f8;border:1px solid #ddd;border-left:4px solid var(--amarelo);border-radius:10px;padding:14px;margin:14px 0}
.foto-controles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;width:100%;max-width:680px;margin-top:6px}
.foto-controles > div{flex:1 1 180px;text-align:left}
.slots-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:680px;margin-top:12px}
.slot-card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.slot-card img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid #ccc}
footer{text-align:center;color:#777;font-size:11px;padding:20px;border-top:1px solid #ddd;margin-top:32px}
.credito-dev{margin-top:6px;font-weight:bold;color:#555}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9999}
.modal-card{background:#fff;border-radius:12px;border-top:5px solid var(--amarelo);width:min(100%,820px);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.modal-head{background:#202020;color:#ffd400;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-head strong{font-size:15px}
.modal-body{padding:14px;overflow:auto;background:#f8f9fa;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:10px}
.modal-body img{max-width:100%;max-height:68vh;border-radius:8px;border:1px solid #ccc}
.modal-body iframe{width:100%;height:68vh;border:1px solid #ccc;border-radius:8px;background:#fff}
.modal-foot{padding:10px 16px;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

@media(max-width:720px){.slots-preview{grid-template-columns:1fr}.painel{padding:14px}button{max-width:100%}}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  setDoc,
  deleteDoc,
  doc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDGMKQW7e_2gl3_VEPxBfxAD2nubvmFwQ",
  authDomain: "ordemservico-dc112.firebaseapp.com",
  projectId: "ordemservico-dc112",
  storageBucket: "ordemservico-dc112.firebasestorage.app",
  messagingSenderId: "1062507814991",
  appId: "1:1062507814991:web:4bd85ddd56d3d6086dca3a",
  measurementId: "G-5491XBMX00"
};

const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch (e) {}
const db = getFirestore(app);

const COLECAO_PEDIDOS = "pedidos_bone_pmrv";
const DOC_FOTO_DEMO = doc(db, "config_bone_pmrv", "demonstracao");
const VALOR_UNITARIO = 30;
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzc5G8pFH1L_T0aL-QLwEvKHWrJK9cI5fMkzbfsc_BKGgj3Eyr1rJyjz3d8xt01PArb/exec";

const PESO_GRADUACAO = {
  "Coronel": 1,
  "Tenente Coronel": 2,
  "Major": 3,
  "Capitão": 4,
  "1° Tenente": 5,
  "2° Tenente": 6,
  "Aspirante": 7,
  "Sub Tenente": 8,
  "1° Sargento": 9,
  "2° Sargento": 10,
  "3° Sargento": 11,
  "Cabo": 12,
  "Soldado": 13
};

const $ = id => document.getElementById(id);
let pedidos = [];
let slotsFotos = ["33045.jpg", "", ""];

function formatarMoeda(v) {
  return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function setStatus(id, msg) {
  const el = $(id);
  if (el) el.textContent = msg || "";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  }[c]));
}

function pesoGraduacao(grad) {
  return PESO_GRADUACAO[String(grad || "").trim()] ?? 99;
}

function corBonePorGraduacao(grad) {
  const g = String(grad || "").trim();
  if (g === "Soldado" || g === "Cabo") {
    return "verde";
  }
  if (
    g === "3° Sargento" ||
    g === "2° Sargento" ||
    g === "1° Sargento" ||
    g === "Sub Tenente"
  ) {
    return "vermelho";
  }
  if (
    g === "Aspirante" ||
    g === "2° Tenente" ||
    g === "1° Tenente" ||
    g === "Capitão" ||
    g === "Major" ||
    g === "Tenente Coronel" ||
    g === "Coronel"
  ) {
    return "amarelo";
  }
  return "outros";
}

function normalizarOpm(valor) {
  const limpo = String(valor || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ");

  if (/^CPRV\s*GT$/i.test(limpo)) {
    return "CPRV GT";
  }
  if (/^CPRV\s*EM$/i.test(limpo)) {
    return "CPRV EM";
  }

  const matchBprv = limpo.match(/^([1-6])\s*[°ºª]?\s*BPRV$/i);
  if (matchBprv) {
    return `${matchBprv[1]}° BPRV`;
  }

  return limpo || "SEM OPM";
}

function extrairDriveId(url) {
  if (!url) return "";
  const m1 = String(url).match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (m1) return m1[1];
  const m2 = String(url).match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m2 ? m2[1] : "";
}

function resolverUrlImagem(url) {
  const driveId = extrairDriveId(url);
  if (driveId) return `https://drive.google.com/thumbnail?id=${driveId}&sz=w1400`;
  return url;
}

function resolverUrlPreviewPdf(url) {
  const driveId = extrairDriveId(url);
  if (driveId) return `https://drive.google.com/file/d/${driveId}/preview`;
  return url;
}

function arquivoParaBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (ev) => resolve(ev.target.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function enviarArquivoDrive(file) {
  const fileBase64 = await arquivoParaBase64(file);
  const gasResponse = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      fileName: file.name || "arquivo",
      mimeType: file.type || "application/octet-stream",
      fileContent: fileBase64
    })
  });
  const gasResult = await gasResponse.json();
  if (!gasResult.success || !gasResult.fileUrl) {
    throw new Error("Apps Script: " + (gasResult.error || "erro desconhecido"));
  }
  return gasResult.fileUrl;
}

function renderizarSlotsFotos() {
  const wrap = $("slotsPreview");
  wrap.innerHTML = "";

  [0, 1, 2].forEach((idx) => {
    const url = slotsFotos[idx] || "";
    const card = document.createElement("div");
    card.className = "slot-card";

    const titulo = document.createElement("strong");
    titulo.textContent = idx === 0 ? "Foto 1 (Principal)" : `Foto ${idx + 1}`;
    card.appendChild(titulo);

    if (url) {
      const img = document.createElement("img");
      img.src = resolverUrlImagem(url);
      img.alt = `Foto ${idx + 1}`;
      img.addEventListener("error", () => {
        if (idx === 0 && img.src !== "33045.jpg") {
          img.src = "33045.jpg";
        }
      });
      card.appendChild(img);

      const btnLimpar = document.createElement("button");
      btnLimpar.type = "button";
      btnLimpar.className = "perigo btn-mini";
      btnLimpar.textContent = "REMOVER";
      btnLimpar.addEventListener("click", () => removerSlotFoto(idx));
      card.appendChild(btnLimpar);
    } else {
      const vazio = document.createElement("span");
      vazio.style.color = "#777";
      vazio.style.padding = "28px 0";
      vazio.textContent = "Sem foto cadastrada";
      card.appendChild(vazio);
    }

    wrap.appendChild(card);
  });
}

async function salvarSlotsNoFirestore() {
  const fotosAtivas = slotsFotos.filter(Boolean);
  await setDoc(DOC_FOTO_DEMO, {
    fotosUrl: fotosAtivas,
    slotsFotos: slotsFotos,
    fotoUrl: slotsFotos[0] || "33045.jpg",
    atualizadoEm: serverTimestamp()
  }, { merge: true });
}

async function removerSlotFoto(idx) {
  if (!confirm(`Remover a Foto ${idx + 1} da demonstração?`)) return;
  $("btnSalvarFotoDrive").disabled = true;
  setStatus("statusFoto", `Removendo Foto ${idx + 1}...`);
  try {
    slotsFotos[idx] = idx === 0 ? "33045.jpg" : "";
    await salvarSlotsNoFirestore();
    renderizarSlotsFotos();
    setStatus("statusFoto", `Foto ${idx + 1} removida com sucesso.`);
  } catch (err) {
    console.error(err);
    setStatus("statusFoto", "Erro ao remover foto: " + (err.message || err));
  } finally {
    $("btnSalvarFotoDrive").disabled = false;
  }
}

async function carregarSlotsFotos() {
  try {
    const snap = await getDoc(DOC_FOTO_DEMO);
    if (snap.exists()) {
      const d = snap.data() || {};
      if (Array.isArray(d.slotsFotos)) {
        slotsFotos = [
          String(d.slotsFotos[0] || d.fotoUrl || "33045.jpg").trim(),
          String(d.slotsFotos[1] || "").trim(),
          String(d.slotsFotos[2] || "").trim()
        ];
      } else if (Array.isArray(d.fotosUrl) && d.fotosUrl.length) {
        slotsFotos = [
          String(d.fotosUrl[0] || "33045.jpg").trim(),
          String(d.fotosUrl[1] || "").trim(),
          String(d.fotosUrl[2] || "").trim()
        ];
      } else if (d.fotoUrl) {
        slotsFotos = [String(d.fotoUrl).trim(), "", ""];
      }
    }
  } catch (err) {
    console.warn("Não foi possível carregar fotos de demonstração:", err);
  }
  renderizarSlotsFotos();
}

$("btnSalvarFotoDrive").addEventListener("click", async () => {
  const idx = parseInt($("slotFoto").value, 10) || 0;
  const arquivo = $("uploadFoto").files?.[0];
  if (!arquivo) {
    setStatus("statusFoto", "Selecione uma imagem primeiro.");
    return;
  }
  if (!arquivo.type.startsWith("image/")) {
    setStatus("statusFoto", "Selecione uma imagem válida.");
    return;
  }
  if (arquivo.size > 6 * 1024 * 1024) {
    setStatus("statusFoto", "A imagem ultrapassa 6 MB.");
    return;
  }

  $("btnSalvarFotoDrive").disabled = true;
  setStatus("statusFoto", `Enviando Foto ${idx + 1} ao Google Drive...`);
  try {
    const urlDrive = await enviarArquivoDrive(arquivo);
    slotsFotos[idx] = urlDrive;
    await salvarSlotsNoFirestore();
    renderizarSlotsFotos();

    $("uploadFoto").value = "";
    setStatus("statusFoto", `Foto ${idx + 1} publicada com sucesso sem alterar as demais!`);
  } catch (err) {
    console.error(err);
    setStatus("statusFoto", "Erro ao salvar foto: " + (err.message || err));
  } finally {
    $("btnSalvarFotoDrive").disabled = false;
  }
});

async function carregarPedidos() {
  setStatus("statusAcoes", "Carregando pedidos do Firebase...");
  try {
    const q = query(collection(db, COLECAO_PEDIDOS), orderBy("criadoEm", "asc"));
    const snap = await getDocs(q);
    pedidos = snap.docs.map((docSnap) => {
      const d = docSnap.data() || {};
      const qtd = Number(d.quantidade) || 0;
      const val = Number(d.valorTotal);
      return {
        id: docSnap.id,
        graduacao: String(d.graduacao || "").trim(),
        re: String(d.re || "").trim(),
        nomeGuerra: String(d.nomeGuerra || "").trim(),
        nomeCompleto: String(d.nomeCompleto || "").trim(),
        opm: String(d.opm || "").trim(),
        subunidade: String(d.subunidade || "").trim(),
        quantidade: qtd,
        valorTotal: val > 0 ? val : qtd * VALOR_UNITARIO,
        comprovanteUrl: String(d.comprovanteUrl || "").trim(),
        comprovanteTipo: String(d.comprovanteTipo || "").trim()
      };
    });

    renderizarLista();
    setStatus("statusAcoes", `Lista sincronizada (${pedidos.length} registro(s)).`);
  } catch (err) {
    console.error(err);
    setStatus("statusAcoes", "Erro ao carregar lista do Firebase: " + (err.message || err));
  }
}

$("btnAtualizar").addEventListener("click", carregarPedidos);

function calcularValorItem(p) {
  const qtd = Number(p.quantidade) || 0;
  const val = Number(p.valorTotal);
  return val > 0 ? val : qtd * VALOR_UNITARIO;
}

function agruparPorOpmECia(lista) {
  const mapaOpm = new Map();
  for (const p of lista) {
    const opm = normalizarOpm(p.opm);
    const cia = String(p.subunidade || "").trim() || "SEM CIA";
    if (!mapaOpm.has(opm)) mapaOpm.set(opm, new Map());
    if (!mapaOpm.get(opm).has(cia)) mapaOpm.get(opm).set(cia, []);
    mapaOpm.get(opm).get(cia).push(p);
  }

  return [...mapaOpm.keys()]
    .sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }))
    .map((opm) => ({
      opm,
      cias: [...mapaOpm.get(opm).keys()]
        .sort((a, b) => a.localeCompare(b, "pt-BR", { numeric: true }))
        .map((cia) => {
          const itensOrdenados = [...mapaOpm.get(opm).get(cia)].sort((a, b) => {
            const diffGrad = pesoGraduacao(a.graduacao) - pesoGraduacao(b.graduacao);
            if (diffGrad !== 0) return diffGrad;
            return String(a.nomeGuerra || "").localeCompare(String(b.nomeGuerra || ""), "pt-BR");
          });
          return {
            cia,
            itens: itensOrdenados
          };
        })
    }));
}

function abrirModalComprovante(pedido) {
  if (!pedido || !pedido.comprovanteUrl) return;

  $("modalTitulo").textContent = `Comprovante — ${pedido.graduacao} ${pedido.nomeGuerra} (${normalizarOpm(pedido.opm)} / ${pedido.subunidade})`;
  $("linkAbrirNovaAba").href = pedido.comprovanteUrl;

  const url = pedido.comprovanteUrl;
  const isPdf = pedido.comprovanteTipo === "application/pdf" || /\.pdf(\?|$)/i.test(url);

  if (isPdf) {
    const previewUrl = resolverUrlPreviewPdf(url);
    $("modalConteudo").innerHTML = `
      <iframe src="${esc(previewUrl)}" title="Comprovante PDF"></iframe>
      <span class="status">Se o PDF não aparecer dentro da caixa, use "ABRIR EM NOVA ABA".</span>
    `;
  } else {
    const imgUrl = resolverUrlImagem(url);
    $("modalConteudo").innerHTML = `
      <img id="imgComprovanteModal" src="${esc(imgUrl)}" alt="Comprovante Pix">
      <span id="avisoImgModal" class="status"></span>
    `;
    const imgEl = $("imgComprovanteModal");
    if (imgEl && imgUrl !== url) {
      imgEl.addEventListener("error", () => {
        imgEl.src = url;
        setStatus("avisoImgModal", "Caso a imagem não carregue aqui, clique em ABRIR EM NOVA ABA.");
      }, { once: true });
    }
  }

  $("modalComprovante").classList.remove("oculto");
}

function fecharModalComprovante() {
  $("modalComprovante").classList.add("oculto");
  $("modalConteudo").innerHTML = "";
}

$("btnFecharModalTopo").addEventListener("click", fecharModalComprovante);
$("btnFecharModalBase").addEventListener("click", fecharModalComprovante);
$("modalComprovante").addEventListener("click", (e) => {
  if (e.target === $("modalComprovante")) fecharModalComprovante();
});

async function excluirPedido(pedido) {
  if (!pedido || !pedido.id) return;
  if (!confirm(`Excluir o pedido de ${pedido.graduacao} ${pedido.nomeGuerra}?`)) return;

  setStatus("statusAcoes", "Excluindo registro...");
  try {
    await deleteDoc(doc(db, COLECAO_PEDIDOS, pedido.id));
    await carregarPedidos();
  } catch (err) {
    console.error(err);
    setStatus("statusAcoes", "Erro ao excluir: " + (err.message || err));
  }
}

function renderizarLista() {
  const totalPessoas = pedidos.length;
  const totalBones = pedidos.reduce((acc, p) => acc + (Number(p.quantidade) || 0), 0);
  const totalValor = pedidos.reduce((acc, p) => acc + calcularValorItem(p), 0);

  let qtdVerdes = 0;
  let qtdVermelhos = 0;
  let qtdAmarelos = 0;

  for (const p of pedidos) {
    const qtd = Number(p.quantidade) || 0;
    const cor = corBonePorGraduacao(p.graduacao);
    if (cor === "verde") qtdVerdes += qtd;
    else if (cor === "vermelho") qtdVermelhos += qtd;
    else if (cor === "amarelo") qtdAmarelos += qtd;
  }

  $("resumoGeral").innerHTML = `
    <div><span>Total de pessoas</span><strong>${totalPessoas}</strong></div>
    <div><span>Total de bonés</span><strong>${totalBones}</strong></div>
    <div><span>Valor total previsto</span><strong>${formatarMoeda(totalValor)}</strong></div>
  `;

  $("resumoCoresBone").innerHTML = `
    <div class="card-verde"><span>Bonés Verdes (Sd / Cb)</span><strong>${qtdVerdes}</strong></div>
    <div class="card-vermelho"><span>Bonés Vermelhos (3° Sgt a Sub Ten)</span><strong>${qtdVermelhos}</strong></div>
    <div class="card-amarelo"><span>Bonés Amarelos (Asp a Cel)</span><strong>${qtdAmarelos}</strong></div>
  `;

  if (!pedidos.length) {
    $("listaAgrupada").innerHTML = '<p class="status">Nenhum pedido registrado até o momento.</p>';
    return;
  }

  let html = "";
  for (const go of agruparPorOpmECia(pedidos)) {
    let qo = 0, vo = 0;
    go.cias.forEach((c) => c.itens.forEach((p) => {
      qo += Number(p.quantidade) || 0;
      vo += calcularValorItem(p);
    }));

    html += `<div class="grupo-opm">
      <div class="grupo-opm-titulo">OPM: ${esc(go.opm)} — ${qo} boné(s) (${formatarMoeda(vo)})</div>`;

    for (const gc of go.cias) {
      let qc = 0, vc = 0;
      gc.itens.forEach((p) => {
        qc += Number(p.quantidade) || 0;
        vc += calcularValorItem(p);
      });

      html += `<div class="grupo-cia-titulo">${esc(gc.cia)} — ${qc} boné(s) (${formatarMoeda(vc)})</div>
      <div class="table-wrap"><table>
        <thead>
          <tr>
            <th>Graduação</th>
            <th>RE</th>
            <th>Nome de Guerra</th>
            <th>Nome completo</th>
            <th>Quantidade</th>
            <th>Valor a pagar</th>
            <th>Comprovante</th>
            <th>Ação</th>
          </tr>
        </thead><tbody>`;

      for (const p of gc.itens) {
        const compHtml = p.comprovanteUrl
          ? `<button type="button" class="sucesso btn-mini btn-ver-comp" data-id="${esc(p.id)}">VER</button>`
          : `<span style="color:#888">Sem anexo</span>`;

        html += `<tr>
          <td>${esc(p.graduacao)}</td>
          <td>${esc(p.re)}</td>
          <td>${esc(p.nomeGuerra)}</td>
          <td>${esc(p.nomeCompleto)}</td>
          <td>${Number(p.quantidade) || 0}</td>
          <td>${formatarMoeda(calcularValorItem(p))}</td>
          <td>${compHtml}</td>
          <td><button type="button" class="perigo btn-mini btn-excluir-item" data-id="${esc(p.id)}">EXCLUIR</button></td>
        </tr>`;
      }
      html += `</tbody></table></div>`;
    }
    html += `</div>`;
  }

  $("listaAgrupada").innerHTML = html;

  document.querySelectorAll(".btn-ver-comp").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-id");
      const item = pedidos.find((x) => x.id === id);
      if (item) abrirModalComprovante(item);
    });
  });

  document.querySelectorAll(".btn-excluir-item").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-id");
      const item = pedidos.find((x) => x.id === id);
      if (item) excluirPedido(item);
    });
  });
}

function montarTextoCopia() {
  if (!pedidos.length) return "LISTA BONÉ PMRv - Sem registros.";
  const linhas = ["BONÉ PMRv - LISTA DE PEDIDOS (R$ 30,00 / UNIDADE)", "=============================================="];
  for (const go of agruparPorOpmECia(pedidos)) {
    linhas.push("\nOPM: " + go.opm);
    for (const gc of go.cias) {
      linhas.push("  [" + gc.cia + "]");
      gc.itens.forEach((p, idx) => {
        const comp = p.comprovanteUrl ? ` | Comprovante: ${p.comprovanteUrl}` : "";
        linhas.push(`    ${idx + 1}. ${p.graduacao} | RE: ${p.re} | ${p.nomeGuerra} | ${p.nomeCompleto} | Qtd: ${p.quantidade} | Valor: ${formatarMoeda(calcularValorItem(p))}${comp}`);
      });
    }
  }
  const qtd = pedidos.reduce((acc, p) => acc + (Number(p.quantidade) || 0), 0);
  const total = pedidos.reduce((acc, p) => acc + calcularValorItem(p), 0);
  linhas.push(`\nTOTAL GERAL: ${pedidos.length} pessoa(s) | ${qtd} boné(s) | ${formatarMoeda(total)}`);
  return linhas.join("\n");
}

$("btnCopiarLista").addEventListener("click", async () => {
  const texto = montarTextoCopia();
  try {
    await navigator.clipboard.writeText(texto);
    setStatus("statusAcoes", "Lista inteira copiada!");
  } catch (e) {
    const t = document.createElement("textarea");
    t.value = texto;
    document.body.appendChild(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    setStatus("statusAcoes", ok ? "Lista inteira copiada!" : "Não foi possível copiar.");
  }
});

$("btnGerarPdf").addEventListener("click", () => {
  if (!pedidos.length) {
    setStatus("statusAcoes", "Não há dados para gerar PDF.");
    return;
  }
  if (!window.jspdf?.jsPDF) {
    setStatus("statusAcoes", "Biblioteca PDF não carregada.");
    return;
  }
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  let y = 14;
  docPdf.setFontSize(15);
  docPdf.text("BONÉ PMRv - LISTA ORGANIZADA POR OPM E CIA", 14, y);
  y += 8;
  const qtd = pedidos.reduce((acc, p) => acc + (Number(p.quantidade) || 0), 0);
  const total = pedidos.reduce((acc, p) => acc + calcularValorItem(p), 0);
  docPdf.setFontSize(10);
  docPdf.text(`Pessoas: ${pedidos.length} | Bonés: ${qtd} | Total: ${formatarMoeda(total)}`, 14, y);
  y += 8;

  for (const go of agruparPorOpmECia(pedidos)) {
    if (y > 175) { docPdf.addPage(); y = 14; }
    docPdf.setFontSize(12);
    docPdf.text("OPM: " + go.opm, 14, y);
    y += 6;
    for (const gc of go.cias) {
      docPdf.setFontSize(10);
      docPdf.text("CIA: " + gc.cia, 16, y);
      docPdf.autoTable({
        startY: y + 2,
        head: [["Graduação", "RE", "Nome de Guerra", "Nome completo", "Qtd", "Valor a pagar", "Pix"]],
        body: gc.itens.map((p) => [
          p.graduacao, p.re, p.nomeGuerra, p.nomeCompleto,
          String(p.quantidade), formatarMoeda(calcularValorItem(p)),
          p.comprovanteUrl ? "Anexado" : "Pendente"
        ]),
        styles: { fontSize: 8, cellPadding: 2 },
        headStyles: { fillColor: [40, 40, 40], textColor: [255, 212, 0] },
        margin: { left: 14, right: 14 }
      });
      y = docPdf.lastAutoTable.finalY + 8;
    }
  }
  docPdf.save("Lista_Bone_PMRv.pdf");
  setStatus("statusAcoes", "PDF gerado com sucesso.");
});

$("btnGerarExcel").addEventListener("click", () => {
  if (!pedidos.length) {
    setStatus("statusAcoes", "Não há dados para gerar Excel.");
    return;
  }
  if (!window.XLSX) {
    setStatus("statusAcoes", "Biblioteca Excel não carregada.");
    return;
  }
  const rows = [];
  for (const go of agruparPorOpmECia(pedidos)) {
    for (const gc of go.cias) {
      for (const p of gc.itens) {
        rows.push({
          "OPM": go.opm,
          "CIA": gc.cia,
          "Graduação": p.graduacao,
          "RE com dígito": p.re,
          "Nome de Guerra": p.nomeGuerra,
          "Nome completo": p.nomeCompleto,
          "Quantidade": Number(p.quantidade) || 0,
          "Valor unitário (R$)": VALOR_UNITARIO,
          "Valor a pagar (R$)": calcularValorItem(p),
          "Comprovante Pix": p.comprovanteUrl || "Sem anexo"
        });
      }
    }
  }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 18 }, { wch: 14 }, { wch: 17 }, { wch: 16 }, { wch: 22 }, { wch: 32 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 45 }];
  XLSX.utils.book_append_sheet(wb, ws, "Pedidos Bone PMRv");
  XLSX.writeFile(wb, "Lista_Bone_PMRv.xlsx");
  setStatus("statusAcoes", "Arquivo Excel gerado com sucesso.");
});

$("btnLimparLista").addEventListener("click", async () => {
  if (!confirm("ATENÇÃO: deseja apagar TODOS os pedidos do banco?")) return;
  setStatus("statusAcoes", "Apagando todos os registros...");
  try {
    for (const p of pedidos) {
      await deleteDoc(doc(db, COLECAO_PEDIDOS, p.id));
    }
    pedidos = [];
    renderizarLista();
    setStatus("statusAcoes", "Lista limpa com sucesso.");
  } catch (err) {
    console.error(err);
    setStatus("statusAcoes", "Erro ao limpar lista: " + (err.message || err));
  }
});

carregarSlotsFotos();
carregarPedidos();
