<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ordens de Serviço</title>
<style>
:root {
  --bg-app: #07080a;
  --bg-card: #111318;
  --bg-elevado: #191c24;
  --bg-input: #07080a;
  --bg-header: #000000;
  --destaque: #ffd000;
  --destaque-hover: #ffe047;
  --texto-principal: #f5f6f8;
  --texto-suave: #a1a8b5;
  --texto-destaque: #ffd000;
  --texto-botao-destaque: #000000;
  --borda: #252934;
  --borda-destaque: rgba(255, 208, 0, 0.45);
  --sombra-topo: rgba(255, 208, 0, 0.07);
  --vigente-bg: rgba(22, 163, 74, 0.18);
  --vigente-borda: #22c55e;
  --vigente-texto: #86efac;
  --vigente-badge: #16a34a;
  --vencida-bg: rgba(220, 38, 38, 0.18);
  --vencida-borda: #ef4444;
  --vencida-texto: #fca5a5;
  --vencida-badge: #dc2626;
}
body.light-theme {
  --bg-app: #ffffff;
  --bg-card: #ffffff;
  --bg-elevado: #f4f5f7;
  --bg-input: #ffffff;
  --bg-header: #ffffff;
  --destaque: #000000;
  --destaque-hover: #222222;
  --texto-principal: #000000;
  --texto-suave: #374151;
  --texto-destaque: #000000;
  --texto-botao-destaque: #ffffff;
  --borda: #d1d5db;
  --borda-destaque: #000000;
  --sombra-topo: rgba(255, 208, 0, 0.14);
  --vigente-bg: #dcfce7;
  --vigente-borda: #15803d;
  --vigente-texto: #14532d;
  --vigente-badge: #15803d;
  --vencida-bg: #fee2e2;
  --vencida-borda: #b91c1c;
  --vencida-texto: #7f1d1d;
  --vencida-badge: #b91c1c;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body {
  background: var(--bg-app);
  color: var(--texto-principal);
  min-height: 100vh;
  padding-bottom: 48px;
  background-image: radial-gradient(circle at top, var(--sombra-topo), transparent 45%);
  transition: background-color 0.2s ease, color 0.2s ease;
  touch-action: manipulation;
}
body.pdf-zoom-active {
  touch-action: auto;
}
header {
  background: var(--bg-header);
  border-bottom: 2.5px solid var(--destaque);
  padding: 10px 14px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
h1 {
  font-size: clamp(0.98rem, 2vw, 1.22rem);
  font-weight: 900;
  color: var(--texto-destaque);
  letter-spacing: 0.4px;
  white-space: nowrap;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
}
button, a.btn-link {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  font-weight: 800;
  font-size: 0.82rem;
  padding: 8px 11px;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-decoration: none;
  line-height: 1;
}
button:active, a.btn-link:active { transform: scale(0.97); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primario { background: var(--destaque); color: var(--texto-botao-destaque); border: 1px solid var(--destaque); }
.btn-primario:hover:not(:disabled) { background: var(--destaque-hover); }
.btn-secundario { background: var(--bg-elevado); color: var(--texto-destaque); border: 1px solid var(--borda-destaque); }
.btn-secundario:hover:not(:disabled) { border-color: var(--destaque); }
.btn-add-os { padding: 8px 11px; font-size: 0.8rem; letter-spacing: 0.2px; }
.btn-theme-icon { padding: 8px 9px; font-size: 0.92rem; }
.btn-icon {
  width: 34px;
  height: 34px;
  padding: 0;
  font-size: 0.95rem;
  border-radius: 8px;
  flex: 0 0 34px;
}
.btn-ver { background: var(--destaque); color: var(--texto-botao-destaque); }
.btn-ver:hover:not(:disabled) { background: var(--destaque-hover); }
.btn-download { background: var(--bg-elevado); color: var(--texto-destaque); border: 1px solid var(--borda-destaque); }
.btn-download:hover:not(:disabled) { background: var(--destaque); color: var(--texto-botao-destaque); }
.btn-excluir { background: rgba(239,68,68,0.14); color: var(--vencida-texto); border: 1px solid var(--vencida-borda); }
.btn-excluir:hover:not(:disabled) { background: #dc2626; color: #ffffff; border-color: #ef4444; }

.container {
  max-width: 1280px;
  margin: 12px auto 0;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--borda);
  border-top: 2.5px solid var(--destaque);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--borda);
}
.card-title { font-size: 0.94rem; font-weight: 800; color: var(--texto-destaque); }
.hidden { display: none !important; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 0.8rem; font-weight: 700; color: var(--texto-destaque); }
.hint { font-size: 0.72rem; color: var(--texto-suave); line-height: 1.3; }
.warn-text { color: #f59e0b; font-weight: 700; }
input[type="text"], input[type="date"], select {
  background: var(--bg-input);
  color: var(--texto-principal);
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 0.88rem;
  width: 100%;
}
input[type="text"]:focus, input[type="date"]:focus, select:focus {
  outline: none;
  border-color: var(--destaque);
  box-shadow: 0 0 0 2px rgba(255,208,0,0.18);
}
input[type="file"] {
  background: var(--bg-input);
  color: var(--texto-suave);
  border: 1.5px dashed var(--destaque);
  border-radius: 8px;
  padding: 10px;
  width: 100%;
  font-size: 0.84rem;
}
.mode-switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .mode-switch { grid-template-columns: 1fr; } }
.mode-option {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--borda);
  color: var(--texto-principal);
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.mode-option input[type="radio"] { accent-color: var(--destaque); width: 15px; height: 15px; }
.specific-box {
  background: var(--bg-input);
  border: 1px solid var(--borda-destaque);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.specific-add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.specific-add-row input[type="date"] { max-width: 220px; }
@media (max-width: 540px) { .specific-add-row input[type="date"] { max-width: 100%; } .specific-add-row button { width: 100%; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--bg-elevado);
  border: 1px solid var(--destaque);
  color: var(--texto-destaque);
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip button { background: none; color: var(--texto-destaque); padding: 0; font-size: 0.95rem; line-height: 1; }
.selected-files-list { margin-top: 4px; font-size: 0.8rem; color: var(--texto-suave); display: flex; flex-direction: column; gap: 3px; }
.progress-wrap { margin-top: 10px; background: var(--bg-input); border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; height: 10px; }
.progress-bar { height: 100%; width: 0%; background: var(--destaque); transition: width 0.2s ease; }
.status-msg { margin-top: 6px; font-size: 0.82rem; font-weight: 700; color: var(--texto-destaque); min-height: 18px; }

.search-bar-row { display: flex; gap: 8px; align-items: center; }
.search-bar-row input[type="text"] { flex: 1 1 auto; }
.filter-count-badge {
  background: var(--destaque);
  color: var(--texto-botao-destaque);
  font-size: 0.7rem;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 999px;
}
.filters-drawer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borda); }
.filters-grid { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)) auto; gap: 10px; align-items: end; }
@media (max-width: 640px) { .filters-grid { grid-template-columns: 1fr; } #btnClearFilters { width: 100%; } }
.stats-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 0.75rem; }
.stat-pill {
  background: var(--bg-elevado);
  border: 1px solid var(--borda);
  padding: 3px 9px;
  border-radius: 999px;
  color: var(--texto-principal);
}
.stat-pill.vigente { border-color: var(--vigente-borda); color: var(--vigente-texto); background: var(--vigente-bg); }
.stat-pill.vencida { border-color: var(--vencida-borda); color: var(--vencida-texto); background: var(--vencida-bg); }

/* Tabela Desktop */
.table-wrap { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid var(--borda); }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--bg-elevado);
  color: var(--texto-destaque);
  text-align: left;
  padding: 10px 12px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid var(--destaque);
}
td {
  padding: 11px 12px;
  border-bottom: 1px solid rgba(128,128,128,0.16);
  font-size: 0.88rem;
  vertical-align: middle;
}
tr.os-vigente { background: var(--vigente-bg); box-shadow: inset 5px 0 0 var(--vigente-borda); }
tr.os-vigente .os-title-text { color: var(--vigente-texto); font-weight: 800; }
tr.os-vencida { background: var(--vencida-bg); box-shadow: inset 5px 0 0 var(--vencida-borda); }
tr.os-vencida .os-title-text { color: var(--vencida-texto); font-weight: 800; }
.badge-status {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 900;
  letter-spacing: 0.3px;
  vertical-align: middle;
}
.badge-vigente { background: var(--vigente-badge); color: #ffffff; }
.badge-vencida { background: var(--vencida-badge); color: #ffffff; }
.badge-pasta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-card);
  color: var(--texto-destaque);
  border: 1px solid var(--destaque);
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 800;
  margin-left: 6px;
  vertical-align: middle;
}
.actions-group { display: flex; gap: 6px; align-items: center; }
.empty-state { text-align: center; padding: 26px 14px; color: var(--texto-suave); font-size: 0.88rem; background: var(--bg-card); }

/* Linha única compacta no celular */
@media (max-width: 768px) {
  .table-wrap { border: none; overflow-x: visible; border-radius: 0; }
  table, thead, tbody, tr, th, td { display: block; width: 100%; }
  thead { display: none; }
  tbody { display: flex; flex-direction: column; gap: 8px; }
  tr.os-vigente, tr.os-vencida {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-radius: 10px;
    padding: 9px 10px 9px 12px;
    border: 1px solid rgba(128,128,128,0.24);
  }
  tr.os-vigente { border-left: 4px solid var(--vigente-borda); box-shadow: none; }
  tr.os-vencida { border-left: 4px solid var(--vencida-borda); box-shadow: none; }
  td {
    padding: 0;
    border: none;
    width: auto;
  }
  td::before { display: none; }
  td.col-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .os-title-line {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .os-title-text {
    font-size: 0.84rem;
    line-height: 1.25;
    word-break: break-word;
  }
  .badge-status { margin-left: 0; font-size: 0.64rem; padding: 1.5px 6px; }
  .badge-pasta { margin-left: 0; font-size: 0.66rem; padding: 1px 5px; }
  .os-dates-line {
    font-size: 0.72rem;
    color: var(--texto-suave);
    line-height: 1.25;
  }
  td.col-start, td.col-end { display: none; }
  td.col-actions { flex: 0 0 auto; }
  .actions-group { gap: 5px; flex-wrap: nowrap; }
  .btn-icon { width: 32px; height: 32px; flex: 0 0 32px; font-size: 0.88rem; }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.modal {
  background: var(--bg-card);
  border: 2px solid var(--destaque);
  border-radius: 12px;
  width: 100%;
  max-width: 1020px;
  max-height: 94vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  background: var(--bg-header);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--destaque);
}
.modal-title {
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--texto-destaque);
  word-break: break-word;
  flex: 1 1 180px;
}
.modal-body { padding: 12px; overflow-y: auto; flex: 1; }
.viewer-frame {
  width: 100%;
  height: 74vh;
  border: 1px solid var(--borda);
  border-radius: 8px;
  background: #ffffff;
}
@media (max-width: 768px) {
  .viewer-frame { height: 78vh; }
}
.viewer-media {
  max-width: 100%;
  max-height: 74vh;
  display: block;
  margin: 0 auto;
  border-radius: 8px;
  border: 1px solid var(--borda);
}
.folder-item {
  background: var(--bg-elevado);
  border: 1px solid var(--borda);
  border-left: 4px solid var(--destaque);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}
.folder-item-name { font-weight: 800; font-size: 0.86rem; color: var(--texto-principal); word-break: break-word; }
.folder-item-meta { font-size: 0.72rem; color: var(--texto-suave); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>ORDENS DE SERVIÇO</h1>
    <div class="header-actions">
      <button id="btnToggleInsert" class="btn-secundario btn-add-os" type="button">+ O.S</button>
      <button id="btnToggleTheme" class="btn-secundario btn-theme-icon" type="button" aria-label="Alternar tema">☀️</button>
    </div>
  </div>
</header>

<main class="container">

  <!-- Formulário de Inserção (recolhível) -->
  <section id="insertCard" class="card hidden">
    <div class="card-header">
      <div class="card-title">Nova Ordem de Serviço</div>
      <button id="btnCloseInsert" class="btn-secundario" type="button">Fechar</button>
    </div>

    <form id="osForm">
      <div class="form-grid">
        <div class="field full">
          <label for="osTitle">Título da Ordem de Serviço</label>
          <input type="text" id="osTitle" placeholder="ORDEM DE SERVIÇO N° XXXX/XXXX/XXXX" required />
          <span class="hint">Ex.: ORDEM DE SERVIÇO N° 0045/2026/PMESP</span>
        </div>

        <div class="field full">
          <label>Vigência</label>
          <div class="mode-switch">
            <label class="mode-option">
              <input type="radio" name="dateMode" value="range" checked />
              Período corrido (Início até Término)
            </label>
            <label class="mode-option">
              <input type="radio" name="dateMode" value="specific" />
              Dias específicos / alternados
            </label>
          </div>
        </div>

        <div id="rangeStartBox" class="field">
          <label for="startDate">Data Início</label>
          <input type="date" id="startDate" />
        </div>
        <div id="rangeEndBox" class="field">
          <label for="endDate">Data Término</label>
          <input type="date" id="endDate" />
        </div>

        <div id="specificBox" class="field full hidden">
          <div class="specific-box">
            <label for="specificDateInput">Adicionar Dias Específicos</label>
            <div class="specific-add-row">
              <input type="date" id="specificDateInput" />
              <button type="button" id="btnAddSpecificDate" class="btn-secundario">+ Dia</button>
            </div>
            <div id="specificChips" class="chips"></div>
          </div>
        </div>

        <div class="field full">
          <label for="osFiles">Arquivos</label>
          <input type="file" id="osFiles" multiple required />
          <span class="hint">1 arquivo abre direto; 2 ou mais abrem como pasta. Prefira arquivos leves (até ~15 MB).</span>
          <div id="selectedFilesPreview" class="selected-files-list"></div>
        </div>

        <div class="field full">
          <button type="submit" id="btnSubmitOs" class="btn-primario">Salvar</button>
          <div class="progress-wrap">
            <div id="uploadProgress" class="progress-bar"></div>
          </div>
          <div id="uploadStatus" class="status-msg"></div>
        </div>
      </div>
    </form>
  </section>

  <!-- Busca + Filtros -->
  <section class="card">
    <div class="search-bar-row">
      <input type="text" id="searchInput" aria-label="Buscar por nome, número da O.S. ou arquivo" placeholder="Buscar por nome, número ou arquivo..." />
      <button id="btnToggleFilters" class="btn-secundario" type="button">
        <span>Filtros</span>
        <span id="activeFiltersBadge" class="filter-count-badge hidden">0</span>
      </button>
    </div>
    <div id="filtersDrawer" class="filters-drawer hidden">
      <div class="filters-grid">
        <div class="field">
          <label for="filterDate">Data</label>
          <input type="date" id="filterDate" />
        </div>
        <div class="field">
          <label for="filterStatus">Vigência</label>
          <select id="filterStatus">
            <option value="all">Todas</option>
            <option value="vigente">Vigentes (Verde)</option>
            <option value="vencida">Vencidas (Vermelha)</option>
          </select>
        </div>
        <div class="field">
          <button type="button" id="btnClearFilters" class="btn-secundario">Limpar</button>
        </div>
      </div>
      <div id="statsBar" class="stats-bar"></div>
    </div>
  </section>

  <!-- Lista -->
  <section class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Título</th>
            <th>Início</th>
            <th>Término</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="osTableBody">
          <tr>
            <td colspan="4" class="empty-state">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<!-- Modal Visualizador -->
<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Visualizador</div>
      <div class="actions-group">
        <a id="modalOpenTab" class="btn-link btn-secundario hidden" href="#" target="_blank" rel="noopener noreferrer">Nova guia</a>
        <a id="modalDirectDownload" class="btn-link btn-download btn-icon hidden" href="#" target="_blank" rel="noopener" title="Download" aria-label="Download">⬇️</a>
        <button id="btnCloseModal" class="btn-secundario btn-icon" type="button" title="Fechar" aria-label="Fechar">✕</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-analytics.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBDGMKQW7e_2gl3_VEPxBfxAD2nubvmFwQ",

function getTodayISO() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function formatDateBR(iso) {
  if (!iso) return "-";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function formatBytes(bytes = 0) {
  if (!bytes) return "0 B";
  const k = 1024;
  const units = ["B", "KB", "MB", "GB"];
  const idx = Math.floor(Math.log(bytes) / Math.log(k));
  return `${parseFloat((bytes / Math.pow(k, idx)).toFixed(1))} ${units[idx]}`;
}

function getExpirationTimestamp(order) {
  const refDateStr = order.endDate || order.startDate;
  if (refDateStr) {
    const [y, m, d] = refDateStr.split("-").map(Number);
    if (y && m && d) {
      const endOfDayUTC = Date.UTC(y, m - 1, d, 23, 59, 59, 999);
      return endOfDayUTC + (RETENTION_DAYS * DAY_MS);
    }
  }
  if (order.expiresAt) return order.expiresAt;
  if (order.createdAt) return order.createdAt + (RETENTION_DAYS * DAY_MS);
  return null;
}

function isVigente(order) {
  const today = getTodayISO();
  if (order.dateMode === "specific") {
    const list = Array.isArray(order.specificDates) ? order.specificDates : [];
    return list.includes(today);
  }
  const start = order.startDate || "";
  const end = order.endDate || start;
  if (!start) return false;
  return today >= start && today <= end;
}
function matchDateFilter(order, targetISO) {
  if (!targetISO) return true;
  if (order.dateMode === "specific") {
    return (order.specificDates || []).includes(targetISO);
  }
  const start = order.startDate || "";
  const end = order.endDate || start;
  return targetISO >= start && targetISO <= end;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || "");
      const commaIdx = result.indexOf(",");
      resolve(commaIdx >= 0 ? result.slice(commaIdx + 1) : result);
    };
    reader.onerror = () => reject(new Error(`Falha ao ler ${file.name}`));
    reader.readAsDataURL(file);
  });
}

async function postToAppsScript(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (_) {
    throw new Error(`Resposta inesperada: ${text.slice(0, 160)}`);
  }
  if (!res.ok || !json.ok) {
    throw new Error(json.error || `Erro HTTP ${res.status}`);
  }
  return json;
}

async function uploadFileToDrive(file) {
  const base64 = await fileToBase64(file);
  const data = await postToAppsScript({
    action: "upload",
    name: file.name,
    mimeType: file.type || "application/octet-stream",
    base64
  });
  return {
    name: data.name || file.name,
    type: data.mimeType || file.type || "application/octet-stream",
    size: file.size,
    fileId: data.fileId,
    viewUrl: data.viewUrl,
    downloadUrl: data.downloadUrl,
    directUrl: data.directUrl,
    url: data.viewUrl || data.downloadUrl,
    storageProvider: "gdrive"
  };
}

async function removeFilesFromDrive(files = []) {
  const gdriveFiles = (files || []).filter((f) => f && f.fileId);
  for (const f of gdriveFiles) {
    try {
      await postToAppsScript({ action: "delete", fileId: f.fileId });
    } catch (err) {
      console.warn("Aviso ao remover no Drive:", f.name, err);
    }
  }
}

osForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!checkPassword()) return;

  const title = osTitle.value.trim();
  const mode = document.querySelector('input[name="dateMode"]:checked').value;
  const files = Array.from(osFilesInput.files || []);
  if (!title) return alert("Informe o título.");
  if (!files.length) return alert("Selecione pelo menos um arquivo.");

  let startDate = "";
  let endDate = "";
  let sortedSpecific = [];

  if (mode === "range") {
    startDate = startDateInput.value;
    endDate = endDateInput.value || startDate;
    if (!startDate) return alert("Informe a Data Início.");
    if (endDate < startDate) return alert("Data Término menor que Data Início.");
  } else {
    if (!specificDates.length) return alert("Adicione pelo menos um dia específico.");
    sortedSpecific = [...specificDates].sort();
    startDate = sortedSpecific[0];
    endDate = sortedSpecific[sortedSpecific.length - 1];
  }

  btnSubmitOs.disabled = true;
  uploadProgress.style.width = "0%";
  uploadStatus.textContent = "Enviando arquivos...";

  try {
    const uploaded = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      uploadProgress.style.width = `${Math.round((i / files.length) * 85)}%`;
      uploadStatus.textContent = `Enviando (${i + 1}/${files.length}): ${file.name}...`;
      const item = await uploadFileToDrive(file);
      uploaded.push(item);
      uploadProgress.style.width = `${Math.round(((i + 1) / files.length) * 85)}%`;
    }

    uploadProgress.style.width = "92%";
    uploadStatus.textContent = "Salvando...";

    const now = Date.now();
    const orderPayload = {
      title,
      dateMode: mode,
      startDate,
      endDate,
      specificDates: sortedSpecific,
      files: uploaded,
      createdAt: now
    };
    orderPayload.expiresAt = getExpirationTimestamp(orderPayload);
    await addDoc(osCollection, orderPayload);

    uploadProgress.style.width = "100%";
    uploadStatus.textContent = "Salvo!";
    osForm.reset();
    specificDates = [];
    renderSpecificChips();
    selectedFilesPreview.innerHTML = "";
    setTimeout(() => {
      uploadProgress.style.width = "0%";
      uploadStatus.textContent = "";
      insertCard.classList.add("hidden");
    }, 900);
  } catch (err) {
    console.error(err);
    uploadStatus.textContent = "Erro: " + (err.message || err);
  } finally {
    btnSubmitOs.disabled = false;
  }
});

async function deleteOrder(order) {
  if (!checkPassword()) return;
  const ok = confirm(`Excluir "${order.title}"?`);
  if (!ok) return;
  try {
    await removeFilesFromDrive(order.files || []);
    await deleteDoc(doc(db, "ordens_servico", order.id));
  } catch (err) {
    console.error(err);
    alert("Erro ao excluir: " + (err.message || err));
  }
}

async function runThreeMonthCleanup(orders) {
  if (cleanupRunning) return;
  const now = Date.now();
  const expired = orders.filter((o) => {
    const exp = getExpirationTimestamp(o);
    return exp !== null && now >= exp;
  });
  if (!expired.length) return;
  cleanupRunning = true;
  try {
    for (const order of expired) {
      await removeFilesFromDrive(order.files || []);
      try { await deleteDoc(doc(db, "ordens_servico", order.id)); } catch (_) {}
    }
  } finally {
    cleanupRunning = false;
  }
}

function getFileDownloadUrl(file) {
  return file.downloadUrl || file.url || file.viewUrl || "#";
}

function getFilePreviewUrl(file) {
  if (file.fileId) {
    return `https://drive.google.com/file/d/${file.fileId}/preview`;
  }
  return file.viewUrl || file.url || "";
}

function openSingleViewer(file) {
  const dlUrl = getFileDownloadUrl(file);
  const previewUrl = getFilePreviewUrl(file);
  modalTitle.textContent = file.name;

  modalOpenTab.href = previewUrl || dlUrl;
  modalOpenTab.classList.remove("hidden");

  modalDirectDownload.href = dlUrl;
  modalDirectDownload.download = file.name;
  modalDirectDownload.classList.remove("hidden");

  modalBody.innerHTML = "";

  const lower = (file.name || "").toLowerCase();
  const mime = (file.type || "").toLowerCase();
  const isPdf = mime === "application/pdf" || lower.endsWith(".pdf");

  setPdfZoomMode(isPdf);

  if (mime.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(lower)) {
    const img = document.createElement("img");
    img.src = file.directUrl || previewUrl || dlUrl;
    img.alt = file.name;
    img.className = "viewer-media";
    modalBody.appendChild(img);
  } else if (mime.startsWith("video/") || /\.(mp4|webm|ogg|mov)$/.test(lower)) {
    const video = document.createElement("video");
    video.src = previewUrl || dlUrl;
    video.controls = true;
    video.className = "viewer-media";
    modalBody.appendChild(video);
  } else if (isPdf || /\.(doc|docx|xls|xlsx|ppt|pptx)$/.test(lower)) {
    const iframe = document.createElement("iframe");
    iframe.src = previewUrl;
    iframe.className = "viewer-frame";
    modalBody.appendChild(iframe);
  } else {
    modalBody.innerHTML = `
      <div class="empty-state">
        Pré-visualização indisponível para este arquivo.<br/>
        Use <strong>Nova guia</strong> ou o botão de download no topo.
      </div>`;
  }
  modalBackdrop.classList.remove("hidden");
}

function openFolderView(order) {
  setPdfZoomMode(false);
  modalTitle.textContent = `${order.title} (${order.files.length})`;
  modalOpenTab.classList.add("hidden");
  modalOpenTab.href = "#";
  modalDirectDownload.classList.add("hidden");
  modalBody.innerHTML = "";
  (order.files || []).forEach((file) => {
    const row = document.createElement("div");
    row.className = "folder-item";
    const info = document.createElement("div");
    info.innerHTML = `
      <div class="folder-item-name">${escapeHtml(file.name)}</div>
      <div class="folder-item-meta">${formatBytes(file.size)}</div>
    `;
    const btns = document.createElement("div");
    btns.className = "actions-group";

    const btnVer = document.createElement("button");
    btnVer.type = "button";
    btnVer.className = "btn-ver btn-icon";
    btnVer.title = "Visualizar";
    btnVer.setAttribute("aria-label", "Visualizar");
    btnVer.textContent = "👁️";
    btnVer.addEventListener("click", () => openSingleViewer(file));

    const btnDl = document.createElement("a");
    btnDl.href = getFileDownloadUrl(file);
    btnDl.download = file.name;
    btnDl.target = "_blank";
    btnDl.rel = "noopener";
    btnDl.className = "btn-link btn-download btn-icon";
    btnDl.title = "Download";
    btnDl.setAttribute("aria-label", "Download");
    btnDl.textContent = "⬇️";

    btns.appendChild(btnVer);
    btns.appendChild(btnDl);
    row.appendChild(info);
    row.appendChild(btns);
    modalBody.appendChild(row);
  });
  modalBackdrop.classList.remove("hidden");
}

  modalBackdrop.classList.add("hidden");

function escapeHtml(str = "") {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderList() {
  updateFilterBadge();
  const term = searchInput.value.trim().toLowerCase();
  const dateVal = filterDate.value;
  const statusVal = filterStatus.value;

  const filtered = allOrders.filter((order) => {
    const vigente = isVigente(order);
    if (statusVal === "vigente" && !vigente) return false;
    if (statusVal === "vencida" && vigente) return false;
    if (dateVal && !matchDateFilter(order, dateVal)) return false;
    if (term) {
      const hitTitle = (order.title || "").toLowerCase().includes(term);
      const hitFiles = (order.files || []).some((f) => (f.name || "").toLowerCase().includes(term));
      const hitDates =
        (order.startDate || "").includes(term) ||
        (order.endDate || "").includes(term) ||
        formatDateBR(order.startDate).includes(term) ||
        formatDateBR(order.endDate).includes(term) ||
        (order.specificDates || []).some((d) => d.includes(term) || formatDateBR(d).includes(term));
      if (!hitTitle && !hitFiles && !hitDates) return false;
    }
    return true;
  });

  const vigentesCount = allOrders.filter(isVigente).length;
  const vencidasCount = allOrders.length - vigentesCount;
  statsBar.innerHTML = `
    <span class="stat-pill">Total: <strong>${allOrders.length}</strong></span>
    <span class="stat-pill vigente">Vigentes: <strong>${vigentesCount}</strong></span>
    <span class="stat-pill vencida">Vencidas: <strong>${vencidasCount}</strong></span>
    <span class="stat-pill">Exibidos: <strong>${filtered.length}</strong></span>
  `;

  osTableBody.innerHTML = "";
  if (!filtered.length) {
    osTableBody.innerHTML = `
      <tr>
        <td colspan="4" class="empty-state">Nenhuma Ordem de Serviço encontrada.</td>
      </tr>`;
    return;
  }

  filtered.forEach((order) => {
    const vigente = isVigente(order);
    const files = order.files || [];
    const isFolder = files.length > 1;
    const startBR = formatDateBR(order.startDate);
    const endBR = formatDateBR(order.endDate);
    const dateSummary = (order.dateMode === "specific" && Array.isArray(order.specificDates) && order.specificDates.length)
      ? order.specificDates.map(formatDateBR).join(", ")
      : `${startBR} → ${endBR}`;

    const tr = document.createElement("tr");
    tr.className = vigente ? "os-vigente" : "os-vencida";

    const tdInfo = document.createElement("td");
    tdInfo.className = "col-info";
    const pastaBadge = isFolder ? `<span class="badge-pasta">📁 ${files.length}</span>` : "";
    const statusBadge = vigente
      ? `<span class="badge-status badge-vigente">VIGENTE</span>`
      : `<span class="badge-status badge-vencida">VENCIDA</span>`;
    tdInfo.innerHTML = `
      <div class="os-title-line">
        <span class="os-title-text">${escapeHtml(order.title)}</span>
        ${statusBadge}
        ${pastaBadge}
      </div>
      <div class="os-dates-line">${escapeHtml(dateSummary)}</div>
    `;

    const tdStart = document.createElement("td");
    tdStart.className = "col-start";
    tdStart.textContent = startBR;

    const tdEnd = document.createElement("td");
    tdEnd.className = "col-end";
    tdEnd.textContent = endBR;

    const tdActions = document.createElement("td");
    tdActions.className = "col-actions";
    const group = document.createElement("div");
    group.className = "actions-group";

    const btnVer = document.createElement("button");
    btnVer.type = "button";
    btnVer.className = "btn-ver btn-icon";
    btnVer.title = isFolder ? "Abrir pasta" : "Visualizar";
    btnVer.setAttribute("aria-label", isFolder ? "Abrir pasta" : "Visualizar");
    btnVer.textContent = isFolder ? "📂" : "👁️";
    btnVer.addEventListener("click", () => {
      if (isFolder) openFolderView(order);
      else if (files[0]) openSingleViewer(files[0]);
    });
    group.appendChild(btnVer);

    if (!isFolder && files[0]) {
      const btnDl = document.createElement("a");
      btnDl.href = getFileDownloadUrl(files[0]);
      btnDl.download = files[0].name;
      btnDl.target = "_blank";
      btnDl.rel = "noopener";
      btnDl.className = "btn-link btn-download btn-icon";
      btnDl.title = "Download";
      btnDl.setAttribute("aria-label", "Download");
      btnDl.textContent = "⬇️";
      group.appendChild(btnDl);
    } else if (isFolder) {
      const btnPastaDl = document.createElement("button");
      btnPastaDl.type = "button";
      btnPastaDl.className = "btn-download btn-icon";
      btnPastaDl.title = "Arquivos para download";
      btnPastaDl.setAttribute("aria-label", "Arquivos para download");
      btnPastaDl.textContent = "⬇️";
      btnPastaDl.addEventListener("click", () => openFolderView(order));
      group.appendChild(btnPastaDl);
    }

    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "btn-excluir btn-icon";
    btnDel.title = "Excluir";
    btnDel.setAttribute("aria-label", "Excluir");
    btnDel.textContent = "🗑️";
    btnDel.addEventListener("click", () => deleteOrder(order));
    group.appendChild(btnDel);

    tdActions.appendChild(group);

    tr.appendChild(tdInfo);
    tr.appendChild(tdStart);
    tr.appendChild(tdEnd);
    tr.appendChild(tdActions);
    osTableBody.appendChild(tr);
  });
}

searchInput.addEventListener("input", renderList);
filterDate.addEventListener("change", renderList);
filterStatus.addEventListener("change", renderList);
btnClearFilters.addEventListener("click", () => {
  searchInput.value = "";
  filterDate.value = "";
  filterStatus.value = "all";
  renderList();
});

const q = query(osCollection, orderBy("createdAt", "desc"));
onSnapshot(
  q,
  (snap) => {
    allOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderList();
    runThreeMonthCleanup(allOrders);
  },
  (err) => {
    console.error(err);
    osTableBody.innerHTML = `
      <tr>
        <td colspan="4" class="empty-state">
          Não foi possível carregar os dados. Confira as regras do Firestore.
        </td>
      </tr>`;
  }
);
</script>
