<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta id="viewportMeta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ordens de Serviço</title>
<style>
:root {
  --bg-app: #07080a;
  --bg-card: #111318;
  --bg-elevado: #191c24;
  --bg-input: #07080a;
  --bg-header: #000000;
  --destaque: #ffd000;
  --destaque-hover: #ffe047;
  --texto-principal: #f5f6f8;
  --texto-suave: #a1a8b5;
  --texto-destaque: #ffd000;
  --texto-botao-destaque: #000000;
  --borda: #252934;
  --borda-destaque: rgba(255, 208, 0, 0.45);
  --sombra-topo: rgba(255, 208, 0, 0.07);
  --vigente-bg: rgba(22, 163, 74, 0.18);
  --vigente-borda: #22c55e;
  --vigente-texto: #86efac;
  --vigente-badge: #16a34a;
  --breve-bg: rgba(37, 99, 235, 0.18);
  --breve-borda: #3b82f6;
  --breve-texto: #93c5fd;
  --breve-badge: #2563eb;
  --permanente-bg: rgba(217, 119, 6, 0.2);
  --permanente-borda: #f59e0b;
  --permanente-texto: #fcd34d;
  --permanente-badge: #d97706;
  --expirado-bg: rgba(220, 38, 38, 0.18);
  --expirado-borda: #ef4444;
  --expirado-texto: #fca5a5;
  --expirado-badge: #dc2626;
}
body.light-theme {
  --bg-app: #ffffff;
  --bg-card: #ffffff;
  --bg-elevado: #f4f5f7;
  --bg-input: #ffffff;
  --bg-header: #ffffff;
  --destaque: #000000;
  --destaque-hover: #222222;
  --texto-principal: #000000;
  --texto-suave: #374151;
  --texto-destaque: #000000;
  --texto-botao-destaque: #ffffff;
  --borda: #d1d5db;
  --borda-destaque: #000000;
  --sombra-topo: rgba(255, 208, 0, 0.14);
  --vigente-bg: #dcfce7;
  --vigente-borda: #15803d;
  --vigente-texto: #14532d;
  --vigente-badge: #15803d;
  --breve-bg: #dbeafe;
  --breve-borda: #1d4ed8;
  --breve-texto: #1e3a8a;
  --breve-badge: #1d4ed8;
  --permanente-bg: #fef3c7;
  --permanente-borda: #b45309;
  --permanente-texto: #78350f;
  --permanente-badge: #b45309;
  --expirado-bg: #fee2e2;
  --expirado-borda: #b91c1c;
  --expirado-texto: #7f1d1d;
  --expirado-badge: #b91c1c;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body {
  background: var(--bg-app);
  color: var(--texto-principal);
  min-height: 100vh;
  padding-bottom: 48px;
  background-image: radial-gradient(circle at top, var(--sombra-topo), transparent 45%);
  transition: background-color 0.2s ease, color 0.2s ease;
  touch-action: manipulation;
}
body.pdf-zoom-active {
  touch-action: auto;
}
header {
  background: var(--bg-header);
  border-bottom: 2.5px solid var(--destaque);
  padding: 10px 14px;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 4px 16px rgba(0,0,0,0.16);
}
.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
}
.header-left {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}
.logo-avatar-btn {
  position: relative;
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 50%;
  background: var(--bg-elevado);
  border: 2px solid var(--destaque);
  color: var(--texto-destaque);
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.logo-avatar-btn:hover {
  transform: scale(1.04);
}
.logo-avatar-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.logo-placeholder {
  font-size: 0.65rem;
  font-weight: 900;
  letter-spacing: 0.3px;
  text-transform: uppercase;
  line-height: 1;
}
.logo-edit-badge {
  position: absolute;
  bottom: -1px;
  right: -1px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--destaque);
  color: var(--texto-botao-destaque);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--bg-header);
  pointer-events: none;
}
.logo-avatar-btn.uploading {
  opacity: 0.6;
  pointer-events: none;
}
h1 {
  font-size: clamp(0.92rem, 2vw, 1.22rem);
  font-weight: 900;
  color: var(--texto-destaque);
  letter-spacing: 0.4px;
  white-space: nowrap;
  text-align: center;
  justify-self: center;
}
.header-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}
button, a.btn-link {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  font-weight: 800;
  font-size: 0.82rem;
  padding: 8px 11px;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  text-decoration: none;
  line-height: 1;
}
button:active, a.btn-link:active { transform: scale(0.97); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primario { background: var(--destaque); color: var(--texto-botao-destaque); border: 1px solid var(--destaque); }
.btn-primario:hover:not(:disabled) { background: var(--destaque-hover); }
.btn-secundario { background: var(--bg-elevado); color: var(--texto-destaque); border: 1px solid var(--borda-destaque); }
.btn-secundario:hover:not(:disabled) { border-color: var(--destaque); }
.btn-add-os { padding: 8px 11px; font-size: 0.8rem; letter-spacing: 0.2px; }
.btn-theme-icon { padding: 8px 9px; font-size: 0.92rem; }
.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: 8px;
  flex: 0 0 32px;
}
.btn-icon svg {
  width: 16px;
  height: 16px;
  display: block;
  flex-shrink: 0;
}
.btn-ver { background: var(--destaque); color: var(--texto-botao-destaque); }
.btn-ver:hover:not(:disabled) { background: var(--destaque-hover); }
.btn-download, .btn-print { background: var(--bg-elevado); color: var(--texto-destaque); border: 1px solid var(--borda-destaque); }
.btn-download:hover:not(:disabled), .btn-print:hover:not(:disabled) { background: var(--destaque); color: var(--texto-botao-destaque); }
.btn-excluir { background: rgba(239,68,68,0.14); color: var(--expirado-texto); border: 1px solid var(--expirado-borda); }
.btn-excluir:hover:not(:disabled) { background: #dc2626; color: #ffffff; border-color: #ef4444; }

.container {
  max-width: 1280px;
  margin: 12px auto 0;
  padding: 0 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--borda);
  border-top: 2.5px solid var(--destaque);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--borda);
}
.card-title { font-size: 0.94rem; font-weight: 800; color: var(--texto-destaque); }
.hidden { display: none !important; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
label { font-size: 0.8rem; font-weight: 700; color: var(--texto-destaque); }
.hint { font-size: 0.72rem; color: var(--texto-suave); line-height: 1.3; }
.warn-text { color: #f59e0b; font-weight: 700; }
input[type="text"], input[type="date"], select {
  background: var(--bg-input);
  color: var(--texto-principal);
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 0.88rem;
  width: 100%;
}
input[type="text"]:focus, input[type="date"]:focus, select:focus {
  outline: none;
  border-color: var(--destaque);
  box-shadow: 0 0 0 2px rgba(255,208,0,0.18);
}
input[type="file"] {
  background: var(--bg-input);
  color: var(--texto-suave);
  border: 1.5px dashed var(--destaque);
  border-radius: 8px;
  padding: 10px;
  width: 100%;
  font-size: 0.84rem;
}
.mode-switch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 720px) { .mode-switch { grid-template-columns: 1fr; } }
.mode-option {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--borda);
  color: var(--texto-principal);
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.mode-option input[type="radio"] { accent-color: var(--destaque); width: 15px; height: 15px; }
.specific-box {
  background: var(--bg-input);
  border: 1px solid var(--borda-destaque);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.specific-add-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.specific-add-row input[type="date"] { max-width: 220px; }
@media (max-width: 540px) { .specific-add-row input[type="date"] { max-width: 100%; } .specific-add-row button { width: 100%; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--bg-elevado);
  border: 1px solid var(--destaque);
  color: var(--texto-destaque);
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip button { background: none; color: var(--texto-destaque); padding: 0; font-size: 0.95rem; line-height: 1; }
.selected-files-list { margin-top: 4px; font-size: 0.8rem; color: var(--texto-suave); display: flex; flex-direction: column; gap: 3px; }
.progress-wrap { margin-top: 10px; background: var(--bg-input); border: 1px solid var(--borda); border-radius: 8px; overflow: hidden; height: 10px; }
.progress-bar { height: 100%; width: 0%; background: var(--destaque); transition: width 0.2s ease; }
.status-msg { margin-top: 6px; font-size: 0.82rem; font-weight: 700; color: var(--texto-destaque); min-height: 18px; }

.search-bar-row { display: flex; gap: 8px; align-items: center; }
.search-bar-row input[type="text"] { flex: 1 1 auto; }
.filter-count-badge {
  background: var(--destaque);
  color: var(--texto-botao-destaque);
  font-size: 0.7rem;
  font-weight: 900;
  padding: 2px 6px;
  border-radius: 999px;
}
.filters-drawer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--borda); }
.filters-grid { display: grid; grid-template-columns: repeat(2, minmax(150px, 1fr)) auto; gap: 10px; align-items: end; }
@media (max-width: 640px) { .filters-grid { grid-template-columns: 1fr; } #btnClearFilters { width: 100%; } }
.stats-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 0.75rem; }
.stat-pill {
  background: var(--bg-elevado);
  border: 1px solid var(--borda);
  padding: 3px 9px;
  border-radius: 999px;
  color: var(--texto-principal);
}
.stat-pill.vigente { border-color: var(--vigente-borda); color: var(--vigente-texto); background: var(--vigente-bg); }
.stat-pill.em-breve { border-color: var(--breve-borda); color: var(--breve-texto); background: var(--breve-bg); }
.stat-pill.permanente { border-color: var(--permanente-borda); color: var(--permanente-texto); background: var(--permanente-bg); }
.stat-pill.expirado { border-color: var(--expirado-borda); color: var(--expirado-texto); background: var(--expirado-bg); }

/* Tabela Desktop */
.table-wrap { width: 100%; overflow-x: auto; border-radius: 10px; border: 1px solid var(--borda); }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--bg-elevado);
  color: var(--texto-destaque);
  text-align: left;
  padding: 10px 12px;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid var(--destaque);
}
td {
  padding: 11px 12px;
  border-bottom: 1px solid rgba(128,128,128,0.16);
  font-size: 0.88rem;
  vertical-align: middle;
}

tr.os-vigente { background: var(--vigente-bg); box-shadow: inset 5px 0 0 var(--vigente-borda); }
tr.os-vigente .os-title-text { color: var(--vigente-texto); font-weight: 800; }

tr.os-em-breve { background: var(--breve-bg); box-shadow: inset 5px 0 0 var(--breve-borda); }
tr.os-em-breve .os-title-text { color: var(--breve-texto); font-weight: 800; }

tr.os-permanente { background: var(--permanente-bg); box-shadow: inset 5px 0 0 var(--permanente-borda); animation: fadeSlideIn 0.25s ease; }
tr.os-permanente .os-title-text { color: var(--permanente-texto); font-weight: 800; }

tr.os-expirado { background: var(--expirado-bg); box-shadow: inset 5px 0 0 var(--expirado-borda); animation: fadeSlideIn 0.25s ease; }
tr.os-expirado .os-title-text { color: var(--expirado-texto); font-weight: 800; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.os-subject-text {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--texto-principal);
  opacity: 0.92;
  line-height: 1.25;
}

.badge-status {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 0.66rem;
  font-weight: 900;
  letter-spacing: 0.3px;
  line-height: 1.25;
}
.badge-vigente { background: var(--vigente-badge); color: #ffffff; }
.badge-em-breve { background: var(--breve-badge); color: #ffffff; }
.badge-permanente { background: var(--permanente-badge); color: #ffffff; }
.badge-expirado { background: var(--expirado-badge); color: #ffffff; }

.badge-pasta {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--bg-card);
  color: var(--texto-destaque);
  border: 1px solid var(--destaque);
  padding: 1px 6px;
  border-radius: 6px;
  font-size: 0.68rem;
  font-weight: 800;
  line-height: 1.25;
}
.badge-pasta svg {
  width: 11px;
  height: 11px;
  display: block;
}

.desktop-status-row {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 6px;
  vertical-align: middle;
}

.mobile-right-stack { display: none; }
.actions-group { display: flex; gap: 6px; align-items: center; }
.empty-state { text-align: center; padding: 26px 14px; color: var(--texto-suave); font-size: 0.88rem; background: var(--bg-card); }

/* Linhas divisórias com botões Mostrar / Ocultar Permanentes e Expirados */
tr.section-divider-row td {
  padding: 10px 12px;
  background: var(--bg-app);
  border-bottom: none;
}
.section-toggle-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
}
.btn-toggle-section {
  background: var(--bg-card);
  color: var(--texto-principal);
  border: 1.5px solid var(--borda-destaque);
  border-radius: 999px;
  padding: 7px 15px;
  font-size: 0.78rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.btn-toggle-section:hover {
  background: var(--bg-elevado);
  border-color: var(--destaque);
  box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
}
.btn-toggle-section .arrow-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.btn-toggle-section.permanente-toggle .arrow-icon {
  background: var(--permanente-bg);
  color: var(--permanente-badge);
}
.btn-toggle-section.expired-toggle .arrow-icon {
  background: var(--expirado-bg);
  color: var(--expirado-badge);
}
.btn-toggle-section.expanded .arrow-icon {
  transform: rotate(180deg);
}
.btn-toggle-section .section-pill-count {
  color: #ffffff;
  font-size: 0.68rem;
  font-weight: 900;
  padding: 2px 7px;
  border-radius: 999px;
  line-height: 1.2;
}
.btn-toggle-section.permanente-toggle .section-pill-count {
  background: var(--permanente-badge);
}
.btn-toggle-section.expired-toggle .section-pill-count {
  background: var(--expirado-badge);
}

/* Layout organizado no celular */
@media (max-width: 768px) {
  .table-wrap { border: none; overflow-x: visible; border-radius: 0; }
  table, thead, tbody, tr, th, td { display: block; width: 100%; }
  thead { display: none; }
  tbody { display: flex; flex-direction: column; gap: 8px; }

  tr.section-divider-row {
    display: flex;
    justify-content: center;
    padding: 2px 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }
  tr.section-divider-row td {
    padding: 0;
    background: transparent;
    border: none;
    width: auto;
  }

  tr.os-vigente,
  tr.os-em-breve,
  tr.os-permanente,
  tr.os-expirado {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-radius: 10px;
    padding: 9px 10px 9px 12px;
    border: 1px solid rgba(128,128,128,0.24);
  }
  tr.os-vigente { border-left: 4px solid var(--vigente-borda); box-shadow: none; }
  tr.os-em-breve { border-left: 4px solid var(--breve-borda); box-shadow: none; }
  tr.os-permanente { border-left: 4px solid var(--permanente-borda); box-shadow: none; }
  tr.os-expirado { border-left: 4px solid var(--expirado-borda); box-shadow: none; }

  td { padding: 0; border: none; width: auto; }
  td.col-start, td.col-end, td.col-actions, .desktop-status-row { display: none; }

  td.col-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .mobile-left-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .os-title-line {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .os-title-text {
    font-size: 0.82rem;
    line-height: 1.25;
    word-break: break-word;
  }
  .os-subject-text {
    font-size: 0.75rem;
    line-height: 1.25;
    word-break: break-word;
  }
  .os-dates-line {
    font-size: 0.7rem;
    color: var(--texto-suave);
    line-height: 1.25;
    margin-top: 1px;
  }

  .mobile-right-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    flex: 0 0 auto;
  }
  .mobile-status-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
  }
  .actions-group {
    gap: 5px;
    flex-wrap: nowrap;
  }
  .btn-icon {
    width: 30px;
    height: 30px;
    flex: 0 0 30px;
  }
  .btn-icon svg {
    width: 15px;
    height: 15px;
  }
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}
.modal {
  background: var(--bg-card);
  border: 2px solid var(--destaque);
  border-radius: 12px;
  width: 100%;
  max-width: 1020px;
  max-height: 94vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-header {
  background: var(--bg-header);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--destaque);
}

function getTodayISO() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function formatDateBR(iso) {
  if (!iso) return "-";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function formatBytes(bytes = 0) {
  if (!bytes) return "0 B";
  const k = 1024;
  const units = ["B", "KB", "MB", "GB"];
  const idx = Math.floor(Math.log(bytes) / Math.log(k));
  return `${parseFloat((bytes / Math.pow(k, idx)).toFixed(1))} ${units[idx]}`;
}

function getExpirationTimestamp(order) {
  if (order.dateMode === "permanent" || order.isPermanent) return null;
  const refDateStr = order.endDate || order.startDate;
  if (refDateStr) {
    const [y, m, d] = refDateStr.split("-").map(Number);
    if (y && m && d) {
      const endOfDayUTC = Date.UTC(y, m - 1, d, 23, 59, 59, 999);
      return endOfDayUTC + (RETENTION_DAYS * DAY_MS);
    }
  }
  if (order.expiresAt) return order.expiresAt;
  if (order.createdAt) return order.createdAt + (RETENTION_DAYS * DAY_MS);
  return null;
}

function getOrderStatus(order) {
  if (order.dateMode === "permanent" || order.isPermanent) {
    return "permanente";
  }
  const today = getTodayISO();
  if (order.dateMode === "specific") {
    const list = Array.isArray(order.specificDates) ? [...order.specificDates].sort() : [];
    if (!list.length) return "expirado";
    if (list.includes(today)) return "vigente";
    if (today < list[list.length - 1]) return "em_breve";
    return "expirado";
  }
  const start = order.startDate || "";
  const end = order.endDate || start;
  if (!start) return "expirado";
  if (today < start) return "em_breve";
  if (today > end) return "expirado";
  return "vigente";
}

function matchDateFilter(order, targetISO) {
  if (!targetISO) return true;
  if (order.dateMode === "permanent" || order.isPermanent) return true;
  if (order.dateMode === "specific") {
    return (order.specificDates || []).includes(targetISO);
  }
  const start = order.startDate || "";
  const end = order.endDate || start;
  return targetISO >= start && targetISO <= end;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || "");
      const commaIdx = result.indexOf(",");
      resolve(commaIdx >= 0 ? result.slice(commaIdx + 1) : result);
    };
    reader.onerror = () => reject(new Error(`Falha ao ler ${file.name}`));
    reader.readAsDataURL(file);
  });
}

async function postToAppsScript(payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (_) {
    throw new Error(`Resposta inesperada: ${text.slice(0, 160)}`);
  }
  if (!res.ok || !json.ok) {
    throw new Error(json.error || `Erro HTTP ${res.status}`);
  }
  return json;
}

async function uploadFileToDrive(file) {
  const base64 = await fileToBase64(file);
  const data = await postToAppsScript({
    action: "upload",
    name: file.name,
    mimeType: file.type || "application/octet-stream",
    base64
  });
  return {
    name: data.name || file.name,
    type: data.mimeType || file.type || "application/octet-stream",
    size: file.size,
    fileId: data.fileId,
    viewUrl: data.viewUrl,
    downloadUrl: data.downloadUrl,
    directUrl: data.directUrl,
    url: data.viewUrl || data.downloadUrl,
    storageProvider: "gdrive"
  };
}

async function removeFilesFromDrive(files = []) {
  const gdriveFiles = (files || []).filter((f) => f && f.fileId);
  for (const f of gdriveFiles) {
    try {
      await postToAppsScript({ action: "delete", fileId: f.fileId });
    } catch (err) {
      console.warn("Aviso ao remover no Drive:", f.name, err);
    }
  }
}

osForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!checkPassword()) return;

  const title = osTitle.value.trim();
  const subject = osSubject.value.trim();
  const mode = document.querySelector('input[name="dateMode"]:checked').value;
  const files = Array.from(osFilesInput.files || []);
  if (!title) return alert("Informe o título.");
  if (!files.length) return alert("Selecione pelo menos um arquivo.");

  let startDate = "";
  let endDate = "";
  let sortedSpecific = [];

  if (mode === "range") {
    startDate = startDateInput.value;
    endDate = endDateInput.value || startDate;
    if (!startDate) return alert("Informe a Data Início.");
    if (endDate < startDate) return alert("Data Término menor que Data Início.");
  } else if (mode === "specific") {
    if (!specificDates.length) return alert("Adicione pelo menos um dia específico.");
    sortedSpecific = [...specificDates].sort();
    startDate = sortedSpecific[0];
    endDate = sortedSpecific[sortedSpecific.length - 1];
  }

  btnSubmitOs.disabled = true;
  uploadProgress.style.width = "0%";
  uploadStatus.textContent = "Enviando arquivos...";

  try {
    const uploaded = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      uploadProgress.style.width = `${Math.round((i / files.length) * 85)}%`;
      uploadStatus.textContent = `Enviando (${i + 1}/${files.length}): ${file.name}...`;
      const item = await uploadFileToDrive(file);
      uploaded.push(item);
      uploadProgress.style.width = `${Math.round(((i + 1) / files.length) * 85)}%`;
    }

    uploadProgress.style.width = "92%";
    uploadStatus.textContent = "Salvando...";

    const now = Date.now();
    const orderPayload = {
      title,
      subject,
      dateMode: mode,
      isPermanent: mode === "permanent",
      startDate,
      endDate,
      specificDates: sortedSpecific,
      files: uploaded,
      createdAt: now
    };
    orderPayload.expiresAt = getExpirationTimestamp(orderPayload);
    await addDoc(osCollection, orderPayload);

    uploadProgress.style.width = "100%";
    uploadStatus.textContent = "Salvo!";
    osForm.reset();
    updateDateModeFields("range");
    specificDates = [];
    renderSpecificChips();
    selectedFilesPreview.innerHTML = "";
    setTimeout(() => {
      uploadProgress.style.width = "0%";
      uploadStatus.textContent = "";
      setInsertMode(false);
    }, 800);
  } catch (err) {
    console.error(err);
    uploadStatus.textContent = "Erro: " + (err.message || err);
  } finally {
    btnSubmitOs.disabled = false;
  }
});

async function deleteOrder(order) {
  if (!checkPassword()) return;
  const ok = confirm(`Excluir "${order.title}"?`);
  if (!ok) return;
  try {
    await removeFilesFromDrive(order.files || []);
    await deleteDoc(doc(db, "ordens_servico", order.id));
  } catch (err) {
    console.error(err);
    alert("Erro ao excluir: " + (err.message || err));
  }
}

async function runThreeMonthCleanup(orders) {
  if (cleanupRunning) return;
  const now = Date.now();
  const expired = orders.filter((o) => {
    if (o.dateMode === "permanent" || o.isPermanent) return false;
    const exp = getExpirationTimestamp(o);
    return exp !== null && now >= exp;
  });
  if (!expired.length) return;
  cleanupRunning = true;
  try {
    for (const order of expired) {
      await removeFilesFromDrive(order.files || []);
      try { await deleteDoc(doc(db, "ordens_servico", order.id)); } catch (_) {}
    }
  } finally {
    cleanupRunning = false;
  }
}

function getFileDownloadUrl(file) {
  return file.downloadUrl || file.url || file.viewUrl || "#";
}

function getFilePreviewUrl(file) {
  if (file.fileId) {
    return `https://drive.google.com/file/d/${file.fileId}/preview`;
  }
  return file.viewUrl || file.url || "";
}

function triggerFilePrint(file) {
  if (!file) return;
  const lower = (file.name || "").toLowerCase();
  const mime = (file.type || "").toLowerCase();
  const previewUrl = getFilePreviewUrl(file);
  const dlUrl = getFileDownloadUrl(file);

  const iframe = modalBody.querySelector("iframe");
  if (iframe && iframe.contentWindow) {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
      return;
    } catch (_) {
      // Cross-origin do Google Drive bloqueia chamada direta; segue para janela dedicada
    }
  }

  if (mime.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(lower)) {
    const imgSrc = file.directUrl || previewUrl || dlUrl;
    const printWin = window.open("", "_blank", "noopener,noreferrer");
    if (printWin) {
      printWin.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>${escapeHtml(file.name)}</title>
          <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
            img { max-width: 100%; height: auto; display: block; }
            @media print { img { max-width: 100%; max-height: 100vh; page-break-inside: avoid; } }
          </style>
        </head>
        <body>
          <img id="pImg" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(file.name)}" />
          <script>
            const img = document.getElementById("pImg");
            img.onload = () => setTimeout(() => { window.print(); }, 150);
            img.onerror = () => window.print();
          <\/script>
        </body>
        </html>
      `);
      printWin.document.close();
      return;
    }
  }

  const targetUrl = previewUrl || dlUrl;
  if (targetUrl && targetUrl !== "#") {
    window.open(targetUrl, "_blank", "noopener,noreferrer");
  }
}

modalPrintBtn.addEventListener("click", () => {

});

function openSingleViewer(file) {
  activeModalFile = file;
  const dlUrl = getFileDownloadUrl(file);
  const previewUrl = getFilePreviewUrl(file);
  modalTitle.textContent = file.name;

  modalPrintBtn.classList.remove("hidden");

  modalOpenTab.href = previewUrl || dlUrl;
  modalOpenTab.classList.remove("hidden");

  modalDirectDownload.href = dlUrl;
  modalDirectDownload.download = file.name;
  modalDirectDownload.classList.remove("hidden");

  modalBody.innerHTML = "";

  const lower = (file.name || "").toLowerCase();
  const mime = (file.type || "").toLowerCase();
  const isPdf = mime === "application/pdf" || lower.endsWith(".pdf");

  setPdfZoomMode(isPdf);

  if (mime.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/.test(lower)) {
    const img = document.createElement("img");
    img.src = file.directUrl || previewUrl || dlUrl;
    img.alt = file.name;
    img.className = "viewer-media";
    modalBody.appendChild(img);
  } else if (mime.startsWith("video/") || /\.(mp4|webm|ogg|mov)$/.test(lower)) {
    const video = document.createElement("video");
    video.src = previewUrl || dlUrl;
    video.controls = true;
    video.className = "viewer-media";
    modalBody.appendChild(video);
  } else if (isPdf || /\.(doc|docx|xls|xlsx|ppt|pptx)$/.test(lower)) {
    const iframe = document.createElement("iframe");
    iframe.src = previewUrl;
    iframe.className = "viewer-frame";
    modalBody.appendChild(iframe);
  } else {
    modalBody.innerHTML = `
      <div class="empty-state">
        Pré-visualização indisponível para este arquivo.<br/>
        Use <strong>Nova guia</strong> ou o botão de download no topo.
      </div>`;
  }
  modalBackdrop.classList.remove("hidden");
}

function escapeHtml(str = "") {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function getStatusMeta(status) {
  if (status === "vigente") {
    return { rowClass: "os-vigente", badgeClass: "badge-vigente", label: "VIGENTE" };
  }
  if (status === "em_breve") {
    return { rowClass: "os-em-breve", badgeClass: "badge-em-breve", label: "EM BREVE" };
  }
  if (status === "permanente") {
    return { rowClass: "os-permanente", badgeClass: "badge-permanente", label: "PERMANENTE" };
  }
  return { rowClass: "os-expirado", badgeClass: "badge-expirado", label: "EXPIRADO" };
}

    btnImp.title = "Imprimir";

    const btnDl = document.createElement("a");

function createSectionDividerRow({ count, isExpanded, showLabel, hideLabel, variantClass, onToggle }) {

function renderList() {
  updateFilterBadge();
  const term = searchInput.value.trim().toLowerCase();
  const dateVal = filterDate.value;
  const statusVal = filterStatus.value;

  const matchedBySearchAndDate = allOrders.filter((order) => {
    const status = getOrderStatus(order);
    if (statusVal !== "all" && status !== statusVal) return false;
    if (dateVal && !matchDateFilter(order, dateVal)) return false;
    if (term) {
      const hitTitle = (order.title || "").toLowerCase().includes(term);
      const hitSubject = (order.subject || "").toLowerCase().includes(term);
      const hitFiles = (order.files || []).some((f) => (f.name || "").toLowerCase().includes(term));
      const hitDates =
        (order.startDate || "").includes(term) ||
        (order.endDate || "").includes(term) ||
        formatDateBR(order.startDate).includes(term) ||
        formatDateBR(order.endDate).includes(term) ||
        (order.specificDates || []).some((d) => d.includes(term) || formatDateBR(d).includes(term));
      if (!hitTitle && !hitSubject && !hitFiles && !hitDates) return false;
    }
    return true;
  });

  const statusPriority = { vigente: 0, em_breve: 1 };
  const byNewest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);

  const activeItems = matchedBySearchAndDate
    .filter((o) => {
      const s = getOrderStatus(o);
      return s === "vigente" || s === "em_breve";
    })
    .sort((a, b) => {
      const diff = (statusPriority[getOrderStatus(a)] ?? 9) - (statusPriority[getOrderStatus(b)] ?? 9);
      return diff !== 0 ? diff : byNewest(a, b);
    });

  const permanentItems = matchedBySearchAndDate
    .filter((o) => getOrderStatus(o) === "permanente")
    .sort(byNewest);

  const expiredItems = matchedBySearchAndDate
    .filter((o) => getOrderStatus(o) === "expirado")
    .sort(byNewest);

  const shouldShowPermanent = statusVal === "permanente" || showPermanent;
  const shouldShowExpired = statusVal === "expirado" || showExpired;

  const displayedCount =
    activeItems.length +
    (shouldShowPermanent ? permanentItems.length : 0) +
    (shouldShowExpired ? expiredItems.length : 0);

  const vigentesCount = allOrders.filter((o) => getOrderStatus(o) === "vigente").length;
  const emBreveCount = allOrders.filter((o) => getOrderStatus(o) === "em_breve").length;
  const permanentesCount = allOrders.filter((o) => getOrderStatus(o) === "permanente").length;
  const expiradosCount = allOrders.filter((o) => getOrderStatus(o) === "expirado").length;

  statsBar.innerHTML = `
    <span class="stat-pill">Total: <strong>${allOrders.length}</strong></span>
    <span class="stat-pill vigente">Vigentes: <strong>${vigentesCount}</strong></span>
    <span class="stat-pill em-breve">Em breve: <strong>${emBreveCount}</strong></span>
    <span class="stat-pill permanente">Permanentes: <strong>${permanentesCount}</strong></span>
    <span class="stat-pill expirado">Expirados: <strong>${expiradosCount}</strong></span>
    <span class="stat-pill">Exibidos: <strong>${displayedCount}</strong></span>
  `;

  osTableBody.innerHTML = "";

  if (!activeItems.length && !permanentItems.length && !expiredItems.length) {
    osTableBody.innerHTML = `
      <tr>
        <td colspan="4" class="empty-state">Nenhuma Ordem de Serviço encontrada.</td>
      </tr>`;
    return;
  }

  if (activeItems.length) {
    activeItems.forEach((order) => {
      osTableBody.appendChild(createOrderRow(order));
    });
  } else if (statusVal === "all" && !shouldShowPermanent && !shouldShowExpired) {
    osTableBody.innerHTML = `
      <tr>
        <td colspan="4" class="empty-state">Nenhuma Ordem de Serviço vigente ou em breve.</td>
      </tr>`;
  }

  if (permanentItems.length > 0 && statusVal !== "permanente") {
    osTableBody.appendChild(
      createSectionDividerRow({
        count: permanentItems.length,
        isExpanded: showPermanent,
        showLabel: "Mostrar permanentes",
        hideLabel: "Ocultar permanentes",
        variantClass: "permanente-toggle",
        onToggle: () => {
          showPermanent = !showPermanent;
          renderList();
        }
      })
    );
  }

  if (shouldShowPermanent) {
    permanentItems.forEach((order) => {
      osTableBody.appendChild(createOrderRow(order));
    });
  }

  if (expiredItems.length > 0 && statusVal !== "expirado") {
    osTableBody.appendChild(
      createSectionDividerRow({
        count: expiredItems.length,
        isExpanded: showExpired,
        showLabel: "Mostrar expirados",
        hideLabel: "Ocultar expirados",
        variantClass: "expired-toggle",
        onToggle: () => {
          showExpired = !showExpired;
          renderList();
        }
      })
    );
  }

  if (shouldShowExpired) {
    expiredItems.forEach((order) => {
      osTableBody.appendChild(createOrderRow(order));
    });
  }
}

onSnapshot(
  q,
  (snap) => {
    allOrders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderList();
    runThreeMonthCleanup(allOrders);
  },
  (err) => {
    console.error(err);
    osTableBody.innerHTML = `
