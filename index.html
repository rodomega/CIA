<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App Portal</title>

  <!-- Tags do Ícone / Favicon (Atualizados dinamicamente pelo Admin) -->
  <link id="dynamicFavicon" rel="icon" href="https://via.placeholder.com/64" type="image/x-icon">
  <link id="appleTouchIcon" rel="apple-touch-icon" href="https://via.placeholder.com/192">

  <!-- Estilos da Aplicação -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background-color: #1a1a2e;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: background 0.3s ease;
      color: #fff;
    }

    header {
      width: 100%;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .btn-admin {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-admin:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Grade Estilo Smartphone */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 480px;
      padding: 30px 20px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-bottom: 8px;
      background-color: #2a2a40;
    }

    .app-title {
      font-size: 0.75rem;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      word-break: break-word;
    }

    /* Modal / Painel Admin */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #252538;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .admin-section {
      margin-bottom: 24px;
    }

    .admin-section h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #4da6ff;
    }

    .form-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #ccc;
    }

    .form-group input[type="text"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: #fff;
      font-size: 0.9rem;
    }

    .form-group small {
      font-size: 0.75rem;
      color: #888;
    }

    .btn-submit {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background: #0056b3;
    }

    .preview-box {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      margin-top: 6px;
      display: none;
    }
  </style>

  <!-- SDKs do Firebase (v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>

  <header>
    <h1>Portal Principal</h1>
    <button class="btn-admin" onclick="openAdminModal()">Modo Admin</button>
  </header>

  <!-- Grade de Atalhos/Aplicativos -->
  <main class="app-grid" id="appGrid">
    <!-- Ícones adicionados dinamicamente aparecerão aqui -->
  </main>

  <!-- Painel de Administração / Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Painel Administrativo</h2>
        <button class="close-btn" onclick="closeAdminModal()">&times;</button>
      </div>

      <!-- Seção 1: Configuração de Aparência do App -->
      <div class="admin-section">
        <h3>1. Aparência Global</h3>
        
        <!-- Configuração de Fundo -->
        <div class="form-group">
          <label>Imagem de Fundo (URL):</label>
          <input type="text" id="bgUrlInput" placeholder="https://exemplo.com/fundo.jpg">
          <small>ou envie do seu arquivo:</small>
          <input type="file" id="bgFileInput" accept="image/*">
        </div>

        <!-- Configuração do Ícone/Favicon -->
        <div class="form-group">
          <label>Ícone do Navegador / Atalho (Favicon):</label>
          <input type="text" id="faviconUrlInput" placeholder="https://exemplo.com/icone.png">
          <small>ou envie do seu arquivo:</small>
          <input type="file" id="faviconFileInput" accept="image/*">
        </div>

        <button class="btn-submit" onclick="salvarAparencia()">Salvar Aparência</button>
      </div>

      <!-- Seção 2: Adicionar Novos Atalhos -->
      <div class="admin-section">
        <h3>2. Adicionar Novo Atalho</h3>
        <div class="form-group">
          <label>Nome do Atalho:</label>
          <input type="text" id="shortcutTitle" placeholder="Ex: Google">
        </div>
        <div class="form-group">
          <label>URL de Destino:</label>
          <input type="text" id="shortcutUrl" placeholder="https://google.com">
        </div>
        <div class="form-group">
          <label>Ícone do Atalho (URL):</label>
          <input type="text" id="shortcutIconUrl" placeholder="https://exemplo.com/icone.png">
          <small>ou envie do seu arquivo:</small>
          <input type="file" id="shortcutIconFile" accept="image/*">
        </div>
        <button class="btn-submit" onclick="salvarAtalho()">Cadastrar Atalho</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. Configuração do Firebase (Substitua pelos dados do seu projeto)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "SEU_API_KEY",
      authDomain: "SEU_PROJECT_ID.firebaseapp.com",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_PROJECT_ID.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    // Inicializa Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const storage = firebase.storage();

    // Registrar Service Worker se disponível
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.log('Service Worker não registrado:', err);
      });
    }

    // -------------------------------------------------------------
    // 2. Modais e Interface
    // -------------------------------------------------------------
    function openAdminModal() {
      document.getElementById('adminModal').classList.add('active');
    }

    function closeAdminModal() {
      document.getElementById('adminModal').classList.remove('active');
    }

    // -------------------------------------------------------------
    // 3. Aplicação e Gerenciamento de Aparência
    // -------------------------------------------------------------
    function aplicarAparencia(bgUrl, faviconUrl) {
      if (bgUrl) {
        document.body.style.backgroundImage = `url('${bgUrl}')`;
      }
      if (faviconUrl) {
        const favicon = document.getElementById('dynamicFavicon');
        const appleIcon = document.getElementById('appleTouchIcon');
        if (favicon) favicon.href = faviconUrl;
        if (appleIcon) appleIcon.href = faviconUrl;
      }
    }

    async function carregarAparencia() {
      try {
        const doc = await db.collection('settings').doc('appearance').get();
        if (doc.exists) {
          const data = doc.data();
          aplicarAparencia(data.bgUrl, data.faviconUrl);
          
          // Preenche os campos do Admin com os valores atuais
          if (data.bgUrl) document.getElementById('bgUrlInput').value = data.bgUrl;
          if (data.faviconUrl) document.getElementById('faviconUrlInput').value = data.faviconUrl;
        }
      } catch (error) {
        console.error("Erro ao carregar configurações de aparência:", error);
      }
    }

    async function salvarAparencia() {
      const bgUrlInput = document.getElementById('bgUrlInput').value;
      const bgFileInput = document.getElementById('bgFileInput').files[0];
      const faviconUrlInput = document.getElementById('faviconUrlInput').value;
      const faviconFileInput = document.getElementById('faviconFileInput').files[0];

      let finalBgUrl = bgUrlInput;
      let finalFaviconUrl = faviconUrlInput;

      try {
        // Upload do arquivo de imagem de fundo se fornecido
        if (bgFileInput) {
          const bgRef = storage.ref(`config/background_${Date.now()}`);
          await bgRef.put(bgFileInput);
          finalBgUrl = await bgRef.getDownloadURL();
        }

        // Upload do arquivo de favicon/ícone se fornecido
        if (faviconFileInput) {
          const faviconRef = storage.ref(`config/favicon_${Date.now()}`);
          await faviconRef.put(faviconFileInput);
          finalFaviconUrl = await faviconRef.getDownloadURL();
        }

        // Atualiza/Cria documento no Firestore
        await db.collection('settings').doc('appearance').set({
          bgUrl: finalBgUrl || '',
          faviconUrl: finalFaviconUrl || '',
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        aplicarAparencia(finalBgUrl, finalFaviconUrl);
        alert('Aparência atualizada com sucesso!');
        closeAdminModal();

      } catch (error) {
        console.error("Erro ao salvar aparência:", error);
        alert('Erro ao salvar as configurações de aparência.');
      }
    }

    // -------------------------------------------------------------
    // 4. Gerenciamento de Atalhos
    // -------------------------------------------------------------
    async function salvarAtalho() {
      const title = document.getElementById('shortcutTitle').value;
      const url = document.getElementById('shortcutUrl').value;
      const iconUrl = document.getElementById('shortcutIconUrl').value;
      const iconFile = document.getElementById('shortcutIconFile').files[0];

      if (!title || !url) {
        alert('Preencha pelo menos o Título e a URL do atalho.');
        return;
      }

      let finalIconUrl = iconUrl;

      try {
        if (iconFile) {
          const iconRef = storage.ref(`shortcuts/icon_${Date.now()}`);
          await iconRef.put(iconFile);
          finalIconUrl = await iconRef.getDownloadURL();
        }

        await db.collection('shortcuts').add({
          title: title,
          url: url,
          iconUrl: finalIconUrl || 'https://via.placeholder.com/64',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        // Limpa os campos do formulário
        document.getElementById('shortcutTitle').value = '';
        document.getElementById('shortcutUrl').value = '';
        document.getElementById('shortcutIconUrl').value = '';
        document.getElementById('shortcutIconFile').value = '';

        alert('Atalho cadastrado!');
        closeAdminModal();

      } catch (error) {
        console.error("Erro ao salvar atalho:", error);
        alert('Erro ao cadastrar atalho.');
      }
    }

    function carregarAtalhos() {
      db.collection('shortcuts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        const grid = document.getElementById('appGrid');
        grid.innerHTML = '';

        snapshot.forEach(doc => {
          const item = doc.data();
          const appEl = document.createElement('a');
          appEl.className = 'app-item';
          appEl.href = item.url;
          appEl.target = '_blank';
          appEl.innerHTML = `
            <img src="${item.iconUrl}" class="app-icon" alt="${item.title}" onerror="this.src='https://via.placeholder.com/64'">
            <span class="app-title">${item.title}</span>
          `;
          grid.appendChild(appEl);
        });
      });
    }

    // Inicialização da página
    document.addEventListener('DOMContentLoaded', () => {
      carregarAparencia();
      carregarAtalhos();
    });
  </script>
</body>
</html>
