<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal PM</title>
  
  <!-- Manifest para PWA -->
  <link rel="manifest" href='data:application/manifest+json,{"id":"/portal-pm","name":"Portal PM","short_name":"Portal PM","start_url":"./index.html","scope":"./","display":"standalone","background_color":"#0f172a","theme_color":"#0f172a","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2838/2838912.png","sizes":"512x512","type":"image/png","purpose":"any"}]}'>
  
  <style>
    :root {
      --bg-color: #0f172a;
      --bg-image: none;
    }
    
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 12px;
    }

    .btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 5px 0;
    }

    .btn-install {
      background-color: #16a34a;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      display: none;
    }

    .admin-section {
      margin-top: 30px;
      border-top: 1px solid #334155;
      padding-top: 20px;
    }

    input[type="color"], input[type="file"] {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #475569;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Portal PM</h1>

    <!-- Botão de Instalação do PWA -->
    <button id="btnInstall" class="btn btn-install">📲 Instalar Aplicativo no Dispositivo</button>

    <main id="appContent">
      <p>Bem-vindo ao Portal PM.</p>
    </main>

    <!-- PAINEL DE ADMINISTRAÇÃO -->
    <section class="admin-section">
      <h2>Painel do Administrador</h2>

      <!-- Atalho de Instalação no Modo Admin -->
      <button id="btnInstallAdmin" class="btn" style="background-color: #8b5cf6;">➕ Adicionar Atalho à Tela Inicial (Admin)</button>

      <hr style="margin: 15px 0; border-color: #334155;">

      <h3>Personalização do Fundo (Salvo no Firebase)</h3>
      
      <label>Cor de Fundo:</label>
      <input type="color" id="bgColorPicker" value="#0f172a">

      <label>Imagem de Fundo (Upload para Firebase Storage):</label>
      <input type="file" id="bgImageInput" accept="image/*">

      <button id="btnSaveTheme" class="btn">Salvar no Firebase</button>
      <p id="uploadStatus" style="font-size: 14px; color: #38bdf8;"></p>
    </section>
  </div>

  <!-- Scripts do Firebase (SDKs v9/v10 compatíveis) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // Subtitua com as credenciais do seu projeto Firebase
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "portalpm-8bc1a.firebaseapp.com",
      projectId: "portalpm-8bc1a",
      storageBucket: "portalpm-8bc1a.firebasestorage.app",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const themeDocRef = doc(db, "configuracoes", "tema");

    // 1. OUVIR ALTERAÇÕES EM TEMPO REAL NO FIREBASE
    onSnapshot(themeDocRef, (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.data();
        if (data.bgColor) {
          document.documentElement.style.setProperty('--bg-color', data.bgColor);
          document.getElementById('bgColorPicker').value = data.bgColor;
        }
        if (data.bgImageUrl) {
          document.documentElement.style.setProperty('--bg-image', `url('${data.bgImageUrl}')`);
        }
      }
    });

    // 2. SALVAR COR E ENVIAR IMAGEM PARA O FIREBASE STORAGE
    const btnSaveTheme = document.getElementById('btnSaveTheme');
    const bgImageInput = document.getElementById('bgImageInput');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const uploadStatus = document.getElementById('uploadStatus');

    btnSaveTheme.addEventListener('click', async () => {
      const selectedColor = bgColorPicker.value;
      const file = bgImageInput.files[0];

      uploadStatus.innerText = "A guardar no Firebase...";

      try {
        let imageUrl = null;

        // Se uma nova imagem foi selecionada, faz o upload no Firebase Storage
        if (file) {
          const imageRef = ref(storage, `fundo_app/${Date.now()}_${file.name}`);
          await uploadBytes(imageRef, file);
          imageUrl = await getDownloadURL(imageRef);
        }

        // Atualiza o documento no Firestore
        const updateData = { bgColor: selectedColor };
        if (imageUrl) {
          updateData.bgImageUrl = imageUrl;
        }

        await setDoc(themeDocRef, updateData, { merge: true });
        uploadStatus.innerText = "Configurações salvas com sucesso no Firebase!";
      } catch (error) {
        console.error("Erro ao salvar no Firebase:", error);
        uploadStatus.innerText = "Erro ao salvar alterações.";
      }
    });
  </script>

  <script>
    // Registro do Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(() => console.log('Service Worker registrado.'))
          .catch(err => console.log('Erro SW:', err));
      });
    }

    // Gerenciador de Instalação do PWA
    let deferredPrompt;
    const btnInstall = document.getElementById('btnInstall');
    const btnInstallAdmin = document.getElementById('btnInstallAdmin');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
    });

    function triggerInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('App Instalado');
          }
          deferredPrompt = null;
          btnInstall.style.display = 'none';
        });
      } else {
        alert('Para instalar pelo Chrome: abra o menu (3 pontos) e selecione "Adicionar à tela inicial" ou "Instalar aplicativo".');
      }
    }

    btnInstall.addEventListener('click', triggerInstall);
    btnInstallAdmin.addEventListener('click', triggerInstall);
  </script>
</body>
</html>
