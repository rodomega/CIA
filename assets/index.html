<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Controle - Estilo Xiaomi</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f242d, #0d1117);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container Principal no Estilo HyperOS */
    .control-center {
      background: rgba(35, 38, 45, 0.7);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Linha dos botões principais */
    .buttons-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }

    /* Botões Circulares Principais */
    .circle-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .circle-btn:hover {
      background-color: rgba(255, 255, 255, 0.22);
      transform: scale(1.05);
    }

    /* Estado ativo do botão */
    .circle-btn.active {
      background-color: #ffffff;
      color: #111111;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    /* Botão de Adicionar (+) */
    .add-btn {
      background-color: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.6);
    }

    .add-btn:hover {
      border-color: #ffffff;
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* Painel de Submenus Expansível */
    .submenu-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(0, 0, 0, 0.25);
      border-radius: 24px;
      padding: 0 16px;
    }

    .submenu-panel.open {
      max-height: 400px;
      opacity: 1;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Grid dos Submenus */
    .submenu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      justify-items: center;
    }

    /* Links/Botões do Submenu */
    .sub-item {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .sub-item:hover {
      background-color: rgba(255, 255, 255, 0.9);
      color: #111;
      transform: translateY(-2px);
    }

    .menu-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .header-title {
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="control-center">
    <div class="header-title">Minha Central de Controle</div>
    
    <!-- Área onde os botões e submenus ficarão -->
    <div id="buttons-container" class="menu-group">
      
      <!-- Bloco do Primeiro Botão -->
      <div class="button-wrapper" id="group-1">
        <div class="buttons-row">
          <button class="circle-btn" onclick="toggleSubmenu('sub-1', this)">
            <i class="fa-solid fa-sliders"></i>
          </button>
        </div>

        <!-- Submenu do Primeiro Botão -->
        <div class="submenu-panel" id="sub-1">
          <div class="submenu-grid">
            <a href="https://google.com" target="_blank" class="sub-item" title="Google"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="https://youtube.com" target="_blank" class="sub-item" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://github.com" target="_blank" class="sub-item" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="https://spotify.com" target="_blank" class="sub-item" title="Spotify"><i class="fa-brands fa-spotify"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-gear"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-wifi"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-bluetooth-b"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-moon"></i></a>
          </div>
        </div>
      </div>

    </div>

    <!-- Botão de Adicionar (+) -->
    <div class="buttons-row">
      <button class="circle-btn add-btn" onclick="addNewButton()" title="Adicionar Novo Menu">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </div>

  <script>
    let buttonCount = 1;

    // Função para abrir/fechar o submenu correspondente
    function toggleSubmenu(panelId, btnElement) {
      const panel = document.getElementById(panelId);
      
      // Alterna classe 'active' no botão para acender/apagar
      btnElement.classList.toggle('active');
      
      // Alterna exibição do submenu
      panel.classList.toggle('open');
    }

    // Função para adicionar um novo botão com submenus
    function addNewButton() {
      buttonCount++;
      const container = document.getElementById('buttons-container');

      const newGroup = document.createElement('div');
      newGroup.className = 'button-wrapper';
      newGroup.id = `group-${buttonCount}`;

      newGroup.innerHTML = `
        <div class="buttons-row" style="margin-top: 10px;">
          <button class="circle-btn" onclick="toggleSubmenu('sub-${buttonCount}', this)">
            <i class="fa-solid fa-border-all"></i>
          </button>
        </div>

        <div class="submenu-panel" id="sub-${buttonCount}">
          <div class="submenu-grid">
            <a href="https://instagram.com" target="_blank" class="sub-item"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://twitter.com" target="_blank" class="sub-item"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-envelope"></i></a>
            <a href="#" class="sub-item"><i class="fa-solid fa-camera"></i></a>
          </div>
        </div>
      `;

      container.appendChild(newGroup);
    }
  </script>
</body>
</html>
