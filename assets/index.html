<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandar Atividade</title>
    <style>
        :root {
            --bg-app: #ffffff;
            --bg-card: #ffffff;
            --bg-elevado: #f4f5f7;
            --bg-input: #f9fafb;
            --bg-header: #ffffff;
            --destaque: #000000;
            --destaque-suave: #eab308;
            --texto-principal: #000000;
            --texto-suave: #374151;
            --borda: #d1d5db;
            --borda-forte: #000000;
        }

        body.dark-theme {
            --bg-app: #111111;
            --bg-card: #1e1e1e;
            --bg-elevado: #2a2a2a;
            --bg-input: #2c2c2c;
            --bg-header: #0a0a0a;
            --destaque: #ffd700;
            --destaque-suave: #ffd700;
            --texto-principal: #ffd700;
            --texto-suave: #bbbbbb;
            --borda: #444444;
            --borda-forte: #ffd700;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-app);
            color: var(--texto-principal);
            margin: 0;
            padding: 10px 12px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Indicador discreto no topo estilo status bar de celular */
        .top-status-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 2px;
        }

        .status-chip-btn {
            background: transparent;
            border: 1px solid var(--borda);
            color: var(--texto-suave);
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            opacity: 0.8;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .status-chip-btn:hover {
            opacity: 1;
            border-color: var(--borda-forte);
            color: var(--texto-principal);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #16a34a;
        }

        h1 {
            border-bottom: 2px solid var(--borda-forte);
            padding-bottom: 6px;
            margin: 2px 0 10px;
            text-align: center;
            font-size: 1.3em;
            width: 100%;
            max-width: 600px;
            color: var(--texto-principal);
        }

        /* Barra de ações compacta e discreta */
        .top-action-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 14px;
        }

        .btn-top {
            padding: 6px 9px;
            font-size: 0.74rem;
            font-weight: 700;
            border: 1px solid var(--borda);
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.18s, transform 0.1s, border-color 0.15s;
            text-align: center;
            touch-action: manipulation;
            line-height: 1.15;
            white-space: nowrap;
        }

        .btn-top:active { transform: scale(0.97); }
        .btn-top:hover { opacity: 0.9; border-color: var(--borda-forte); }

        .btn-whatsapp { background-color: #16a34a; color: #ffffff; border-color: #15803d; }
        .btn-copy { background-color: var(--destaque-suave); color: #000000; border-color: rgba(0,0,0,0.2); }
        .btn-general { background-color: #ea580c; color: #ffffff; border-color: #c2410c; }
        .btn-add-accum { background-color: #0f766e; color: #ffffff; border-color: #115e59; }
        .btn-view-accum { background-color: #6d28d9; color: #ffffff; border-color: #5b21b6; }
        .btn-import { background-color: #0284c7; color: #ffffff; border-color: #0369a1; }
        .btn-clear { background-color: var(--bg-elevado); color: var(--texto-suave); border-color: var(--borda); }

        .tabs-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 12px;
            scrollbar-width: thin;
        }

        .tab {
            background-color: var(--bg-elevado);
            color: var(--texto-suave);
            border: 1px solid var(--borda);
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }

        .tab.active {
            background-color: var(--bg-card);
            color: var(--texto-principal);
            border-color: var(--borda-forte);
            border-width: 2px;
        }

        .tab-close {
            background: none;
            border: none;
            color: #dc2626;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0 2px;
        }

        .btn-add-tab {
            background-color: var(--borda-forte);
            color: var(--bg-app);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            touch-action: manipulation;
        }

        .tab-config-section {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            border: 1px dashed var(--borda);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-config-section label {
            font-weight: bold;
            color: var(--texto-suave);
            font-size: 0.88em;
            white-space: nowrap;
        }

        .tab-config-section input {
            flex: 1;
            padding: 8px 10px;
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-principal);
            border-radius: 6px;
            font-size: 0.95em;
        }

        .section {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-card);
            border: 1px solid var(--borda);
            border-top: 3px solid var(--borda-forte);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        .section-title {
            font-weight: bold;
            font-size: 1.08em;
            margin-bottom: 12px;
            color: var(--texto-principal);
        }

        .input-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media (max-width: 520px) {
            .input-grid-2 { grid-template-columns: 1fr; }
        }

        .input-group {
            margin-bottom: 11px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--texto-suave);
            font-size: 0.86em;
            font-weight: 600;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 9px 10px;
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-principal);
            border-radius: 6px;
            font-size: 0.95em;
        }

        .item-list {
            width: 100%;
            max-width: 600px;
        }

        .item-toggle {
            width: 100%;
            background-color: var(--bg-elevado);
            color: var(--texto-principal);
            padding: 13px 14px;
            border: 1px solid var(--borda);
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            touch-action: manipulation;
        }

        .item-toggle:hover {
            border-color: var(--borda-forte);
        }

        .item-content {
            display: none;
            width: calc(100% - 16px);
            margin: -4px auto 12px;
            background-color: var(--bg-card);
            padding: 14px;
            border-radius: 0 0 8px 8px;
            border: 1px solid var(--borda);
        }

        .active-content {
            display: block;
        }

        .counter-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--texto-principal);
        }

        .counter-group:last-child {
            margin-bottom: 0;
        }

        .person-label {
            font-weight: bold;
            color: var(--texto-principal);
            width: 115px;
            font-size: 0.92em;
        }

        .counter-controls {
            display: flex;
            align-items: center;
        }

        .btn-plus, .btn-minus {
            background-color: var(--destaque-suave);
            color: #000000;
            border: 1px solid rgba(0,0,0,0.15);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4em;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            line-height: 1;
            touch-action: manipulation;
            user-select: none;
        }

        .btn-minus { margin-right: 8px; }
        .btn-plus { margin-left: 8px; }

        .counter-value {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--texto-principal);
            width: 38px;
            text-align: center;
        }

        /* Grade compacta AP / OA / CA / MO para AI com Abordagem e AI Revelia */
        .ai-sub-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .ai-sub-card {
            background-color: var(--bg-elevado);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 6px 7px;
        }

        .ai-sub-title {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--texto-principal);
            margin-bottom: 4px;
            padding-bottom: 2px;
            border-bottom: 1px solid var(--borda);
            text-align: center;
            letter-spacing: -0.2px;
        }

        .ai-sub-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
            gap: 2px;
        }

        .ai-sub-row:last-child {
            margin-bottom: 0;
        }

        .ai-sub-role {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--texto-suave);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ai-sub-controls {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .ai-sub-controls .btn-minus,
        .ai-sub-controls .btn-plus {
            width: 22px;
            height: 22px;
            font-size: 0.92rem;
            margin: 0;
        }

        .ai-sub-controls .btn-minus { margin-right: 3px; }
        .ai-sub-controls .btn-plus { margin-left: 3px; }

        .ai-sub-controls .counter-value {
            width: 20px;
            font-size: 0.78rem;
        }

        .radar-input-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radar-input-container label {
            font-weight: bold;
            color: var(--texto-principal);
            font-size: 0.88em;
        }

        .radar-input-container input {
            padding: 9px 10px;
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            color: var(--texto-principal);
            border-radius: 6px;
            font-size: 0.95em;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.72);
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background-color: var(--bg-card);
            color: var(--texto-principal);
            padding: 18px;
            border-radius: 10px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
            border: 2px solid var(--borda-forte);
            text-align: center;
        }

        .modal-content h3 {
            margin: 0 0 8px;
            color: var(--texto-principal);
        }

        .modal-content textarea {
            width: 100%;
            min-height: 160px;
            background-color: var(--bg-input);
            color: var(--texto-principal);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.9em;
            margin-bottom: 12px;
            resize: vertical;
        }

        .accum-preview-box {
            background-color: var(--bg-input);
            border: 1px solid var(--borda);
            border-radius: 6px;
            padding: 10px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 240px;
            overflow-y: auto;
            font-size: 0.84em;
            margin-bottom: 12px;
            color: var(--texto-principal);
        }

        .accum-meta {
            font-size: 0.8em;
            color: var(--texto-suave);
            margin-bottom: 10px;
        }

        .modal-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="top-status-bar">
        <button type="button" class="status-chip-btn" id="btnDiscreetTheme" aria-label="Alternar tema" title="Alternar tema">
            <span class="status-dot"></span>
            <span id="statusThemeIcon">🌙</span>
        </button>
    </div>

    <h1>Mandar Atividade</h1>

    <div class="top-action-bar">
        <button class="btn-top btn-whatsapp" id="btnWhatsapp">Enviar</button>
        <button class="btn-top btn-copy" id="btnCopy">Copiar solo</button>
        <button class="btn-top btn-general" id="btnGeneral">Copiar tudo</button>
        <button class="btn-top btn-add-accum" id="btnAddAccum">Enviar para nuvem</button>
        <button class="btn-top btn-view-accum" id="btnViewAccum">Histórico</button>
        <button class="btn-top btn-import" id="btnImport">Importar</button>
        <button class="btn-top btn-clear" id="btnClear">Apagar</button>
    </div>

    <div class="tabs-container" id="tabsContainer"></div>

    <div class="tab-config-section">
        <label for="activityNameInput">Nome da Aba:</label>
        <input type="text" id="activityNameInput" placeholder="Ex: Atividade 1">
    </div>

    <div class="section">
        <div class="section-title">Viatura / Regime e Pessoal</div>
        <div class="input-grid-2">
            <div class="input-group">
                <label for="viatura">Viatura:</label>
                <input type="text" id="viatura" placeholder="Ex: R-04201">
            </div>
            <div class="input-group">
                <label for="regime">Módulo / Regime:</label>
                <select id="regime">
                    <option value="">Selecione...</option>
                    <option value="Módulo I">Módulo I</option>
                    <option value="Módulo II">Módulo II</option>
                    <option value="Dejem">Dejem</option>
                    <option value="CGP">CGP</option>
                    <option value="TOR">TOR</option>
                </select>
            </div>
        </div>
        <div class="input-group">
            <label for="encarregado">Encarregado (Obrigatório):</label>
            <input type="text" id="encarregado" placeholder="Digite o nome">
        </div>
        <div class="input-group">
            <label for="motorista">Motorista (Opcional):</label>
            <input type="text" id="motorista" placeholder="Digite o nome (se houver)">
        </div>
        <div class="input-group" style="margin-bottom: 0;">
            <label for="auxiliar">Auxiliar (Opcional):</label>
            <input type="text" id="auxiliar" placeholder="Digite o nome">
        </div>
    </div>

    <div class="item-list" id="itemList"></div>

    <!-- Modal Importar (Atividade avulsa ou Geral) -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <h3>Importar Atividade</h3>
            <p class="accum-meta">Cole uma atividade avulsa ou um relatório geral (com uma ou várias atividades):</p>
            <textarea id="importText" placeholder="Cole o texto aqui..."></textarea>
            <div class="modal-buttons">
                <button class="btn-top btn-clear" id="btnCancelImport">Cancelar</button>
                <button class="btn-top btn-import" id="btnConfirmImport">Importar</button>
            </div>
        </div>
    </div>

    <!-- Modal Histórico / Acumulado -->
    <div class="modal" id="accumModal">
        <div class="modal-content">
            <h3>Histórico Acumulado</h3>
            <div class="accum-meta" id="accumMetaText">0 registros adicionados</div>
            <div class="accum-preview-box" id="accumPreviewText">Nenhum dado acumulado ainda.</div>
            <div class="modal-buttons">
                <button class="btn-top btn-clear" id="btnClearAccum">Zerar</button>
                <button class="btn-top btn-copy" id="btnCopyAccum">Copiar tudo</button>
                <button class="btn-top btn-whatsapp" id="btnWhatsappAccum">Enviar</button>
                <button class="btn-top btn-clear" id="btnCloseAccum">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const THEME_KEY = 'pmrAtividadeTheme';
        const STATE_KEY = 'pmrMultiAtividadeStateV4';
        const ACCUM_KEY = 'pmrAtividadeAcumuladaV1';
        const REGIME_OPTIONS = ['Módulo I', 'Módulo II', 'Dejem', 'CGP', 'TOR'];
        const SPLIT_AI_ITEMS = ['AI com Abordagem', 'AI Revelia'];
        const MODALIDADES = ['AP', 'OA', 'CA', 'MO'];

        const itemNames = [
            'Total Fiscalizado - AP', 'Total Fiscalizado - OA', 'Total Fiscalizado - CA', 'Total Fiscalizado - MO',
            'Total Autuados - AP', 'Total Autuados - OA', 'Total Autuados - CA', 'Total Autuados - MO',
            'AI Total - AP', 'AI Total - OA', 'AI Total - CA', 'AI Total - MO',
            'AI com Abordagem', 'AI Revelia', 'Art. 167', 'Art. 168', 'Art. 252, VI / § ún.', 'Art. 203,V',
            'Art. 165', 'Art. 165 A', 'Art. 306', 'Teste Ativo', 'Teste Passivo',
            'Pessoas abordadas', 'Pedestres Abordados', 'Pedestres lançados no Google Forms',
            'Total ARV', 'Total ARD', 'Imagens Radar',
            'Sinistros com vítimas', 'Sinistros sem vítimas', 'Vítimas leves', 'Vítimas graves', 'Vítimas fatais',
            'Procurado capturado', 'Flagrante', 'Presos', 'BOPM (exceto art. 306)'
        ];

        // Tema claro padrão
        const btnDiscreetTheme = document.getElementById('btnDiscreetTheme');
        const statusThemeIcon = document.getElementById('statusThemeIcon');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.body.classList.toggle('dark-theme', isDark);
            statusThemeIcon.textContent = isDark ? '☀️' : '🌙';
            localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        }

        applyTheme(localStorage.getItem(THEME_KEY) || 'light');

        btnDiscreetTheme.addEventListener('click', () => {
            const currentlyDark = document.body.classList.contains('dark-theme');
            applyTheme(currentlyDark ? 'light' : 'dark');
        });

        // Entre 00:00 e 05:59, retorna a data do dia anterior
        function getReportDateBR() {
            const now = new Date();
            if (now.getHours() < 6) {
                now.setDate(now.getDate() - 1);
            }
            return now.toLocaleDateString('pt-BR');
        }

        let appState = JSON.parse(localStorage.getItem(STATE_KEY)) || {
            personnel: { viatura: '', regime: '', enc: '', mot: '', aux: '' },
            activeTabId: 'tab_1',
            tabs: [
                {
                    id: 'tab_1',
                    name: 'Atividade 1',
                    items: {},
                    aiSplit: {},
                    radar: { enc: '', mot: '', aux: '' }
                }
            ]
        };

        let accumState = JSON.parse(localStorage.getItem(ACCUM_KEY)) || {
            entriesCount: 0,
            items: {},
            radar: { enc: 0, mot: 0, aux: 0 }
        };

        function createEmptyItems() {
            const obj = {};
            itemNames.forEach(name => {
                if (name !== 'Imagens Radar') {
                    obj[name] = { enc: 0, mot: 0, aux: 0 };
                }
            });
            return obj;
        }

        function createEmptyAiSplit() {
            const split = {};
            SPLIT_AI_ITEMS.forEach(itemName => {
                split[itemName] = {};
                MODALIDADES.forEach(mod => {
                    split[itemName][mod] = { enc: 0, mot: 0, aux: 0 };
                });
            });
            return split;
        }

        function recalcSplitAiToItem(tab, itemName) {
            if (!tab.aiSplit || !tab.aiSplit[itemName]) return;
            const sum = { enc: 0, mot: 0, aux: 0 };
            MODALIDADES.forEach(mod => {
                const entry = tab.aiSplit[itemName][mod] || { enc: 0, mot: 0, aux: 0 };
                sum.enc += (entry.enc || 0);
                sum.mot += (entry.mot || 0);
                sum.aux += (entry.aux || 0);
            });
            tab.items[itemName] = sum;
        }

        function initTabItems(tab) {
            if (!tab.items) tab.items = {};
            if (!tab.aiSplit) tab.aiSplit = createEmptyAiSplit();
            if (!tab.radar) tab.radar = { enc: '', mot: '', aux: '' };

            itemNames.forEach(name => {
                if (name === 'Imagens Radar') {
                    if (tab.radar.enc === undefined) tab.radar = { enc: '', mot: '', aux: '' };
                } else if (!tab.items[name]) {
                    tab.items[name] = { enc: 0, mot: 0, aux: 0 };
                }
            });

            SPLIT_AI_ITEMS.forEach(itemName => {
                if (!tab.aiSplit[itemName]) tab.aiSplit[itemName] = {};
                let hasAnyMod = false;
                MODALIDADES.forEach(mod => {
                    if (!tab.aiSplit[itemName][mod]) {
                        tab.aiSplit[itemName][mod] = { enc: 0, mot: 0, aux: 0 };
                    } else {
                        const m = tab.aiSplit[itemName][mod];
                        m.enc = m.enc || 0;
                        m.mot = m.mot || 0;
                        m.aux = m.aux || 0;
                        if (m.enc || m.mot || m.aux) hasAnyMod = true;
                    }
                });
                const itemVal = tab.items[itemName] || { enc: 0, mot: 0, aux: 0 };
                if (!hasAnyMod && (itemVal.enc || itemVal.mot || itemVal.aux)) {
                    tab.aiSplit[itemName].AP = {
                        enc: itemVal.enc || 0,
                        mot: itemVal.mot || 0,
                        aux: itemVal.aux || 0
                    };
                } else {
                    recalcSplitAiToItem(tab, itemName);
                }
            });
        }

        function initAccum() {
            const base = createEmptyItems();
            itemNames.forEach(name => {
                if (name !== 'Imagens Radar') {
                    accumState.items[name] = {
                        enc: (accumState.items && accumState.items[name] && accumState.items[name].enc) || 0,
                        mot: (accumState.items && accumState.items[name] && accumState.items[name].mot) || 0,
                        aux: (accumState.items && accumState.items[name] && accumState.items[name].aux) || 0
                    };
                }
            });
            if (!accumState.radar) accumState.radar = { enc: 0, mot: 0, aux: 0 };
            return base;
        }

        appState.tabs.forEach(initTabItems);
        initAccum();

        function saveLocalStorage() {
            localStorage.setItem(STATE_KEY, JSON.stringify(appState));
        }

        function saveAccumStorage() {
            localStorage.setItem(ACCUM_KEY, JSON.stringify(accumState));
        }

        function getActiveTab() {
            let tab = appState.tabs.find(t => t.id === appState.activeTabId);
            if (!tab) {
                appState.activeTabId = appState.tabs[0].id;
                tab = appState.tabs[0];
            }
            return tab;
        }

        function getPersonnelLabel(type) {
            if (type === 'enc') return 'Encarregado';
            if (type === 'mot') return 'Motorista';
            if (type === 'aux') return 'Auxiliar';
        }

        function getShortPersonnelLabel(type) {
            if (type === 'enc') return 'Enc.';
            if (type === 'mot') return 'Mot.';
            if (type === 'aux') return 'Aux.';
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';

            appState.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === appState.activeTabId ? 'active' : ''}`;

                const spanName = document.createElement('span');
                spanName.textContent = tab.name;
                spanName.onclick = () => switchTab(tab.id);
                tabEl.appendChild(spanName);

                if (appState.tabs.length > 1) {
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'tab-close';
                    closeBtn.textContent = '×';
                    closeBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteTab(tab.id);
                    };
                    tabEl.appendChild(closeBtn);
                }

                container.appendChild(tabEl);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'btn-add-tab';
            addBtn.textContent = '+';
            addBtn.onclick = addNewTab;
            container.appendChild(addBtn);
        }

        function switchTab(tabId) {
            appState.activeTabId = tabId;
            saveLocalStorage();
            loadActiveTabData();
            renderTabs();
        }

        function addNewTab() {
            const newId = 'tab_' + Date.now();
            const newName = `Atividade ${appState.tabs.length + 1}`;
            const newTab = {
                id: newId,
                name: newName,
                items: {},
                aiSplit: createEmptyAiSplit(),
                radar: { enc: '', mot: '', aux: '' }
            };
            initTabItems(newTab);
            appState.tabs.push(newTab);
            appState.activeTabId = newId;
            saveLocalStorage();
            loadActiveTabData();
            renderTabs();
        }

        function deleteTab(tabId) {
            if (appState.tabs.length <= 1) return;
            if (confirm('Deseja excluir esta atividade?')) {
                appState.tabs = appState.tabs.filter(t => t.id !== tabId);
                appState.activeTabId = appState.tabs[0].id;
                saveLocalStorage();
                loadActiveTabData();
                renderTabs();
            }
        }

        function loadActiveTabData() {
            const tab = getActiveTab();
            document.getElementById('activityNameInput').value = tab.name;
            document.getElementById('viatura').value = appState.personnel.viatura || '';
            document.getElementById('regime').value = appState.personnel.regime || '';
            document.getElementById('encarregado').value = appState.personnel.enc || '';
            document.getElementById('motorista').value = appState.personnel.mot || '';
            document.getElementById('auxiliar').value = appState.personnel.aux || '';
            renderItemList();
        }

        document.getElementById('activityNameInput').addEventListener('input', e => {
            getActiveTab().name = e.target.value;
            saveLocalStorage();
            renderTabs();
        });

        document.getElementById('viatura').addEventListener('input', e => { appState.personnel.viatura = e.target.value; saveLocalStorage(); });
        document.getElementById('regime').addEventListener('change', e => { appState.personnel.regime = e.target.value; saveLocalStorage(); });
        document.getElementById('encarregado').addEventListener('input', e => { appState.personnel.enc = e.target.value; saveLocalStorage(); });
        document.getElementById('motorista').addEventListener('input', e => { appState.personnel.mot = e.target.value; saveLocalStorage(); });
        document.getElementById('auxiliar').addEventListener('input', e => { appState.personnel.aux = e.target.value; saveLocalStorage(); });

        const itemListElement = document.getElementById('itemList');

        function renderItemList() {
            itemListElement.innerHTML = '';
            const tab = getActiveTab();

            itemNames.forEach(name => {
                const itemContainer = document.createElement('div');

                const toggleBtn = document.createElement('button');
                toggleBtn.type = 'button';
                toggleBtn.className = 'item-toggle';
                toggleBtn.textContent = name;
                itemContainer.appendChild(toggleBtn);

                const contentDiv = document.createElement('div');
                contentDiv.className = 'item-content';

                if (SPLIT_AI_ITEMS.includes(name)) {
                    const grid = document.createElement('div');
                    grid.className = 'ai-sub-grid';

                    MODALIDADES.forEach(mod => {
                        const card = document.createElement('div');
                        card.className = 'ai-sub-card';

                        const title = document.createElement('div');
                        title.className = 'ai-sub-title';
                        title.textContent = `${name.toUpperCase()} ${mod}`;
                        card.appendChild(title);

                        ['enc', 'mot', 'aux'].forEach(personType => {
                            const row = document.createElement('div');
                            row.className = 'ai-sub-row';

                            const roleSpan = document.createElement('span');
                            roleSpan.className = 'ai-sub-role';
                            roleSpan.textContent = getShortPersonnelLabel(personType);
                            row.appendChild(roleSpan);

                            const controls = document.createElement('div');
                            controls.className = 'ai-sub-controls';

                            const minusBtn = document.createElement('button');
                            minusBtn.type = 'button';
                            minusBtn.className = 'btn-minus';
                            minusBtn.textContent = '−';
                            minusBtn.onclick = () => updateAiSplitQuantity(name, mod, personType, -1);
                            controls.appendChild(minusBtn);

                            const valSpan = document.createElement('span');
                            valSpan.className = 'counter-value';
                            valSpan.id = `q_${name}_${mod}_${personType}`;
                            valSpan.textContent = (tab.aiSplit[name] && tab.aiSplit[name][mod] && tab.aiSplit[name][mod][personType]) || 0;
                            controls.appendChild(valSpan);

                            const plusBtn = document.createElement('button');
                            plusBtn.type = 'button';
                            plusBtn.className = 'btn-plus';
                            plusBtn.textContent = '+';
                            plusBtn.onclick = () => updateAiSplitQuantity(name, mod, personType, 1);
                            controls.appendChild(plusBtn);

                            row.appendChild(controls);
                            card.appendChild(row);
                        });

                        grid.appendChild(card);
                    });

                    contentDiv.appendChild(grid);
                } else if (name === 'Imagens Radar') {
                    contentDiv.classList.add('radar-input-container');
                    ['enc', 'mot', 'aux'].forEach(personType => {
                        const group = document.createElement('div');
                        group.className = 'input-group';
                        const labelText = getPersonnelLabel(personType);
                        group.innerHTML = `<label for="radar_${personType}">Radar ${labelText}:</label> <input type="number" id="radar_${personType}" min="0" max="999" placeholder="0 até 999">`;
                        const input = group.querySelector('input');
                        input.value = tab.radar[personType] ?? '';
                        input.addEventListener('input', e => {
                            let val = parseInt(e.target.value, 10);
                            if (isNaN(val)) val = '';
                            else if (val > 999) val = 999;
                            else if (val < 0) val = 0;
                            tab.radar[personType] = val;
                            saveLocalStorage();
                        });
                        contentDiv.appendChild(group);
                    });
                } else {
                    ['enc', 'mot', 'aux'].forEach(personType => {
                        const counterGroup = document.createElement('div');
                        counterGroup.className = 'counter-group';

                        const label = document.createElement('span');
                        label.className = 'person-label';
                        label.textContent = getPersonnelLabel(personType);
                        counterGroup.appendChild(label);

                        const controls = document.createElement('div');
                        controls.className = 'counter-controls';

                        const minusBtn = document.createElement('button');
                        minusBtn.type = 'button';
                        minusBtn.className = 'btn-minus';
                        minusBtn.textContent = '−';
                        minusBtn.onclick = () => updateQuantity(name, personType, -1);
                        controls.appendChild(minusBtn);

                        const valSpan = document.createElement('span');
                        valSpan.className = 'counter-value';
                        valSpan.id = `q_${name}_${personType}`;
                        valSpan.textContent = tab.items[name] ? tab.items[name][personType] : 0;
                        controls.appendChild(valSpan);

                        const plusBtn = document.createElement('button');
                        plusBtn.type = 'button';
                        plusBtn.className = 'btn-plus';
                        plusBtn.textContent = '+';
                        plusBtn.onclick = () => updateQuantity(name, personType, 1);
                        controls.appendChild(plusBtn);

                        counterGroup.appendChild(controls);
                        contentDiv.appendChild(counterGroup);
                    });
                }

                itemContainer.appendChild(contentDiv);
                itemListElement.appendChild(itemContainer);

                toggleBtn.onclick = function() {
                    document.querySelectorAll('.item-content').forEach(el => {
                        if (el !== contentDiv) el.classList.remove('active-content');
                    });
                    contentDiv.classList.toggle('active-content');
                };
            });
        }

        function updateQuantity(itemName, personType, change) {
            const tab = getActiveTab();
            if (!tab.items[itemName]) tab.items[itemName] = { enc: 0, mot: 0, aux: 0 };
            const newVal = Math.max(0, (tab.items[itemName][personType] || 0) + change);
            tab.items[itemName][personType] = newVal;
            document.getElementById(`q_${itemName}_${personType}`).textContent = newVal;
            saveLocalStorage();
        }

        function updateAiSplitQuantity(itemName, mod, personType, change) {
            const tab = getActiveTab();
            if (!tab.aiSplit[itemName]) tab.aiSplit[itemName] = {};
            if (!tab.aiSplit[itemName][mod]) tab.aiSplit[itemName][mod] = { enc: 0, mot: 0, aux: 0 };
            const newVal = Math.max(0, (tab.aiSplit[itemName][mod][personType] || 0) + change);
            tab.aiSplit[itemName][mod][personType] = newVal;
            recalcSplitAiToItem(tab, itemName);
            document.getElementById(`q_${itemName}_${mod}_${personType}`).textContent = newVal;
            saveLocalStorage();
        }

        function buildHeaderBlock(dataDateBR, personnelObj, headerTitle = null) {
            let lines = [];
            if (headerTitle) lines.push(`*${headerTitle}*`);
            if (personnelObj.viatura) lines.push(`*Viatura:* ${personnelObj.viatura}`);
            if (personnelObj.regime) lines.push(`*${personnelObj.regime}*`);
            lines.push(`*Data:* ${dataDateBR}`);
            lines.push(`*Encarregado:* ${personnelObj.enc}`);
            if (personnelObj.mot) lines.push(`*Motorista:* ${personnelObj.mot}`);
            if (personnelObj.aux) lines.push(`*Auxiliar:* ${personnelObj.aux}`);
            return lines.join('\n') + '\n---\n';
        }

        function buildItemsSection(itemsMap, radarMap) {
            let sectionText = '';
            let hasContent = false;

            itemNames.forEach(name => {
                if (name.startsWith('Total Autuados')) return;

                let itemTotal = 0;
                let personOutputs = [];

                if (name === 'Imagens Radar') {
                    ['enc', 'mot', 'aux'].forEach(p => {
                        const raw = radarMap ? radarMap[p] : '';
                        const num = parseInt(raw, 10);
                        if (!isNaN(num) && num > 0) {
                            itemTotal += num;
                            personOutputs.push(`  - ${getPersonnelLabel(p)}: ${num}`);
                        } else if (raw !== '' && raw !== undefined && raw !== null && String(raw).trim() !== '') {
                            itemTotal++;
                            personOutputs.push(`  - ${getPersonnelLabel(p)}: ${raw}`);
                        }
                    });
                } else {
                    ['enc', 'mot', 'aux'].forEach(p => {
                        const val = itemsMap[name] ? (itemsMap[name][p] || 0) : 0;
                        if (val > 0) {
                            itemTotal += val;
                            personOutputs.push(`  - ${getPersonnelLabel(p)}: ${val}`);
                        }
                    });
                }

                if (itemTotal > 0) {
                    sectionText += `\n*${name}:*\n${personOutputs.join('\n')}\n`;
                    hasContent = true;
                }
            });

            return { text: sectionText.trim(), hasContent };
        }

        function generateTabText(tab) {
            if (!appState.personnel.enc) return null;
            const dateBR = getReportDateBR();
            const body = buildItemsSection(tab.items, tab.radar);
            if (!body.hasContent) return null;
            return buildHeaderBlock(dateBR, appState.personnel, tab.name) + '\n' + body.text;
        }

        function generateGeneralText() {
            if (!appState.personnel.enc) return null;

            const consolidatedItems = createEmptyItems();
            const consolidatedRadar = { enc: 0, mot: 0, aux: 0 };

            appState.tabs.forEach(tab => {
                itemNames.forEach(name => {
                    if (name !== 'Imagens Radar' && !name.startsWith('Total Autuados') && tab.items[name]) {
                        ['enc', 'mot', 'aux'].forEach(p => {
                            consolidatedItems[name][p] += (tab.items[name][p] || 0);
                        });
                    }
                });

                if (tab.radar) {
                    ['enc', 'mot', 'aux'].forEach(p => {
                        const val = parseInt(tab.radar[p], 10);
                        if (!isNaN(val) && val > 0) consolidatedRadar[p] += val;
                    });
                }
            });

            const body = buildItemsSection(consolidatedItems, consolidatedRadar);
            if (!body.hasContent) return null;

            return buildHeaderBlock(getReportDateBR(), appState.personnel, null) + '\n' + body.text;
        }

        function generateAccumText() {
            if (accumState.entriesCount === 0) return null;
            const body = buildItemsSection(accumState.items, accumState.radar);
            if (!body.hasContent) return null;
            return body.text;
        }

        document.getElementById('btnAddAccum').addEventListener('click', () => {
            const tab = getActiveTab();
            const body = buildItemsSection(tab.items, tab.radar);
            if (!body.hasContent) {
                alert('Preencha algum valor na aba atual para enviar ao histórico.');
                return;
            }

            itemNames.forEach(name => {
                if (name !== 'Imagens Radar' && !name.startsWith('Total Autuados') && tab.items[name]) {
                    ['enc', 'mot', 'aux'].forEach(p => {
                        accumState.items[name][p] += (tab.items[name][p] || 0);
                    });
                }
            });

            ['enc', 'mot', 'aux'].forEach(p => {
                const val = parseInt(tab.radar && tab.radar[p], 10);
                if (!isNaN(val) && val > 0) {
                    accumState.radar[p] = (accumState.radar[p] || 0) + val;
                }
            });

            accumState.entriesCount += 1;

            saveAccumStorage();
            alert(`"${tab.name}" enviada ao histórico! Total: ${accumState.entriesCount}`);
        });

        const accumModal = document.getElementById('accumModal');
        document.getElementById('btnViewAccum').addEventListener('click', () => {
            const text = generateAccumText();
            document.getElementById('accumMetaText').textContent = `Lançamentos somados: ${accumState.entriesCount}`;
            document.getElementById('accumPreviewText').textContent = text || 'Nenhum dado acumulado ainda.';
            accumModal.style.display = 'flex';
        });

        document.getElementById('btnCloseAccum').addEventListener('click', () => {
            accumModal.style.display = 'none';
        });

        document.getElementById('btnCopyAccum').addEventListener('click', () => {
            const text = generateAccumText();
            if (!text) return alert('Nenhum dado acumulado.');
            copyToClipboard(text, 'Histórico copiado!');
        });

        document.getElementById('btnWhatsappAccum').addEventListener('click', () => {
            const text = generateAccumText();
            if (!text) return alert('Nenhum dado acumulado.');
            window.location.href = `whatsapp://send?text=${encodeURIComponent(text)}`;
        });

        document.getElementById('btnClearAccum').addEventListener('click', () => {
            if (!confirm('Zerar todo o histórico acumulado?')) return;
            accumState = {
                entriesCount: 0,
                items: createEmptyItems(),
                radar: { enc: 0, mot: 0, aux: 0 }
            };
            saveAccumStorage();
            document.getElementById('accumMetaText').textContent = 'Lançamentos somados: 0';
            document.getElementById('accumPreviewText').textContent = 'Nenhum dado acumulado ainda.';
        });

        document.getElementById('btnWhatsapp').addEventListener('click', () => {
            if (!appState.personnel.enc) {
                alert('Preencha pelo menos o Encarregado obrigatório.');
                return;
            }
            const text = generateTabText(getActiveTab());
            if (!text) {
                alert('Preencha algum valor na aba atual para enviar.');
                return;
            }
            window.location.href = `whatsapp://send?text=${encodeURIComponent(text)}`;
        });

        document.getElementById('btnCopy').addEventListener('click', () => {
            if (!appState.personnel.enc) {
                alert('Preencha pelo menos o Encarregado obrigatório.');
                return;
            }
            const text = generateTabText(getActiveTab());
            if (!text) {
                alert('Preencha algum valor na aba atual para copiar.');
                return;
            }
            copyToClipboard(text, 'Atividade copiada!');
        });

        document.getElementById('btnGeneral').addEventListener('click', () => {
            if (!appState.personnel.enc) {
                alert('Preencha pelo menos o Encarregado obrigatório.');
                return;
            }
            const text = generateGeneralText();
            if (!text) {
                alert('Nenhum dado preenchido nas atividades.');
                return;
            }
            copyToClipboard(text, 'Tudo copiado!');
        });

        const importModal = document.getElementById('importModal');
        const importText = document.getElementById('importText');

        document.getElementById('btnImport').addEventListener('click', () => {
            importText.value = '';
            importModal.style.display = 'flex';
        });

        document.getElementById('btnCancelImport').addEventListener('click', () => {
            importModal.style.display = 'none';
        });

        document.getElementById('btnConfirmImport').addEventListener('click', () => {
            const rawText = importText.value;
            if (!rawText.trim()) {
                alert('Cole um texto válido.');
                return;
            }
            parseAndLoadText(rawText);
            importModal.style.display = 'none';
        });

        function parsePersonnelFromText(text) {
            const vtrMatch = text.match(/\*Viatura:\*\s*(.+)/i);
            if (vtrMatch) appState.personnel.viatura = vtrMatch[1].trim();

            for (const opt of REGIME_OPTIONS) {
                const escaped = opt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                if (new RegExp(`\\*${escaped}\\*`, 'i').test(text)) {
                    appState.personnel.regime = opt;
                    break;
                }
            }

            const encMatch = text.match(/\*Encarregado:\*\s*(.+)/i);
            if (encMatch) appState.personnel.enc = encMatch[1].trim();

            const motMatch = text.match(/\*Motorista:\*\s*(.+)/i);
            if (motMatch) appState.personnel.mot = motMatch[1].trim();

            const auxMatch = text.match(/\*Auxiliar:\*\s*(.+)/i);
            if (auxMatch) appState.personnel.aux = auxMatch[1].trim();
        }

        function parseSingleBlockIntoTab(blockText, targetTab) {
            targetTab.radar = { enc: '', mot: '', aux: '' };
            targetTab.aiSplit = createEmptyAiSplit();
            initTabItems(targetTab);

            const titleMatch = blockText.match(/^\*(Atividade[^*\n:]+)\*/im);
            if (titleMatch) {
                targetTab.name = titleMatch[1].trim();
            }

            const ignoredHeaders = ['Encarregado', 'Motorista', 'Auxiliar', 'Viatura', 'Data', ...REGIME_OPTIONS];
            let currentItem = null;
            blockText.split('\n').forEach(line => {
                const itemHeader = line.match(/^\*(.+?):\*$/);
                if (itemHeader && !ignoredHeaders.includes(itemHeader[1].trim())) {
                    currentItem = itemHeader[1].trim();
                    return;
                }
                const pMatch = line.match(/^\s*-\s*(Encarregado|Motorista|Auxiliar):\s*(\d+)/i);
                if (currentItem && pMatch) {
                    const pName = pMatch[1].toLowerCase();
                    const pKey = pName.includes('enc') ? 'enc' : pName.includes('mot') ? 'mot' : 'aux';
                    const val = parseInt(pMatch[2], 10);

                    if (currentItem === 'Imagens Radar') {
                        targetTab.radar[pKey] = val;
                    } else if (targetTab.items[currentItem]) {
                        targetTab.items[currentItem][pKey] = val;
                        if (SPLIT_AI_ITEMS.includes(currentItem)) {
                            targetTab.aiSplit[currentItem].AP[pKey] = val;
                        }
                    }
                }
            });
        }

        function parseAndLoadText(text) {
            parsePersonnelFromText(text);

            const activityBlocks = text.split(/(?=^\*Atividade\b)/im).filter(b => /^\*Atividade\b/im.test(b.trim()));

            if (activityBlocks.length > 1) {
                appState.tabs = activityBlocks.map((block, idx) => {
                    const t = {
                        id: 'tab_' + (Date.now() + idx),
                        name: `Atividade ${idx + 1}`,
                        items: {},
                        aiSplit: createEmptyAiSplit(),
                        radar: { enc: '', mot: '', aux: '' }
                    };
                    parseSingleBlockIntoTab(block, t);
                    return t;
                });
                appState.activeTabId = appState.tabs[0].id;
            } else {
                const tab = getActiveTab();
                parseSingleBlockIntoTab(text, tab);
            }

            saveLocalStorage();
            renderTabs();
            loadActiveTabData();
            alert('Importação concluída!');
        }

        function copyToClipboard(text, successMsg = 'Texto copiado com sucesso!') {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => alert(successMsg)).catch(() => fallbackCopy(text, successMsg));
            } else {
                fallbackCopy(text, successMsg);
            }
        }

        function fallbackCopy(text, successMsg) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert(successMsg);
            } catch (err) {
                alert('Não foi possível copiar automaticamente.');
            }
            document.body.removeChild(textArea);
        }

        document.getElementById('btnClear').addEventListener('click', () => {
            if (confirm('Tem certeza de que deseja apagar todos os dados de TODAS as abas?')) {
                localStorage.removeItem(STATE_KEY);
                location.reload();
            }
        });

        renderTabs();
        loadActiveTabData();
    </script>
</body>
</html>
