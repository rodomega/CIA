<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Controle de Revelia</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

body{
    background:
        repeating-linear-gradient(
            -45deg,
            #101010 0px,
            #101010 18px,
            #171717 18px,
            #171717 36px
        );
}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#111;
    border-bottom:3px solid #f5c400;
    padding:14px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
    color:#f5c400;
}

header p{
    margin:4px 0 0;
    font-size:11px;
    color:#bbb;
    text-transform:uppercase;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:20px 14px 40px;
}

/* FORMULÁRIO DE CADASTRO */

.form-box{
    background:#171717;
    border:1px solid #3b3b3b;
    border-radius:14px;
    padding:18px;
    margin-bottom:25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.form-title{
    font-size:14px;
    color:#f5c400;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.detected-type-badge{
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    text-transform:uppercase;
    font-weight:bold;
    background:#2b2b2b;
    color:#aaa;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:5px;
    font-weight:bold;
}

.field input, .field select{
    width:100%;
    background:#0d0d0d;
    border:1px solid #444;
    border-radius:9px;
    color:#fff;
    padding:12px;
    font-size:15px;
    outline:none;
    transition: border-color 0.2s;
}

.field input:focus, .field select:focus{
    border-color:#f5c400;
}

.row{
    display:flex;
    gap:10px;
}

.row .field{
    flex:1;
}

.save-button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#f5c400;
    color:#111;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
    transition: transform 0.1s, background-color 0.2s;
}

.save-button:active{
    transform:scale(0.98);
    background:#e0b300;
}

/* LEGENDA DE CORES */

.legend-toggle{
    background:none;
    border:none;
    color:#f5c400;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    padding:0;
    margin-bottom:12px;
    text-decoration:underline;
    display:inline-block;
}

.legend-box{
    display:none;
    background:#141414;
    border:1px solid #333;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
    font-size:12px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
}

.legend-item:last-child{
    margin-bottom:0;
}

.legend-color{
    width:14px;
    height:14px;
    border-radius:3px;
    flex-shrink:0;
}

/* LISTA DE REGISTROS */

.list-section{
    margin-top:10px;
}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.list-title{
    color:#f5c400;
    font-size:16px;
    font-weight:900;
}

.counter{
    color:#999;
    font-size:12px;
}

.clear-button{
    width:100%;
    margin-bottom:15px;
    padding:11px;
    background:#242424;
    color:#ff6666;
    border:1px solid #444;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* CARDS DE REGISTRO COM BORDAS COLORIDAS */

.record{
    background:#171717;
    border:1px solid #353535;
    border-left:6px solid #f5c400;
    border-radius:11px;
    padding:14px;
    margin-bottom:12px;
    position:relative;
}

.record.type-moto { border-left-color: #ffd700; }
.record.type-carro { border-left-color: #2196f3; }
.record.type-caminhao { border-left-color: #ff9800; }
.record.type-onibus { border-left-color: #9c27b0; }

.record.completed{
    opacity:.5;
    text-decoration:line-through;
}

.record-top{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.record-check{
    width:22px;
    height:22px;
    flex:none;
    accent-color:#f5c400;
    margin-top:2px;
    cursor:pointer;
}

.record-info{
    flex:1;
    min-width:0;
}

.record-header-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
}

.record-main{
    font-weight:900;
    font-size:16px;
    color:#fff;
}

.record-badge {
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
}

.badge-moto { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
.badge-carro { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
.badge-caminhao { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
.badge-onibus { background: rgba(156, 39, 176, 0.2); color: #9c27b0; }

.record-details{
    margin-top:6px;
    color:#ccc;
    font-size:13px;
    line-height:1.5;
}

.record-time{
    color:#888;
    font-size:11px;
    margin-top:8px;
}

.delete-button{
    border:0;
    background:#292929;
    color:#ff6b6b;
    border-radius:7px;
    padding:6px 10px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    margin-top: 8px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#666;
    font-size:14px;
}

@media(max-width:420px){
    .row {
        flex-direction: column;
        gap:0;
    }
}
</style>
</head>

<body>

<header>
    <h1>CONTROLE DE REVELIA</h1>
    <p>Policiamento Rodoviário</p>
</header>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="form-box">
        <div class="form-title">
            <span>NOVO REGISTRO DE REVELIA</span>
            <span class="detected-type-badge" id="typeBadge">Carro</span>
        </div>

        <div class="row">
            <div class="field">
                <label>Placa</label>
                <input 
                    type="text" 
                    id="inputPlate" 
                    placeholder="ABC1D23" 
                    maxlength="7" 
                    style="text-transform:uppercase;" 
                >
            </div>
            <div class="field">
                <label>Cor</label>
                <input type="text" id="inputColor" placeholder="Ex: Preta">
            </div>
        </div>

        <div class="field">
            <label>Marca / Modelo</label>
            <input 
                type="text" 
                id="inputVehicle" 
                placeholder="Ex: Honda/Elite, VW Parati, Scania" 
                oninput="handleVehicleInput(this.value)"
            >
        </div>

        <div class="row">
            <div class="field">
                <label>SP (Rodovia)</label>
                <input type="text" id="inputSP" placeholder="Ex: SP 330">
            </div>
            <div class="field">
                <label>KM</label>
                <input type="text" id="inputKM" placeholder="Ex: 142">
            </div>
            <div class="field">
                <label>Sentido</label>
                <select id="inputSense">
                    <option value="Norte">Norte (N)</option>
                    <option value="Sul">Sul (S)</option>
                    <option value="Leste">Leste (L)</option>
                    <option value="Oeste">Oeste (O)</option>
                    <option value="Interior">Interior</option>
                    <option value="Capital">Capital</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>Artigo (Infração)</label>
            <input type="text" id="inputArticle" placeholder="Ex: Art. 230 V">
        </div>

        <button class="save-button" onclick="saveRecord()">ADICIONAR REVELIA</button>
    </div>

    <!-- LEGENDA -->
    <button class="legend-toggle" onclick="toggleLegend()"> Ver Legenda de Cores por Veículo</button>
    
    <div class="legend-box" id="legendBox">
        <div class="legend-item">
            <div class="legend-color" style="background:#ffd700;"></div>
            <span><strong>Amarelo:</strong> Motocicleta / Moto / Ciclomotor</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#2196f3;"></div>
            <span><strong>Azul:</strong> Carro / Automóvel / Camioneta</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff9800;"></div>
            <span><strong>Laranja:</strong> Caminhão / Carreta / Veículo Pesado</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#9c27b0;"></div>
            <span><strong>Roxo:</strong> Ônibus / Micro-ônibus</span>
        </div>
    </div>

    <!-- LISTA DE REGISTROS -->
    <div class="list-section">
        <div class="list-header">
            <div class="list-title">REVELIAS REGISTRADAS</div>
            <div class="counter" id="counter">0 registros</div>
        </div>

        <button class="clear-button" onclick="clearAllRecords()">APAGAR TODOS OS REGISTROS</button>

        <div id="records"></div>
    </div>

</div>

<script>
const STORAGE_KEY = "revelia_ocorrencias_v2";
let records = [];

// Carrega registros salvos
try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) records = JSON.parse(saved);
} catch (e) {
    records = [];
}

let currentDetectedType = "carro";

/* =========================================================
   DETECÇÃO INSTANTÂNEA DE MOTOS, CARROS, CAMINHÕES E ÔNIBUS
========================================================= */

function detectTypeFromText(text) {
    if (!text) return "carro";

    // Normaliza o texto (remove acentos e converte para minúsculo)
    const str = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    // 1. Motos e Ciclomotores
    const motoTerms = [
        "moto", "honda/elite", "elite", "biz", "cg", "titan", "fan", "fazer", "twister", "pcx", 
        "xj6", "hornet", "pop", "bros", "crosser", "ybr", "factor", "scooter", "ciclomotor", 
        "yamaha", "suzuki", "kawasaki", "ducati", "triumph", "royal enfield", "nmax", "xre", 
        "cb 300", "cb 500", "z900", "mt-03", "mt-07", "lead", "sh 150", "burgman", "haojue"
    ];

    // 2. Caminhões e Veículos Pesados
    const caminhaoTerms = [
        "caminhao", "scania", "volvo", "iveco", "daf", "mercedes axor", "actros", "atego", 
        "carreta", "cavalo", "caçamba", "cacamba", "baú", "bau", "constellation", "vw 24", 
        "cargo", "f4000", "3/4", "mule", "volksbus", "bitren", "rodotren"
    ];

    // 3. Ônibus e Micro-ônibus
    const onibusTerms = [
        "onibus", "micro-onibus", "microonibus", "marcopolo", "comil", "busscar", "caio", 
        "volare", "paradiso", "ideale"
    ];

    // Checa Moto
    for (let term of motoTerms) {
        if (str.includes(term)) return "moto";
    }

    // Checa Caminhão
    for (let term of caminhaoTerms) {
        if (str.includes(term)) return "caminhao";
    }

    // Checa Ônibus
    for (let term of onibusTerms) {
        if (str.includes(term)) return "onibus";
    }

    // Padrão: Carro
    return "carro";
}

function handleVehicleInput(value) {
    currentDetectedType = detectTypeFromText(value);
    updateBadgeType(currentDetectedType);
}

function updateBadgeType(type) {
    currentDetectedType = type;
    const badge = document.getElementById("typeBadge");

    const labels = {
        "moto": "🛵 Moto",
        "carro": "🚗 Carro",
        "caminhao": "🚛 Caminhão",
        "onibus": "🚌 Ônibus"
    };

    badge.textContent = labels[type] || "🚗 Carro";
}

function toggleLegend() {
    const box = document.getElementById("legendBox");
    box.style.display = (box.style.display === "block") ? "none" : "block";
}

function saveRecord() {
    const vehicleInput = document.getElementById("inputVehicle").value.trim();
    const plateInput = document.getElementById("inputPlate").value.toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
    const colorInput = document.getElementById("inputColor").value.trim();
    const spInput = document.getElementById("inputSP").value.trim();
    const kmInput = document.getElementById("inputKM").value.trim();
    const senseInput = document.getElementById("inputSense").value;
    const articleInput = document.getElementById("inputArticle").value.trim();

    if (!vehicleInput && !plateInput) {
        alert("Por favor, preencha ao menos o Veículo ou a Placa.");
        return;
    }

    // Detecta o tipo exato no momento de salvar
    const detectedType = detectTypeFromText(vehicleInput);

    let locationStr = "";
    if (spInput) locationStr += spInput + " ";
    if (kmInput) locationStr += "KM " + kmInput + " ";
    if (senseInput) locationStr += "Sentido " + senseInput;

    const newRecord = {
        id: Date.now(),
        vehicle: vehicleInput || "Não informado",
        plate: plateInput || "S/ PLACA",
        color: colorInput || "N/I",
        location: locationStr.trim() || "Local não informado",
        article: articleInput || "N/I",
        type: detectedType,
        completed: false,
        time: new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })
    };

    records.unshift(newRecord);
    saveAndRender();

    // Limpa o formulário
    document.getElementById("inputVehicle").value = "";
    document.getElementById("inputPlate").value = "";
    document.getElementById("inputColor").value = "";
    document.getElementById("inputSP").value = "";
    document.getElementById("inputKM").value = "";
    document.getElementById("inputArticle").value = "";
    updateBadgeType("carro");
}

function toggleComplete(id) {
    records = records.map(r => r.id === id ? { ...r, completed: !r.completed } : r);
    saveAndRender();
}

function deleteRecord(id) {
    if (confirm("Deseja remover este registro?")) {
        records = records.filter(r => r.id !== id);
        saveAndRender();
    }
}

function clearAllRecords() {
    if (records.length === 0) return;
    if (confirm("ATENÇÃO: Tem certeza que deseja apagar TODOS os registros?")) {
        records = [];
        saveAndRender();
    }
}

function saveAndRender() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch(e){}
    render();
}

function render() {
    const container = document.getElementById("records");
    const counter = document.getElementById("counter");

    if (!container || !counter) return;

    counter.textContent = `${records.length} registro(s)`;

    if (records.length === 0) {
        container.innerHTML = `<div class="empty">Nenhuma revelia registrada no momento.</div>`;
        return;
    }

    const badgeClasses = { "moto": "badge-moto", "carro": "badge-carro", "caminhao": "badge-caminhao", "onibus": "badge-onibus" };
    const typeNames = { "moto": "Moto", "carro": "Carro", "caminhao": "Caminhão", "onibus": "Ônibus" };

    container.innerHTML = records.map(r => `
        <div class="record type-${r.type} ${r.completed ? 'completed' : ''}">
            <div class="record-top">
                <input type="checkbox" class="record-check" ${r.completed ? 'checked' : ''} onclick="toggleComplete(${r.id})">
                <div class="record-info">
                    <div class="record-header-line">
                        <div class="record-main">${r.vehicle} (${r.color})</div>
                        <span class="record-badge ${badgeClasses[r.type]}">${typeNames[r.type]}</span>
                    </div>
                    <div class="record-details">
                        <strong>PLACA:</strong> ${r.plate}<br>
                        <strong>LOCAL:</strong> ${r.location}<br>
                        <strong>ARTIGO:</strong> ${r.article}
                    </div>
                    <div class="record-time">Registrado em: ${r.time}</div>
                    <button class="delete-button" onclick="deleteRecord(${r.id})">EXCLUIR</button>
                </div>
            </div>
        </div>
    `).join("");
}

// Inicializa a renderização
render();
</script>

</body>
</html>
