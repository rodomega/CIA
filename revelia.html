<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>Controle de Revelia</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

body{
    background:
        repeating-linear-gradient(
            -45deg,
            #101010 0px,
            #101010 18px,
            #171717 18px,
            #171717 36px
        );
}

header{
    position:sticky;
    top:0;
    z-index:20;
    background:#111;
    border-bottom:3px solid #f5c400;
    padding:14px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
    color:#f5c400;
}

header p{
    margin:4px 0 0;
    font-size:11px;
    color:#bbb;
    text-transform:uppercase;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:20px 14px 40px;
}

/* FORMULÁRIO DE CADASTRO */

.form-box{
    background:#171717;
    border:1px solid #3b3b3b;
    border-radius:14px;
    padding:18px;
    margin-bottom:25px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}

.form-title{
    font-size:14px;
    color:#f5c400;
    font-weight:900;
    text-transform:uppercase;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.detected-type-badge{
    font-size:11px;
    padding:4px 8px;
    border-radius:6px;
    text-transform:uppercase;
    font-weight:bold;
    background:#2b2b2b;
    color:#aaa;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    color:#aaa;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:5px;
    font-weight:bold;
}

.field input, .field select{
    width:100%;
    background:#0d0d0d;
    border:1px solid #444;
    border-radius:9px;
    color:#fff;
    padding:12px;
    font-size:15px;
    outline:none;
    transition: border-color 0.2s;
}

.field input:focus, .field select:focus{
    border-color:#f5c400;
}

.row{
    display:flex;
    gap:10px;
}

.row .field{
    flex:1;
}

.save-button{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#f5c400;
    color:#111;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
    transition: transform 0.1s, background-color 0.2s;
}

.save-button:active{
    transform:scale(0.98);
    background:#e0b300;
}

/* LEGENDA DE CORES */

.legend-toggle{
    background:none;
    border:none;
    color:#f5c400;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    padding:0;
    margin-bottom:12px;
    text-decoration:underline;
    display:inline-block;
}

.legend-box{
    display:none;
    background:#141414;
    border:1px solid #333;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
    font-size:12px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
}

.legend-item:last-child{
    margin-bottom:0;
}

.legend-color{
    width:14px;
    height:14px;
    border-radius:3px;
    flex-shrink:0;
}

/* LISTA DE REGISTROS */

.list-section{
    margin-top:10px;
}

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.list-title{
    color:#f5c400;
    font-size:16px;
    font-weight:900;
}

.counter{
    color:#999;
    font-size:12px;
}

.clear-button{
    width:100%;
    margin-bottom:15px;
    padding:11px;
    background:#242424;
    color:#ff6666;
    border:1px solid #444;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* CARDS DE REGISTRO COM BORDAS COLORIDAS */

.record{
    background:#171717;
    border:1px solid #353535;
    border-left:6px solid #f5c400;
    border-radius:11px;
    padding:14px;
    margin-bottom:12px;
    position:relative;
}

.record.type-moto { border-left-color: #ffd700; }
.record.type-carro { border-left-color: #2196f3; }
.record.type-caminhao { border-left-color: #ff9800; }
.record.type-onibus { border-left-color: #9c27b0; }

.record.completed{
    opacity:.5;
    text-decoration:line-through;
}

.record-top{
    display:flex;
    align-items:flex-start;
    gap:12px;
}

.record-check{
    width:22px;
    height:22px;
    flex:none;
    accent-color:#f5c400;
    margin-top:2px;
    cursor:pointer;
}

.record-info{
    flex:1;
    min-width:0;
}

.record-header-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
}

.record-main{
    font-weight:900;
    font-size:16px;
    color:#fff;
}

.record-badge {
    font-size: 10px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
}

.badge-moto { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
.badge-carro { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
.badge-caminhao { background: rgba(255, 152, 0, 0.2); color: #ff9800; }
.badge-onibus { background: rgba(156, 39, 176, 0.2); color: #9c27b0; }

.record-details{
    margin-top:6px;
    color:#ccc;
    font-size:13px;
    line-height:1.5;
}

.record-time{
    color:#888;
    font-size:11px;
    margin-top:8px;
}

.delete-button{
    border:0;
    background:#292929;
    color:#ff6b6b;
    border-radius:7px;
    padding:6px 10px;
    font-weight:bold;
    font-size:12px;
    cursor:pointer;
    margin-top: 8px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#666;
    font-size:14px;
}

@media(max-width:420px){
    .row {
        flex-direction: column;
        gap:0;
    }
}
</style>
</head>

<body>

<header>
    <h1>CONTROLE DE REVELIA</h1>
    <p>Policiamento Rodoviário</p>
</header>

<div class="container">

    <!-- FORMULÁRIO -->
    <div class="form-box">
        <div class="form-title">
            <span>NOVO REGISTRO DE REVELIA</span>
            <span class="detected-type-badge" id="typeBadge">Carro</span>
        </div>

        <div class="row">
            <div class="field">
                <label>Placa</label>
                <input 
                    type="text" 
                    id="inputPlate" 
                    placeholder="ABC1D23" 
                    maxlength="7" 
                    style="text-transform:uppercase;" 
                >
            </div>
            <div class="field">
                <label>Cor</label>
                <input type="text" id="inputColor" placeholder="Ex: Preta">
            </div>
        </div>

        <div class="field">
            <label>Marca / Modelo</label>
            <input 
                type="text" 
                id="inputVehicle" 
                placeholder="Ex: Honda/Elite, Volkswagen Parati, Scania" 
                oninput="handleVehicleInput(this.value)"
            >
        </div>

        <div class="row">
            <div class="field">
                <label>SP (Rodovia)</label>
                <input type="text" id="inputSP" placeholder="Ex: SP 330">
            </div>
            <div class="field">
                <label>KM</label>
                <input type="text" id="inputKM" placeholder="Ex: 142">
            </div>
            <div class="field">
                <label>Sentido</label>
                <select id="inputSense">
                    <option value="Norte">Norte (N)</option>
                    <option value="Sul">Sul (S)</option>
                    <option value="Leste">Leste (L)</option>
                    <option value="Oeste">Oeste (O)</option>
                    <option value="Interior">Interior</option>
                    <option value="Capital">Capital</option>
                </select>
            </div>
        </div>

        <div class="field">
            <label>Artigo (Infração)</label>
            <input type="text" id="inputArticle" placeholder="Ex: Art. 230 V">
        </div>

        <button class="save-button" onclick="saveRecord()">ADICIONAR REVELIA</button>
    </div>

    <!-- LEGENDA -->
    <button class="legend-toggle" onclick="toggleLegend()"> Ver Legenda de Cores por Veículo</button>
    
    <div class="legend-box" id="legendBox">
        <div class="legend-item">
            <div class="legend-color" style="background:#ffd700;"></div>
            <span><strong>Amarelo:</strong> Motocicleta / Moto / Ciclomotor</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#2196f3;"></div>
            <span><strong>Azul:</strong> Carro / Automóvel / Camioneta</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff9800;"></div>
            <span><strong>Laranja:</strong> Caminhão / Carreta / Veículo Pesado</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#9c27b0;"></div>
            <span><strong>Roxo:</strong> Ônibus / Micro-ônibus</span>
        </div>
    </div>

    <!-- LISTA DE REGISTROS -->
    <div class="list-section">
        <div class="list-header">
            <div class="list-title">REVELIAS REGISTRADAS</div>
            <div class="counter" id="counter">0 registros</div>
        </div>

        <button class="clear-button" onclick="clearAllRecords()">APAGAR TODOS OS REGISTROS</button>

        <div id="records"></div>
    </div>

</div>

<script>
const STORAGE_KEY = "revelia_ocorrencias_v2";
let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let currentDetectedType = "carro";
let searchDebounceTimer = null;

/* =========================================================
   IDENTIFICAÇÃO VIA INTERNET (API FIPE) + LOCAL
========================================================= */

// 1. Dicionário Local Instantâneo para resposta sem delay
function getLocalVehicleType(text) {
    if (!text) return "carro";
    const str = text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    const motoKeywords = ["moto", "honda", "yamaha", "titan", "fan", "fazer", "biz", "cg", "cb", "twister", "pcx", "xj6", "hornet", "bmw gs", "pop", "bros", "crosser", "ybr", "factor", "scooter", "ciclomotor", "suzuki", "kawasaki", "ducati", "triumph", "royal enfield", "elite", "sh 150", "lead"];
    const caminhaoKeywords = ["caminhao", "scania", "volvo", "iveco", "daf", "mercedes axor", "actros", "constrained", "carreta", "cavalo", "caçamba", "cacamba", "baú", "bau", "vw constellation", "cargo", "f4000", "3/4", "mule", "volksbus"];
    const onibusKeywords = ["onibus", "micro-onibus", "microonibus", "marcopolo", "comil", "busscar", "caio", "van", "volare"];

    for (let word of motoKeywords) if (str.includes(word)) return "moto";
    for (let word of caminhaoKeywords) if (str.includes(word)) return "caminhao";
    for (let word of onibusKeywords) if (str.includes(word)) return "onibus";

    return "carro";
}

// 2. Consulta à API da FIPE via Internet
async function queryFipeCategoryOnline(text) {
    const cleanText = text.toLowerCase().trim();
    if (cleanText.length < 3) return;

    try {
        // Separa marca e modelo se usar barra ou espaço (ex: Honda/Elite)
        const parts = cleanText.split(/[\/\s]+/);
        const term = parts.length > 1 ? parts[1] : parts[0];

        // Consulta a API de busca de veículos da FIPE
        const res = await fetch(`https://parallelum.com.br/fipe/api/v1/motos/marcas`);
        if (res.ok) {
            const marcasMotos = await res.json();
            const isMotoBrand = marcasMotos.some(m => m.nome.toLowerCase().includes(parts[0]));
            if (isMotoBrand && parts.length > 1) {
                updateBadgeType("moto");
                return;
            }
        }
    } catch (e) {
        // Se a internet oscilar, mantém a detecção local
    }
}

function handleVehicleInput(value) {
    // Atualização instantânea local
    currentDetectedType = getLocalVehicleType(value);
    updateBadgeType(currentDetectedType);

    // Consulta de confirmação via internet com debounce
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        queryFipeCategoryOnline(value);
    }, 400);
}

function updateBadgeType(type) {
    currentDetectedType = type;
    const badge = document.getElementById("typeBadge");

    const labels = {
        "moto": "🛵 Moto",
        "carro": "🚗 Carro",
        "caminhao": "🚛 Caminhão",
        "onibus": "🚌 Ônibus"
    };

    badge.textContent = labels[type] || "Carro";
}

function toggleLegend() {
    const box = document.getElementById("legendBox");
    box.style.display = (box.style.display === "block") ? "none" : "block";
}

function saveRecord() {
    const vehicle = document.getElementById("inputVehicle").value.trim();
    const plate = document.getElementById("inputPlate").value.toUpperCase().replace(/[^A-Z0-9]/g, "").trim();
    const color = document.getElementById("inputColor").value.trim();
    const sp = document.getElementById("inputSP").value.trim();
    const km = document.getElementById("inputKM").value.trim();
    const sense = document.getElementById("inputSense").value;
    const article = document.getElementById("inputArticle").value.trim();

    if (!vehicle && !plate) {
        alert("Preencha ao menos o Veículo ou a Placa.");
        return;
    }

    let locationStr = "";
    if (sp) locationStr += sp + " ";
    if (km) locationStr += "KM " + km + " ";
    if (sense) locationStr += "Sentido " + sense;

    const newRecord = {
        id: Date.now(),
        vehicle: vehicle || "Não informado",
        plate: plate || "S/ PLACA",
        color: color || "N/I",
        location: locationStr.trim() || "Local não informado",
        article: article || "N/I",
        type: currentDetectedType,
        completed: false,
        time: new Date().toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" })
    };

    records.unshift(newRecord);
    saveAndRender();

    document.getElementById("inputVehicle").value = "";
    document.getElementById("inputPlate").value = "";
    document.getElementById("inputColor").value = "";
    document.getElementById("inputSP").value = "";
    document.getElementById("inputKM").value = "";
    document.getElementById("inputArticle").value = "";
    updateBadgeType("carro");
}

function toggleComplete(id) {
    records = records.map(r => r.id === id ? { ...r, completed: !r.completed } : r);
    saveAndRender();
}

function deleteRecord(id) {
    if (confirm("Deseja remover este registro?")) {
        records = records.filter(r => r.id !== id);
        saveAndRender();
    }
}

function clearAllRecords() {
    if (records.length === 0) return;
    if (confirm("ATENÇÃO: Tem certeza que deseja apagar TODOS os registros?")) {
        records
