<title>Códigos (SENATRAN) — Municípios de São Paulo</title>
<style>
:root {
  --bg-main: #000000;
  --bg-card: #121212;
  --accent: #eab308;
  --accent-hover: #facc15;
  --text-main: #f8fafc;
  --text-muted: #a1a1aa;
  --border-color: #27272a;
}

html, body {
  height: 100%;
  margin: 0;
  background-color: var(--bg-main);
  color: var(--text-main);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

.app {
  max-width: 980px;
  margin: 0 auto;
  padding: 24px 18px;
}

.card {
  background: var(--bg-card);
  padding: 20px;
  border-radius: 14px;
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
}

.controls {
  margin-bottom: 16px;
}

input.search {
  width: 100%;
  box-sizing: border-box;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  background: #18181b;
  color: var(--text-main);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input.search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.2);
}

input.search::placeholder {
  color: var(--text-muted);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  font-size: 13px;
  text-align: left;
  padding: 12px 10px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  position: sticky;
  top: 0;
  background: var(--bg-card);
  border-bottom: 2px solid var(--border-color);
}

tbody td {
  padding: 12px 10px;
  border-top: 1px solid var(--border-color);
  font-size: 15px;
}

tbody tr {
  transition: background 0.15s;
}

tbody tr:hover td {
  background: rgba(234, 179, 8, 0.08);
  color: #ffffff;
}

.no-results {
  padding: 30px;
  text-align: center;
  color: var(--text-muted);
}

.copy-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 14px;
  text-align: center;
}
</style>
</head>

function parseTokens(text){
  const tokens = text.replace(/\r/g,'\n').split(/\s+/).filter(Boolean);
  const items = [];
  let i = 0;
  while(i < tokens.length){
    const tok = tokens[i];
    if(/^[0-9]{3,5}$/.test(tok)){
      const code = tok;
      i++;
      const nameParts = [];
      while(i < tokens.length && !/^[0-9]{3,5}$/.test(tokens[i])){
        nameParts.push(tokens[i]);
        i++;
      }
      const nameRaw = nameParts.join(' ');
      const name = nameRaw.toLowerCase().split(' ').map(w=>{
        if(/^(d|do|da|dos|das|e)$/.test(w)) return w.toUpperCase();
        if(w.length===0) return w;
        return w[0].toUpperCase() + w.slice(1);
      }).join(' ');
      items.push({codigo: code, municipio: name, uf: 'SP'});
    } else {
      i++;
    }
  }
  return items;
}

let data = parseTokens(rawText);

const tbody = document.getElementById('tbody');
const q = document.getElementById('q');
const nores = document.getElementById('nores');

function renderList(list){
  tbody.innerHTML = '';
  if(!list.length){ nores.style.display='block'; return; }
  nores.style.display='none';
  const frag = document.createDocumentFragment();
  for(const row of list){
    const tr = document.createElement('tr');
    const td1 = document.createElement('td'); 
    td1.textContent = row.codigo;
    td1.style.color = 'var(--accent)';
    td1.style.fontWeight = '600';
    
    const td2 = document.createElement('td'); td2.textContent = row.municipio;
    const td3 = document.createElement('td'); td3.textContent = row.uf;
    
    tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
    tr.style.cursor='pointer';
    tr.title = 'Clique para copiar o código';
    
    tr.addEventListener('click', ()=> {
      const text = row.codigo;
      if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(()=> {
          tr.animate([{background:'rgba(234, 179, 8, 0.3)'},{background:'transparent'}],{duration:400});
        }).catch(()=> { alert('Código: ' + text); });
      } else {
        alert('Código: ' + text);
      }
    });
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

function normalize(s){
  return s.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
}

renderList(data);

q.addEventListener('input', ()=>{
  const v = normalize(q.value.trim());
  if(!v){ renderList(data); return; }
  const filtered = data.filter(r=>{
    return normalize(r.codigo).includes(v) || normalize(r.municipio).includes(v);
  });
  renderList(filtered);
});
