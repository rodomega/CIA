<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncClip - Preto & Amarelo</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --panel-color: #141414;
            --yellow: #ffcc00;
            --yellow-hover: #e6b800;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #262626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--panel-color);
            border: 2px solid var(--yellow);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.15);
        }

        h1 {
            color: var(--yellow);
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--yellow);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .code-display {
            font-size: 20px;
            font-weight: bold;
            color: var(--yellow);
            background: #000;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            border: 1px dashed var(--yellow);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--yellow);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }

        button {
            background-color: var(--yellow);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            width: 100%;
            margin-top: 8px;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--yellow-hover);
            box-shadow: 0 0 10px var(--yellow);
        }

        button.secondary {
            background-color: #262626;
            color: var(--yellow);
            border: 1px solid var(--yellow);
        }

        button.secondary:hover {
            background-color: #333333;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--yellow);
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .media-preview {
            margin-top: 10px;
            padding: 10px;
            background: #000;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
        }

        .media-preview img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 4px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Sync Clipboard</h1>

        <!-- Seção de Conexão por Código -->
        <div class="section">
            <label>O seu Código de Sincronização:</label>
            <div id="myCode" class="code-display">A GERAR...</div>
            
            <label style="margin-top: 15px;">Conectar a Outro Dispositivo:</label>
            <div class="flex-row">
                <input type="text" id="targetCodeInput" placeholder="EX: A7F3" maxlength="6">
                <button id="connectBtn" style="margin-top:0; width: 120px;">Conectar</button>
            </div>
            <div id="connectionStatus" class="status">A aguardar autenticação...</div>
        </div>

        <!-- Seção de Conteúdo (Área de Transferência) -->
        <div class="section" style="margin-bottom: 0;">
            <label>Área de Transferência Compartilhada:</label>
            <p style="font-size: 11px; color: var(--text-muted); margin: 0 0 8px 0;">Escreva, cole (Ctrl+V) ou escolha uma imagem/GIF local.</p>
            
            <textarea id="clipText" placeholder="Digite ou cole textos aqui..."></textarea>
            
            <div class="flex-row" style="margin-top: 8px;">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button type="button" class="secondary" id="selectFileBtn">📁 Escolher Ficheiro</button>
                <button type="button" id="sendBtn">📤 Enviar para o Canal</button>
            </div>
            
            <div class="media-preview" id="mediaPreview">
                <span style="color: var(--text-muted); font-size: 12px;">Nenhuma imagem/GIF carregada</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7u9yPMqkswESx3jJh4I4fCUS8tiu-MjM",
            authDomain: "rodoviariolimeira.firebaseapp.com",
            databaseURL: "https://rodoviariolimeira-default-rtdb.firebaseio.com",
            projectId: "rodoviariolimeira",
            storageBucket: "rodoviariolimeirafirebasestorage.app",
            messagingSenderId: "131653476917",
            appId: "1:131653476917:web:3758f0247b5be006c9077c",
            measurementId: "G-0CJ7FD2MN2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let myRoomCode = null;
        let currentMediaBase64 = null;

        function generateRandomCode() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let code = "";
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Autenticação anónima inicial
        signInAnonymously(auth)
            .then(() => {
                myRoomCode = generateRandomCode();
                document.getElementById("myCode").innerText = myRoomCode;
                document.getElementById("connectionStatus").innerText = "Pronto. O seu canal ativo é: " + myRoomCode;
            })
            .catch((error) => {
                console.error("Erro na autenticação:", error);
                document.getElementById("connectionStatus").innerText = "Erro ao autenticar.";
            });

        // Botão para selecionar ficheiro local (Imagens/GIFs)
        const fileInput = document.getElementById("fileInput");
        document.getElementById("selectFileBtn").addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (file) {
                processFile(file);
            }
        });

        // Suporte para colar imagens ou GIFs direto na textarea (Ctrl+V)
        const clipText = document.getElementById("clipText");
        clipText.addEventListener("paste", (event) => {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let index in items) {
                let item = items[index];
                if (item.kind === 'file') {
                    let blob = item.getAsFile();
                    processFile(blob);
                }
            }
        });

        function processFile(file) {
            let reader = new FileReader();
            reader.onload = function(e) {
                currentMediaBase64 = e.target.result;
                updateMediaPreview(currentMediaBase64, file.name || "midia");
            };
            reader.readAsDataURL(file);
        }

        function updateMediaPreview(base64Data, fileName) {
            const preview = document.getElementById("mediaPreview");
            preview.innerHTML = `
                <img src="${base64Data}" alt="Mídia">
                <a href="${base64Data}" download="${fileName}" style="background: var(--yellow); color: #000; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; display: inline-block;">⬇️ Descarregar Mídia</a>
            `;
        }

        // Botão Enviar: Envia o texto e a mídia para o seu próprio canal (para outros recolherem)
        document.getElementById("sendBtn").addEventListener("click", () => {
            if (!myRoomCode) {
                alert("Ainda a autenticar. Aguarde um instante.");
                return;
            }

            const textValue = clipText.value;
            const payload = {
                text: textValue,
                media: currentMediaBase64 || null
            };

            set(ref(db, 'rooms/' + myRoomCode), payload)
                .then(() => {
                    alert("Conteúdo enviado com sucesso para o canal " + myRoomCode + "!");
                })
                .catch((error) => {
                    alert("Erro ao enviar: " + error.message);
                });
        });

        // Botão Conectar: Puxa o conteúdo do código inserido no outro dispositivo
        document.getElementById("connectBtn").addEventListener("click", () => {
            const codeInput = document.getElementById("targetCodeInput").value.trim().toUpperCase();
            if (codeInput.length < 4) {
                alert("Digite um código válido de 4 caracteres.");
                return;
            }

            document.getElementById("connectionStatus").innerText = "A ligar ao canal " + codeInput + "...";

            const roomRef = ref(db, 'rooms/' + codeInput);
            get(roomRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.text !== undefined) {
                        clipText.value = data.text;
                    }
                    if (data.media) {
                        currentMediaBase64 = data.media;
                        updateMediaPreview(data.media, "recebido.png");
                    } else {
                        document.getElementById("mediaPreview").innerHTML = `<span style="color: var(--text-muted); font-size: 12px;">Nenhuma imagem/GIF neste canal</span>`;
                        currentMediaBase64 = null;
                    }
                    document.getElementById("connectionStatus").innerText = "Sincronizado com sucesso com o canal: " + codeInput;
                } else {
                    alert("Nenhum conteúdo encontrado para este código.");
                    document.getElementById("connectionStatus").innerText = "Canal vazio ou inexistente.";
                }
            }).catch((error) => {
                console.error(error);
                alert("Erro ao conectar ao canal.");
            });
        });
    </script>
</body>
</html>
