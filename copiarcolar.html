<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncClip - Preto & Amarelo</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --panel-color: #141414;
            --yellow: #ffcc00;
            --yellow-hover: #e6b800;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #262626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--panel-color);
            border: 2px solid var(--yellow);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.15);
        }

        h1 {
            color: var(--yellow);
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--yellow);
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .code-display {
            font-size: 20px;
            font-weight: bold;
            color: var(--yellow);
            background: #000;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            border: 1px dashed var(--yellow);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--yellow);
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }

        button {
            background-color: var(--yellow);
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            width: 100%;
            margin-top: 8px;
            font-size: 14px;
        }

        button:hover {
            background-color: var(--yellow-hover);
            box-shadow: 0 0 10px var(--yellow);
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }

        textarea:focus {
            border-color: var(--yellow);
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .media-preview {
            margin-top: 10px;
            padding: 10px;
            background: #000;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .media-preview img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 4px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Sync Clipboard</h1>

        <!-- Seção de Conexão por Código -->
        <div class="section">
            <label>Seu Código de Sincronização:</label>
            <div id="myCode" class="code-display">GERANDO...</div>
            
            <label style="margin-top: 15px;">Conectar a Outro Dispositivo:</label>
            <div class="flex-row">
                <input type="text" id="targetCodeInput" placeholder="EX: A7F3" maxlength="6">
                <button id="connectBtn" style="margin-top:0; width: 120px;">Conectar</button>
            </div>
            <div id="connectionStatus" class="status">Aguardando autenticação...</div>
        </div>

        <!-- Seção de Conteúdo (Área de Transferência) -->
        <div class="section" style="margin-bottom: 0;">
            <label>Área de Transferência Compartilhada:</label>
            <p style="font-size: 11px; color: var(--text-muted); margin: 0 0 8px 0;">Cole (Ctrl+V) textos, imagens ou GIFs aqui para sincronizar.</p>
            <textarea id="clipText" placeholder="Digite ou cole textos aqui..."></textarea>
            
            <div class="media-preview" id="mediaPreview">
                <span style="color: var(--text-muted); font-size: 12px;">Nenhuma imagem/GIF recebida</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 SUBSTITUA ABAIXO COM AS CONFIGURAÇÕES DO SEU PROJETO FIREBASE
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let activeRoom = null;
        let isUpdatingFromFirebase = false;

        function generateRandomCode() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let code = "";
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        signInAnonymously(auth)
            .then(() => {
                const code = generateRandomCode();
                activeRoom = code;
                document.getElementById("myCode").innerText = code;
                document.getElementById("connectionStatus").innerText = "Conectado. Canal ativo: " + code;
                
                listenToRoom(code);
            })
            .catch((error) => {
                console.error("Erro na autenticação:", error);
                document.getElementById("connectionStatus").innerText = "Erro ao autenticar.";
            });

        document.getElementById("connectBtn").addEventListener("click", () => {
            const codeInput = document.getElementById("targetCodeInput").value.trim().toUpperCase();
            if (codeInput.length < 4) {
                alert("Digite um código válido de 4 caracteres.");
                return;
            }
            activeRoom = codeInput;
            document.getElementById("connectionStatus").innerText = "Sincronizado com o canal: " + activeRoom;
            listenToRoom(activeRoom);
        });

        function listenToRoom(roomCode) {
            const roomRef = ref(db, 'rooms/' + roomCode);
            onValue(roomRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    isUpdatingFromFirebase = true;
                    if (data.text !== undefined) {
                        document.getElementById("clipText").value = data.text;
                    }
                    if (data.media) {
                        const preview = document.getElementById("mediaPreview");
                        preview.innerHTML = `<img src="${data.media}" alt="Mídia compartilhada">`;
                    }
                    setTimeout(() => { isUpdatingFromFirebase = false; }, 300);
                }
            });
        }

        const clipText = document.getElementById("clipText");

        clipText.addEventListener("input", () => {
            if (isUpdatingFromFirebase || !activeRoom) return;
            const textValue = clipText.value;
            set(ref(db, 'rooms/' + activeRoom + '/text'), textValue);
        });

        clipText.addEventListener("paste", (event) => {
            const items = (event.clipboardData || event.originalEvent.clipboardData).items;
            for (let index in items) {
                let item = items[index];
                if (item.kind === 'file') {
                    let blob = item.getAsFile();
                    let reader = new FileReader();
                    reader.onload = function(event) {
                        let base64Image = event.target.result;
                        document.getElementById("mediaPreview").innerHTML = `<img src="${base64Image}" alt="Mídia compartilhada">`;
                        if (activeRoom) {
                            set(ref(db, 'rooms/' + activeRoom + '/media'), base64Image);
                        }
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });
    </script>
</body>
</html>
