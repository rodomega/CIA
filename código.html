        function buildCategoryButtons() {
            dataset.forEach(group => {

                btn.setAttribute('data-cat', group.code);
                btn.className = `cat-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-extrabold uppercase transition-all bg-zinc-900 border border-zinc-700 text-brand-yellow hover:bg-brand-yellow hover:text-black hover:border-brand-yellow`;
                btn.innerText = group.code;
                btn.onclick = () => selectCategory(group.code);
                categoryFiltersContainer.appendChild(btn);
            });
        }

        // Selecionar categoria
        function selectCategory(catCode) {
            selectedCategory = catCode;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === catCode) {
                    btn.className = `cat-btn active bg-brand-yellow text-black font-extrabold px-3.5 py-1.5 rounded-lg text-xs md:text-sm uppercase transition-all shadow-md`;
                } else {
                    btn.className = `cat-btn px-3 py-1.5 rounded-lg text-xs md:text-sm font-extrabold uppercase transition-all bg-zinc-900 border border-zinc-800 text-brand-yellow hover:bg-brand-yellow hover:text-black hover:border-brand-yellow`;
                }
            });
            renderData();
        }

        // Função de normalização de texto para busca insensível a acentos
        function normalizeStr(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        }

        // Renderizar dados na tela
        function renderData() {
            dataContainer.innerHTML = '';
            let totalVisibleItems = 0;
            const query = normalizeStr(currentSearchQuery);

            dataset.forEach(group => {
                // Verificar filtro de categoria
                if (selectedCategory !== "ALL" && group.code !== selectedCategory) {
                    return;
                }

                // Filtrar itens do grupo pela busca
                const filteredItems = group.items.filter(item => {
                    const normCode = normalizeStr(item.code);
                    const normDesc = normalizeStr(item.desc);
                    return normCode.includes(query) || normDesc.includes(query);
                });

                if (filteredItems.length > 0) {
                    totalVisibleItems += filteredItems.length;

                    // Seção do grupo
                    const section = document.createElement('section');
                    section.className = "bg-brand-card border border-brand-cardBorder rounded-2xl p-4 md:p-5 shadow-lg transition-all";

                    // Título da Seção
                    const sectionTitle = document.createElement('h2');
                    sectionTitle.className = "text-base md:text-lg font-black text-brand-yellow border-b border-zinc-800 pb-2 mb-4 flex items-center justify-between";
                    sectionTitle.innerHTML = `
                        <span>${group.title}</span>
                        <span class="text-xs font-bold text-zinc-400 bg-zinc-900 px-2.5 py-1 rounded-full border border-zinc-800">${filteredItems.length}</span>
                    `;
                    section.appendChild(sectionTitle);

                    grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3";

                        const card = document.createElement('div');
                        card.className = "flex items-stretch bg-zinc-900/80 border border-zinc-800 rounded-xl overflow-hidden hover:border-brand-yellow/70 transition-all group shadow-sm";
                        
                        // Highlight se houver busca
                        let displayCode = item.code;
                        let displayDesc = item.desc;

                        card.innerHTML = `
                            <div class="bg-brand-yellow text-black font-mono font-black text-base md:text-lg px-3.5 py-2.5 flex items-center justify-center min-w-[75px] shrink-0 code-badge group-hover:bg-brand-yellowDark transition-colors">
                                ${displayCode}
                            </div>
                            <div class="p-2.5 flex items-center text-xs md:text-sm font-bold text-zinc-100 flex-grow leading-snug">
                                ${displayDesc}
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    dataContainer.appendChild(section);
                }
            });

            // Atualizar contadores e estado de visibilidade
            itemCountEl.innerText = totalVisibleItems;

            if (totalVisibleItems === 0) {
                noResultsEl.classList.remove('hidden');
                noResultsEl.classList.add('flex');
            } else {
                noResultsEl.classList.add('hidden');
                noResultsEl.classList.remove('flex');
            }

            // Exibir/Ocultar botão de redefinir filtros
            if (selectedCategory !== "ALL" || currentSearchQuery !== "") {
                resetFiltersBtn.classList.remove('hidden');
            } else {
                resetFiltersBtn.classList.add('hidden');
            }
        }

        // Eventos de Busca
        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value.trim();
            if (currentSearchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderData();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchQuery = '';
            clearSearchBtn.classList.add('hidden');
            searchInput.focus();
            renderData();
        });

        resetFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearchQuery = '';
            clearSearchBtn.classList.add('hidden');
            selectCategory('ALL');
        });

        // Botão voltar ao topo
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.remove('hidden');
            } else {
                scrollTopBtn.classList.add('hidden');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Inicializar
        window.onload = () => {
            buildCategoryButtons();
            renderData();
        };
    </script>
</body>
</html>
